:root{--ink:#2a1043;--cream:#fff6e4;--gold:#ffcf33;--gold-d:#e8a514;--green:#4fe07a;--green-d:#22a650;--pink:#ff5b9a;--pink-d:#d62f73;--red:#ff3e62;--sky:#5a34d6;--blue:#3fb2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#5a34d6;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Fredoka',system-ui,sans-serif;font-weight:600;color:var(--ink)}
canvas#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ink)}
button:focus{outline:none}
button:focus-visible{outline:4px solid #fff;outline-offset:2px}
.lg{font-family:'Luckiest Guy','Fredoka',sans-serif;font-weight:400;letter-spacing:.5px}
#haul,.btn,#rTitle,.rHaul,#rRecord,.rBest small,.rBest b,.cHead h2,.back,.wallet,.up b,#bookCount,#bkTitle b,#bkInfo b,#pauseOv h2,#streakTag{text-transform:uppercase}
.btn small{text-transform:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.pill{display:flex;align-items:center;gap:6px;background:var(--cream);border:3.5px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);height:40px;padding:0 14px 0 6px}
#haulBox{min-width:96px;transition:transform .12s}
#haulBox.bump{transform:scale(1.14)}
#haul{font-family:'Luckiest Guy',sans-serif;font-size:23px;line-height:1;padding-top:4px}
.coinI{width:26px;height:26px;flex:none;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff6b8 0 18%,#ffd23d 19% 62%,#e8a514 63%);border:3px solid var(--ink);display:inline-block}
#mid{flex:1;max-width:250px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;opacity:0;transition:opacity .3s}
body.running #mid{opacity:1}
#nightBox{gap:6px;padding:0 8px 0 12px}
#nightLbl{font-family:'Luckiest Guy',sans-serif;font-size:15px;padding-top:3px;white-space:nowrap;text-transform:uppercase}
#mood{display:flex;align-items:center;gap:5px;margin:0 10px;background:rgba(42,16,67,.55);border-radius:999px;padding:2px 4px}
#moodTrack{flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,#5ccf63,#ffcf33 55%,#ff3e62);border:2px solid var(--ink);position:relative}
#moodDot{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:left .15s}
#mood.hot #moodTrack{animation:moodShake .3s infinite}
@keyframes moodShake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
body.land #hud{flex-wrap:wrap}
body.land #mid{position:fixed;left:10px;top:calc(56px + env(safe-area-inset-top));width:250px;margin:0}
#nightBar{flex:1;height:14px;border-radius:9px;background:#3b2160;border:2.5px solid var(--ink);overflow:hidden;position:relative}
#nightFill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#b16bff,#ff7bb0 60%,#ffcf33);border-radius:6px}
.hb{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:var(--cream);border:3.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;flex:none}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hb svg{width:24px;height:24px}
#bBook{display:none}
body.idle #bBook{display:grid}
#streakTag{display:none;font-family:'Luckiest Guy',sans-serif;font-size:15px;color:#fff;-webkit-text-stroke:0;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);margin-top:10px}

/* panels */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10;background:rgba(42,16,67,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.card{position:relative;width:100%;max-width:400px;max-height:100%;overflow-y:auto;background:var(--cream);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:16px 16px 14px;transform:translateY(30px) scale(.94);transition:transform .32s cubic-bezier(.2,1.6,.4,1)}
.ov.on .card{transform:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);
  font-family:'Luckiest Guy',sans-serif;font-size:22px;padding:12px 10px 8px;background:#fff;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn small{display:block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:12px;letter-spacing:0;opacity:.85;margin-top:2px}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold)}
.btn.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.big{font-size:28px;padding:14px 10px 10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{font-size:17px;padding:10px 4px 6px;position:relative}
.dot{position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);border:3px solid var(--ink);display:none}
.dot.on{display:block;animation:dotp .9s infinite}
@keyframes dotp{50%{transform:scale(1.25)}}
#rTitle{font-family:'Luckiest Guy',sans-serif;font-size:46px;line-height:1;text-align:center;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);margin:2px 0 2px;letter-spacing:1px}
#rTitle.win{color:var(--gold)}
#rSub{text-align:center;font-size:15px;opacity:.85;margin-bottom:8px}
.rHaul{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Luckiest Guy',sans-serif;font-size:42px;line-height:1}
.rHaul .coinI{width:36px;height:36px}
.rHaul b{font-weight:400;padding-top:6px}
#rLost{font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;color:var(--red);text-decoration:line-through}
#rBonus{font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;color:#20a050}
#rRecord{display:none;text-align:center;font-family:'Luckiest Guy',sans-serif;color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:10px;width:max-content;margin:4px auto 0;padding:4px 10px 1px;transform:rotate(-3deg)}
.rBest{display:flex;align-items:center;gap:10px;background:#3b2160;border:4px solid var(--ink);border-radius:20px;padding:6px 12px 6px 6px;margin:10px 0 12px;color:#fff;min-height:104px}
.rBest canvas{width:96px;height:96px;flex:none}
.rBest small{display:block;font-family:'Luckiest Guy',sans-serif;font-size:15px;letter-spacing:1px}
.rBest b{display:block;font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:21px;line-height:1.05;margin:2px 0 4px}
.rBest span{font-size:13px;opacity:.9}
#bSecond{margin-bottom:10px;flex-direction:column;gap:0;animation:wig 1.6s infinite}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-2deg)}90%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
#bDaily{margin-top:10px;font-size:18px;flex-direction:column;gap:0}
.cHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cHead h2{flex:1;margin:0;font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:28px;padding-top:4px}
.back{width:44px;height:44px;border-radius:14px;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:#fff;font-family:'Luckiest Guy',sans-serif;font-size:26px;padding:4px 0 0;flex:none}
.wallet{display:flex;align-items:center;gap:5px;font-family:'Luckiest Guy',sans-serif;font-size:20px;padding-top:3px}
.up{display:flex;align-items:center;gap:10px;border:4px solid var(--ink);border-radius:18px;background:#fff;padding:8px;margin-bottom:8px;box-shadow:0 4px 0 var(--ink)}
.up canvas{width:52px;height:52px;flex:none;border-radius:12px;background:#3b2160}
.up .ut{flex:1;min-width:0}
.up b{display:block;font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:19px;padding-top:3px}
.up span{display:block;font-size:13px;opacity:.8}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:14px;height:7px;border-radius:4px;background:#e2d6f0;border:1.5px solid var(--ink)}
.pips i.on{background:var(--green)}
.up .btn{width:auto;min-width:86px;font-size:17px;padding:8px 8px 5px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
#bookCount{font-family:'Luckiest Guy',sans-serif;font-size:18px;padding-top:3px}
.bkNav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bkNav .back{width:40px;height:40px}
#bkTitle{flex:1;text-align:center;line-height:1.05}
#bkTitle b{display:block;font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:22px;padding-top:3px}
#bkTitle small{font-size:13px;opacity:.8}
#bkGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cell{aspect-ratio:1;border-radius:14px;border:3.5px solid var(--ink);background:#3b2160;position:relative;padding:0;overflow:hidden}
.cell canvas{width:100%;height:100%;display:block}
.cell.sel{outline:4px solid var(--gold);outline-offset:1px}
.cell i{position:absolute;bottom:2px;right:3px;font-style:normal;font-size:11px;font-weight:700;color:#fff}
#bkInfo{margin-top:10px;text-align:center;font-size:14px;min-height:40px;line-height:1.3}
#bkInfo b{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:18px}
#bkDots{display:flex;justify-content:center;gap:4px;margin-top:8px;flex-wrap:wrap}
#bkDots i{width:8px;height:8px;border-radius:50%;background:#d8c9ea}
#bkDots i.on{background:var(--ink)}
#pauseOv .card{max-width:320px;text-align:center}
#pauseOv h2{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:40px;margin:6px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;transition:all .25s;z-index:20;
  background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:16px;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.evs{display:none;background:linear-gradient(90deg,#33206e,#7a3fd0);color:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px 12px 10px;margin:0 0 10px;box-shadow:0 4px 0 var(--ink)}

<script>
/* Fonts: Luckiest Guy (Apache 2.0, Astigmatic), Fredoka (SIL OFL 1.1). */
/* Don't Wake the Giant: procedural art (no image files).
   Everything is drawn with canvas paths in local units. Outline ink is a deep purple, never black. */
const Art = (function () {
'use strict';
const TAU = Math.PI * 2;
const OL = '#2a1043';

// ---------------------------------------------------------------- colour helpers
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function shade(hex, amt) { const [r, g, b] = hexToRgb(hex); if (amt >= 0) return rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt); return rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt)); }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
function hsl(h, s, l) { return 'hsl(' + (((h % 360) + 360) % 360).toFixed(0) + ',' + s + '%,' + l + '%)'; }

// ---------------------------------------------------------------- path helpers
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r); c.lineTo(x + r, y + h);
  c.arcTo(x, y + h, x, y + h - r, r); c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r); c.closePath();
}
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.01, r), 0, TAU); }
function blob(c, pts) { // smooth closed curve through points
  const n = pts.length; c.beginPath();
  for (let i = 0; i < n; i++) {
    const p0 = pts[i], p1 = pts[(i + 1) % n];
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    if (i === 0) { const pl = pts[n - 1]; c.moveTo((pl[0] + p0[0]) / 2, (pl[1] + p0[1]) / 2); }
    c.quadraticCurveTo(p0[0], p0[1], mx, my);
  }
  c.closePath();
}
function fillStroke(c, fill, lw, stroke) { c.fillStyle = fill; c.fill(); if (lw) { c.lineWidth = lw; c.strokeStyle = stroke || OL; c.lineJoin = 'round'; c.stroke(); } }
function star(c, x, y, r, r2, n, rot) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n - Math.PI / 2, rr2 = i % 2 ? r2 : r; c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  c.closePath();
}
function sparkle(c, x, y, r, col) { // four-point twinkle
  c.beginPath(); c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r);
  c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fillStyle = col || '#fff'; c.fill();
}

// ---------------------------------------------------------------- rarity
const RARITY = [
  { id: 'common',    name: 'Common',    col: '#c3c9d8', glow: 'rgba(255,255,255,0)', value: 5 },
  { id: 'uncommon',  name: 'Uncommon',  col: '#4fe07a', glow: 'rgba(79,224,122,', value: 15 },
  { id: 'rare',      name: 'Rare',      col: '#3fb2ff', glow: 'rgba(63,178,255,', value: 45 },
  { id: 'epic',      name: 'Epic',      col: '#c071ff', glow: 'rgba(192,113,255,', value: 130 },
  { id: 'legendary', name: 'Legendary', col: '#ffc531', glow: 'rgba(255,197,49,', value: 420 },
  { id: 'mythic',    name: 'Mythic',    col: '#ff5bd8', glow: 'rgba(255,91,216,', value: 1500 }
];
function rarityCol(r, t) { return r === 5 ? hsl(t * 140, 100, 66) : RARITY[r].col; }

function aura(c, r, rad, t, strong) {
  if (r <= 0) return;
  const col = r === 5 ? null : RARITY[r].glow;
  const k = strong ? 1 : 0.75;
  if (r >= 4) { // rotating rays
    c.save(); c.rotate(t * (r === 5 ? 0.9 : 0.6));
    const n = r === 5 ? 12 : 10;
    for (let i = 0; i < n; i++) {
      c.rotate(TAU / n);
      c.beginPath(); c.moveTo(0, 0); c.lineTo(-rad * 0.22, -rad * 2.05); c.lineTo(rad * 0.22, -rad * 2.05); c.closePath();
      c.fillStyle = r === 5 ? hsl(t * 140 + i * 30, 100, 70) : 'rgba(255,226,120,1)';
      c.globalAlpha = 0.28 * k; c.fill();
    }
    c.restore(); c.globalAlpha = 1;
  }
  const g = c.createRadialGradient(0, 0, rad * 0.3, 0, 0, rad * (r >= 3 ? 1.75 : 1.45));
  if (r === 5) { g.addColorStop(0, hsl(t * 140, 100, 75)); g.addColorStop(0.5, hsl(t * 140 + 60, 100, 65).replace('hsl', 'hsla').replace(')', ',0.45)')); g.addColorStop(1, 'rgba(255,90,220,0)'); }
  else { g.addColorStop(0, col + (0.85 * k) + ')'); g.addColorStop(0.55, col + (0.35 * k) + ')'); g.addColorStop(1, col + '0)'); }
  c.fillStyle = g; circ(c, 0, 0, rad * (r >= 3 ? 1.75 : 1.45)); c.fill();
}

// ---------------------------------------------------------------- faces
function eye(c, x, y, r, o, side) {
  // o: {blink 0..1, lx, ly (look -1..1), scared, sleepy}
  const blink = o.blink || 0;
  if (blink > 0.85 || o.sleep) { // closed: happy arc
    c.beginPath(); c.arc(x, y - r * 0.2, r * 0.75, 0.15 * Math.PI, 0.85 * Math.PI);
    c.lineWidth = Math.max(2.6, r * 0.32); c.strokeStyle = OL; c.lineCap = 'round'; c.stroke(); return;
  }
  const ry = r * (1 - blink);
  ell(c, x, y, r, ry); fillStroke(c, '#fff', Math.max(2.2, r * 0.22));
  c.save(); ell(c, x, y, r, ry); c.clip();
  const pr = o.scared ? r * 0.32 : r * 0.58;
  const px = x + (o.lx || 0) * r * 0.32, py = y + (o.ly || 0) * r * 0.32 + r * 0.06;
  if (o.glow) { circ(c, px, py, pr * 1.6); c.fillStyle = 'rgba(70,255,170,0.35)'; c.fill(); }
  circ(c, px, py, pr); c.fillStyle = o.glow ? '#22e08e' : '#1d0d2e'; c.fill();
  circ(c, px - pr * 0.35, py - pr * 0.4, pr * 0.38); c.fillStyle = '#fff'; c.fill();
  c.restore();
}
function mouth(c, kind, x, y, w, o) {
  c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = OL; c.lineWidth = Math.max(2.4, w * 0.16);
  if (o && o.scared) { ell(c, x, y + 2, w * 0.28, w * 0.36); fillStroke(c, '#5a1035', c.lineWidth * 0.8); return; }
  switch (kind) {
    case 'smile': c.beginPath(); c.arc(x, y - w * 0.35, w * 0.5, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke(); break;
    case 'grin': c.beginPath(); c.moveTo(x - w * 0.55, y - w * 0.1); c.quadraticCurveTo(x, y + w * 0.7, x + w * 0.55, y - w * 0.1); c.closePath(); fillStroke(c, '#5a1035', c.lineWidth * 0.8);
      c.save(); c.clip(); ell(c, x, y + w * 0.42, w * 0.3, w * 0.18); c.fillStyle = '#ff6f91'; c.fill(); c.restore(); break;
    case 'teeth': {
      c.beginPath(); c.moveTo(x - w * 0.7, y - w * 0.1); c.quadraticCurveTo(x, y + w * 0.75, x + w * 0.7, y - w * 0.1); c.closePath();
      fillStroke(c, '#5a1035', c.lineWidth * 0.8);
      c.save(); c.clip(); c.fillStyle = '#fff';
      for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(x + i * w * 0.2 - w * 0.1, y - w * 0.12); c.lineTo(x + i * w * 0.2, y + w * 0.14); c.lineTo(x + i * w * 0.2 + w * 0.1, y - w * 0.12); c.fill(); }
      c.restore(); c.beginPath(); c.moveTo(x - w * 0.7, y - w * 0.1); c.quadraticCurveTo(x, y + w * 0.75, x + w * 0.7, y - w * 0.1); c.closePath(); c.stroke(); break;
    }
    case 'o': ell(c, x, y, w * 0.2, w * 0.24); fillStroke(c, '#5a1035', c.lineWidth * 0.8); break;
    case 'flat': c.beginPath(); c.moveTo(x - w * 0.35, y); c.lineTo(x + w * 0.35, y); c.stroke(); break;
    case 'wavy': c.beginPath(); c.moveTo(x - w * 0.45, y); c.quadraticCurveTo(x - w * 0.22, y - w * 0.25, x, y); c.quadraticCurveTo(x + w * 0.22, y + w * 0.25, x + w * 0.45, y); c.stroke(); break;
    case 'cat': c.beginPath(); c.moveTo(x - w * 0.4, y - w * 0.05); c.quadraticCurveTo(x - w * 0.2, y + w * 0.3, x, y); c.quadraticCurveTo(x + w * 0.2, y + w * 0.3, x + w * 0.4, y - w * 0.05); c.stroke(); break;
    case 'tongue': c.beginPath(); c.arc(x, y - w * 0.3, w * 0.5, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
      ell(c, x + w * 0.12, y + w * 0.22, w * 0.15, w * 0.18); fillStroke(c, '#ff6f91', c.lineWidth * 0.7); break;
  }
}
function cheeks(c, x, y, r) { c.fillStyle = 'rgba(255,105,150,0.55)'; ell(c, -x, y, r, r * 0.6); c.fill(); ell(c, x, y, r, r * 0.6); c.fill(); }

// ---------------------------------------------------------------- the 16 base creatures
// Each: first/last name halves, palette c1 main, c2 secondary, c3 accent, seam extent at x=0, draw(c, p, o)
// Drawing is symmetric so a creature can be split down the middle and stitched to another.
const LW = 4.2;
const BASES = [
  { id: 'toast', first: 'Toasty', last: 'Crumbolo', c1: '#e3913d', c2: '#fbe0a4', c3: '#ffe66b', seam: [-40, 42],
    draw(c, p, o) {
      const path = () => { c.beginPath(); c.moveTo(-38, 42); c.lineTo(38, 42); c.lineTo(38, -8); c.bezierCurveTo(52, -36, 22, -52, 0, -38); c.bezierCurveTo(-22, -52, -52, -36, -38, -8); c.closePath(); };
      path(); fillStroke(c, p.c1, LW);
      c.save(); c.translate(0, 4); c.scale(0.8, 0.8); path(); c.fillStyle = p.c2; c.fill(); c.restore();
      rr(c, -12, -30, 24, 16, 5); fillStroke(c, p.c3, 3);
      eye(c, -14, 2, 7.5, o, -1); eye(c, 14, 2, 7.5, o, 1); cheeks(c, 23, 14, 6); mouth(c, 'smile', 0, 20, 16, o);
    } },
  { id: 'shark', first: 'Sharko', last: 'Chompini', c1: '#5d8ff0', c2: '#eef6ff', c3: '#3b62c4', seam: [-56, 38],
    draw(c, p, o) {
      c.beginPath(); c.moveTo(-16, -26); c.quadraticCurveTo(-4, -48, 2, -58); c.quadraticCurveTo(12, -36, 18, -26); c.closePath(); fillStroke(c, p.c3, LW);
      c.beginPath(); c.moveTo(-40, 8); c.lineTo(-56, 26); c.lineTo(-30, 22); c.closePath(); fillStroke(c, p.c3, LW);
      c.beginPath(); c.moveTo(40, 8); c.lineTo(56, 26); c.lineTo(30, 22); c.closePath(); fillStroke(c, p.c3, LW);
      ell(c, 0, 6, 44, 33); fillStroke(c, p.c1, LW);
      c.save(); ell(c, 0, 6, 44, 33); c.clip(); ell(c, 0, 34, 36, 24); c.fillStyle = p.c2; c.fill(); c.restore();
      ell(c, 0, 6, 44, 33); c.lineWidth = LW; c.strokeStyle = OL; c.stroke();
      c.lineWidth = 3; c.strokeStyle = shade(p.c1, -0.35); c.beginPath(); c.moveTo(-30, -8); c.lineTo(-26, 2); c.moveTo(-24, -10); c.lineTo(-20, 0); c.moveTo(30, -8); c.lineTo(26, 2); c.moveTo(24, -10); c.lineTo(20, 0); c.stroke();
      eye(c, -15, -8, 8, o, -1); eye(c, 15, -8, 8, o, 1);
      c.lineWidth = 4; c.strokeStyle = OL; c.lineCap = 'round'; c.beginPath(); c.moveTo(-24, -20); c.lineTo(-8, -16); c.moveTo(24, -20); c.lineTo(8, -16); c.stroke();
      mouth(c, 'teeth', 0, 14, 26, o);
    } },
  { id: 'frog', first: 'Froggo', last: 'Ribbitz', c1: '#57d35a', c2: '#cdf59b', c3: '#ff8db4', seam: [-30, 42],
    draw(c, p, o) {
      c.beginPath(); c.ellipse(0, 12, 46, 31, 0, 0, TAU); c.moveTo(-6, -22); c.arc(-22, -22, 16, 0, TAU); c.moveTo(38, -22); c.arc(22, -22, 16, 0, TAU);
      fillStroke(c, p.c1, 0);
      circ(c, -22, -22, 16); fillStroke(c, p.c1, LW); circ(c, 22, -22, 16); fillStroke(c, p.c1, LW);
      ell(c, 0, 12, 46, 31); fillStroke(c, p.c1, LW);
      c.beginPath(); c.arc(-22, -22, 15, 0.6, Math.PI - 0.6, true); c.fillStyle = p.c1; c.fill(); c.beginPath(); c.arc(22, -22, 15, 0.6, Math.PI - 0.6, true); c.fill();
      ell(c, 0, 26, 30, 15); c.fillStyle = p.c2; c.fill();
      eye(c, -22, -23, 10, o, -1); eye(c, 22, -23, 10, o, 1);
      cheeks(c, 30, 14, 7); mouth(c, 'grin', 0, 6, 34, o);
    } },
  { id: 'cactus', first: 'Spiky', last: 'Cactelli', c1: '#3fc06f', c2: '#2a8f50', c3: '#ff7ab8', seam: [-58, 46],
    draw(c, p, o) {
      rr(c, -46, -10, 22, 34, 11); fillStroke(c, p.c1, LW); rr(c, -42, 8, 22, 14, 7); c.fillStyle = p.c1; c.fill();
      rr(c, 24, -24, 22, 34, 11); fillStroke(c, p.c1, LW); rr(c, 20, -2, 22, 14, 7); c.fill();
      rr(c, -25, -44, 50, 90, 25); fillStroke(c, p.c1, LW);

function updateMuteIcon() {
  $('waves').style.display = save.muted ? 'none' : ''; $('xx').style.display = save.muted ? '' : 'none';
  $('bMute').setAttribute('aria-label', save.muted ? 'Unmute sound' : 'Mute sound');
}
$('bMute').addEventListener('click', () => { Sfx.unlock(); toggleMute(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Sfx.setHidden(true); if (G.mode === 'run') pause(); }
  else Sfx.setHidden(false);
});
window.addEventListener('pagehide', () => persist());
Ads.hooks.pause = () => { G.adPause = true; Sfx.adMute(true); };
Ads.hooks.resume = () => { G.adPause = false; Sfx.adMute(false); };
function updateHud() { $('haul').textContent = fmt(G.haul); lastHaulShown = G.haul; $('nightLbl').textContent = G.daily ? 'Daily #' + dayNo() : 'Night ' + nightLevel(); }

// ---------------------------------------------------------------- loop
let last = 0, fps = 60, fpsAcc = 0, fpsN = 0, cpuMs = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1 / 20, Math.max(0, (now - last) / 1000 || 1 / 60)); last = now;
  const t0 = performance.now();
  update(dt);
  render();
  cpuMs = cpuMs * 0.95 + (performance.now() - t0) * 0.05;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
}

window.__dw = {
  stats: () => ({ mode: G.mode, phase: giant.phase, tellLeft: giant.phase === 'tell' ? giant.tell - giant.pt : 0, arm: arm.st, d: Math.round(arm.d), passed: arm.passed,
    haul: G.haul, wallet: save.wallet, R: Math.round(G.R), night: +G.night.toFixed(1), grabs: G.grabs, totalGrabs: G.totalGrabs, caughts: G.caughts, escapes: G.escapes,
    closeCalls: G.closeCalls, runs: save.runs, paused: G.paused, ad: G.adPause, panel: openPanel, sdk: Ads.kind, fps, cpuMs: +cpuMs.toFixed(2), book: bookCount(),
    usedSecond: G.usedSecond, daily: G.daily, maxSlot: maxSlot(), held, upg: save.upg,
    event: EVENT, version: VERSION, hwFound: hwFound(), cos: Object.assign({}, save.cos), slips: G.slips, spookyBanked: G.spookyBanked, bookNB: bookNB(), flare: +giant.v.flare.toFixed(2) }),
  eventFor(y, m, d) { return eventFor(new Date(y, m - 1, d, 12)); },
  ghostAmt(k) { return slots[k] && slots[k].item ? +ghostAmt(slots[k].item).toFixed(2) : 0; },
  // tests: set where slot k's Spooky creature is in its fade loop 0.35 s from now (0.26 solid, 0.76 faded)
  phase(k, x) { const it = slots[k].item; if (!it) return; it.ph = ((((x - (G.t + 0.35) * 0.42) % 1) + 1) % 1) / 0.17; },
  // tests: roll n items for slot k and count the Halloween ones (consumes the item dice)
  sample(n, k) { let hw = 0, sp = 0; for (let i = 0; i < n; i++) { const it = makeItem(k); if (A.isHwSpecies(it.sid)) hw++; if (it.mut === 5) sp++; } return { hw, spooky: sp }; },
  press, release,
  slots: () => slots.map((s, k) => s.item ? { k, r: s.item.r, mut: s.item.mut, hw: A.isHwSpecies(s.item.sid) } : { k, r: -1 }),
  step(ms) { const n = Math.round(ms / (1000 / 60)); for (let i = 0; i < n; i++) update(1 / 60); render(); },
  sim(ms) { const n = Math.round(ms / (1000 / 60)); for (let i = 0; i < n; i++) update(1 / 60); },
  reset(daily) { show(null); G.resultsCounted = false; resetRun(daily); thief.enterT = 1; },
  give(n) { save.wallet += n; persist(); },
  force(k, r, mut, a, b) { const it = makeItem(k, { r, mut, pair: a !== undefined ? [a, b] : undefined }); slots[k].item = it; slots[k].pop = 0; return it.sid; },
  setNight(s) { G.night = s; },
  stir() { giant.forceStir = true; if (giant.phase === 'sleep') giant.b = Math.max(giant.b, 0.97); } // store media: a real stir starts now
};

// ---------------------------------------------------------------- boot
resize();
window.addEventListener('resize', () => { resize(); if (CAPTURE) render(); });
Sfx.setMuted(save.muted); updateMuteIcon();
if (HW) { Sfx.theme('halloween'); document.body.classList.add('hw'); }
$('ver').textContent = 'v' + VERSION + (HW ? ', Halloween' : '');
resetRun(false);
thief.enterT = 1;
if (Q.has('tut0')) save.tut = 0;
const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('40px "Luckiest Guy"'), document.fonts.load('600 16px Fredoka'), document.fonts.load('700 16px Fredoka')]).catch(() => null) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  pileDirty = true;
  if (CAPTURE) { render(); window.__ready = true; } else { last = performance.now(); requestAnimationFrame(frame); window.__ready = true; }
});
Ads.init().then(() => {
  const st = Ads.storage();
  if (st) {
    Store.use(st);
    if (G.mode === 'ready' && G.sessionRuns === 0) { loadSave(); Sfx.setMuted(save.muted); updateMuteIcon(); }
  }
  Ads.loadingFinished();
});
})();

</script>
</body>
</html>
