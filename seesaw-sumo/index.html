}

// ---------------------------------------------------------------- Halloween props
// a jack-o'-lantern: x,y centre, R radius, ang roll angle, lit 0..1 (glow inside the carved face), mood 'grin' or 'shock'
function drawPumpkin(ctx, x, y, R, ang, lit, mood) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang || 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const lw = Math.max(2, R * 0.11);
  // ribs: outer lobes first, middle on top
  const lobes = [[-0.48, 0.62], [0.48, 0.62], [-0.2, 0.7], [0.2, 0.7], [0, 0.6]];
  for (const [ox, w] of lobes) {
    const g = ctx.createLinearGradient(0, -R, 0, R);
    g.addColorStop(0, '#ffb24a'); g.addColorStop(0.55, '#ff8a1f'); g.addColorStop(1, '#d9590a');
    ctx.fillStyle = g; ctx.strokeStyle = INK; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.ellipse(ox * R, R * 0.04, w * R, R * 0.92, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  // stem
  ctx.fillStyle = '#5d8a2a'; ctx.lineWidth = lw * 0.8;
  ctx.beginPath(); ctx.moveTo(-R * 0.13, -R * 0.82); ctx.quadraticCurveTo(-R * 0.1, -R * 1.15, R * 0.12, -R * 1.25); ctx.lineTo(R * 0.2, -R * 1.1); ctx.quadraticCurveTo(R * 0.08, -R * 1.02, R * 0.13, -R * 0.82); ctx.closePath(); ctx.fill(); ctx.stroke();
  // gloss
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-R * 0.42, -R * 0.45, R * 0.16, R * 0.09, -0.7, 0, TAU); ctx.fill();
  // carved face, lit from inside
  const glow = lit === undefined ? 1 : lit;
  const face = glow > 0.5 ? '#fff27a' : '#ffb703';
  ctx.fillStyle = INK;
  const eye = (sx) => { ctx.beginPath(); ctx.moveTo(sx * R * 0.38, -R * 0.08); ctx.lineTo(sx * R * 0.12, -R * 0.08); ctx.lineTo(sx * R * 0.27, -R * 0.4); ctx.closePath(); };
  for (const sx of [-1, 1]) { eye(sx); ctx.fill(); }
  ctx.save(); ctx.fillStyle = face; ctx.globalAlpha = 0.55 + glow * 0.45;
  for (const sx of [-1, 1]) { ctx.save(); ctx.translate(sx * R * 0.02, R * 0.03); ctx.scale(0.72, 0.72); eye(sx); ctx.fill(); ctx.restore(); }
  ctx.restore();
  ctx.beginPath();
  if (mood === 'shock') { ctx.ellipse(0, R * 0.38, R * 0.16, R * 0.2, 0, 0, TAU); }
  else {
    ctx.moveTo(-R * 0.5, R * 0.15); ctx.quadraticCurveTo(0, R * 0.32, R * 0.5, R * 0.15);
    ctx.quadraticCurveTo(R * 0.36, R * 0.62, 0, R * 0.64); ctx.quadraticCurveTo(-R * 0.36, R * 0.62, -R * 0.5, R * 0.15); ctx.closePath();
  }
  ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = face; ctx.globalAlpha = 0.55 + glow * 0.45;
  ctx.beginPath(); ctx.ellipse(0, R * 0.47, R * 0.42, R * 0.13, 0, 0, TAU); ctx.fill();
  if (mood !== 'shock') { ctx.fillStyle = INK; ctx.globalAlpha = 1; ctx.fillRect(-R * 0.2, R * 0.2, R * 0.12, R * 0.16); ctx.fillRect(R * 0.1, R * 0.4, R * 0.12, R * 0.3); }
  ctx.restore();
  ctx.restore();
}

// a knocked-out blob's ghost: a sheet with a wavy hem, the blob's colour faintly showing through
function drawGhost(ctx, x, y, r, t, skin, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha === undefined ? 0.9 : alpha;
  const sw = Math.sin(t * 6) * r * 0.08;
  ctx.beginPath();
  ctx.moveTo(-r * 0.92, r * 0.1); ctx.bezierCurveTo(-r * 0.95, -r * 1.25, r * 0.95, -r * 1.25, r * 0.92, r * 0.1);
  ctx.lineTo(r * 0.9 + sw, r * 0.95);
  for (let k = 0; k < 4; k++) { const x0 = r * 0.9 - (k + 0.5) * r * 0.45, x1 = r * 0.9 - (k + 1) * r * 0.45; ctx.quadraticCurveTo(x0 + sw, r * (k % 2 ? 0.95 : 0.62), x1 + sw, r * 0.88); }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, mixHex(skin.light, '#ffffff', 0.55));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, r * 0.1); ctx.lineJoin = 'round'; ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.3, r * 0.13, r * 0.2, 0, 0, TAU); ctx.ellipse(r * 0.3, -r * 0.3, r * 0.13, r * 0.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, r * 0.08, r * 0.14, r * 0.18 + Math.sin(t * 9) * r * 0.03, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = hexA(skin.body, 0.55); ctx.beginPath(); ctx.ellipse(-r * 0.55, r * 0.0, r * 0.12, r * 0.07, 0, 0, TAU); ctx.ellipse(r * 0.55, r * 0.0, r * 0.12, r * 0.07, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

// a little bat, wings flapping with phase ph
function drawBat(ctx, x, y, s, ph, col) {
  ctx.save(); ctx.translate(x, y);
  const f = Math.sin(ph) * 0.9;
  ctx.fillStyle = col || '#2a1238';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.2);
  ctx.quadraticCurveTo(-s * 0.6, -s * (0.6 + f * 0.6), -s * 1.3, -s * f * 0.7);
  ctx.quadraticCurveTo(-s * 0.95, s * 0.05, -s * 0.75, s * 0.3); ctx.quadraticCurveTo(-s * 0.55, s * 0.05, -s * 0.3, s * 0.3);
  ctx.quadraticCurveTo(0, s * 0.45, s * 0.3, s * 0.3); ctx.quadraticCurveTo(s * 0.55, s * 0.05, s * 0.75, s * 0.3);
  ctx.quadraticCurveTo(s * 0.95, s * 0.05, s * 1.3, -s * f * 0.7);
  ctx.quadraticCurveTo(s * 0.6, -s * (0.6 + f * 0.6), 0, -s * 0.2);
  ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, s * 0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s * 0.22, -s * 0.15); ctx.lineTo(-s * 0.3, -s * 0.45); ctx.lineTo(-s * 0.05, -s * 0.25); ctx.moveTo(s * 0.22, -s * 0.15); ctx.lineTo(s * 0.3, -s * 0.45); ctx.lineTo(s * 0.05, -s * 0.25); ctx.fill();
  ctx.fillStyle = '#fff27a'; ctx.beginPath(); ctx.arc(-s * 0.11, -s * 0.02, s * 0.07, 0, TAU); ctx.arc(s * 0.11, -s * 0.02, s * 0.07, 0, TAU); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- logo
function drawWord(ctx, word, cx, cy, size, fills, opts) {
  opts = opts || {};
  ctx.save();
  ctx.font = size + "px 'Titan', 'Fred', sans-serif";
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const widths = [...word].map(ch => ctx.measureText(ch).width);
  const sp = size * (opts.spacing || -0.02);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (word.length - 1);
  let x = cx - total / 2;
  const letters = [];
  for (let i = 0; i < word.length; i++) {
    const w = widths[i];
    const k = word.length > 1 ? i / (word.length - 1) - 0.5 : 0;
    const rot = (opts.tilt || 0) * k + (i % 2 ? 1 : -1) * (opts.wiggle || 0);
    const dy = (opts.arc || 0) * (k * k * 4 - 1) * size + (i % 2 ? 1 : -1) * (opts.bounce || 0) * size;
    letters.push({ ch: word[i], x: x + w / 2, y: cy + dy, rot });
    x += w + sp;
  }
  const passes = [
    { lw: size * 0.34, style: opts.shadow || 'rgba(42,18,56,.55)', off: size * 0.11 },
    { lw: size * 0.3, style: INK, off: 0 },
    { lw: size * 0.12, style: opts.rim || '#fff', off: 0 }
  ];
  if (opts.skip !== undefined) { opts.out = letters[opts.skip]; letters.splice(opts.skip, 1); }
  for (const p of passes) for (const L of letters) {
    ctx.save(); ctx.translate(L.x, L.y + p.off); ctx.rotate(L.rot);
    ctx.lineJoin = 'round'; ctx.lineWidth = p.lw; ctx.strokeStyle = p.style;
    ctx.strokeText(L.ch, -ctx.measureText(L.ch).width / 2, 0);
    ctx.restore();
  }
  for (const L of letters) {
    ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(L.rot);
    const w = ctx.measureText(L.ch).width;
    const g = ctx.createLinearGradient(0, -size * 0.45, 0, size * 0.45);
    fills.forEach((c, k) => g.addColorStop(k / (fills.length - 1), c));
    ctx.fillStyle = g; ctx.fillText(L.ch, -w / 2, 0);
    // gloss
    ctx.save(); ctx.beginPath(); ctx.rect(-w, -size * 0.6, w * 2, size * 0.42); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillText(L.ch, -w / 2, 0);
    ctx.restore();
    ctx.restore();
  }
  ctx.restore();
}

function drawLogo(ctx, W, H, halloween) {
  ctx.clearRect(0, 0, W, H);
  const s = Math.min(W / 1120, H / 520);
  drawWord(ctx, 'SEESAW', W / 2 - 20 * s, H * 0.3, 205 * s, ['#fff27a', '#ffd23f', '#ff9f1c'], { tilt: -0.16, wiggle: 0.05, bounce: 0.04 });
  const o2 = { tilt: 0.12, wiggle: 0.06, bounce: 0.035, spacing: 0.01 };
  if (halloween) o2.skip = 3;   // the O of SUMO becomes a jack-o'-lantern
  drawWord(ctx, 'SUMO', W / 2 + 30 * s, H * 0.72, 250 * s, halloween ? ['#ffd08a', '#ff8a1f', '#d9590a'] : ['#ffb3c0', '#ff5d6e', '#e0203f'], o2);
  if (halloween && o2.out) {
    const L = o2.out, R = 250 * s * 0.4;
    ctx.save(); ctx.translate(L.x, L.y + 250 * s * 0.04); ctx.rotate(L.rot);
    ctx.fillStyle = 'rgba(42,18,56,.55)'; ctx.beginPath(); ctx.ellipse(0, R * 0.3, R * 1.08, R * 1.05, 0, 0, TAU); ctx.fill();
    drawPumpkin(ctx, 0, 0, R, 0, 1);
    ctx.restore();
    drawBat(ctx, W / 2 + 430 * s, H * 0.14, 34 * s, 0.6, '#2a1238');
    drawBat(ctx, W / 2 - 470 * s, H * 0.6, 26 * s, 2.2, '#2a1238');
  }
}

// ---- 30_game.js
// ---------------------------------------------------------------- game
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const WIN_AT = 3;
const M_PER_U = 1 / 50; // 50 world units = 1 metre (a blob is about 1.6 m wide)

const KO_WORDS = {
  orbit: ['SENT TO ORBIT!', 'BYE BYE!', 'TO THE MOON!'],
  yeet: ['YEET!', 'LAVA BATH!', 'SPLASHDOWN!', 'HOME RUN!'],
  launch: ['SPLASH!', 'TOASTED!', 'CRISPY!', 'SIZZLE!'],
  slip: ['SLIPPED!', 'OOPS!', 'WOBBLE... SPLASH!'],
  burn: ['BURNT TOAST!', 'TOO HOT!'],
  pumpkin: ['PUMPKIN STRIKE!', 'BOWLED OVER!', 'GOURD GONE!']
};
const SLIME_WORDS = {
  orbit: ['SENT TO THE MOON!', 'BOO-BYE!'], yeet: ['SLIMED!', 'GOO BATH!', 'SPLAT!'], launch: ['SLIMED!', 'GLOOP!', 'SPOOKED!'],
  slip: ['SLIPPED!', 'GLOOP!'], burn: ['BURNT TOAST!'], pumpkin: ['PUMPKIN STRIKE!', 'BOWLED OVER!']
};

// the arena rotation: the event arena joins only while the event runs
const ARENAS = SIM.arenaList(EVENT.id);
const EV_ARENA = EVENT.on ? 0 : -1;          // index of the Pumpkin Patch in ARENAS
const REG0 = EVENT.on ? 1 : 0, NREG = SIM.ARENAS.length;

function mkVis() {
  return { sq: 0, sqV: 0, wob: 0, axis: 0, blinkT: rr(1, 3), blink: 0, look: [0, 0], mood: 'idle', trail: [], char: 0,
    sway: 0, swayV: 0, smugT: 0, lastHold: false, px: 0, py: 0, screamT: 0, hint: 0 };
}

const G = {
  state: 'menu', mode: 'demo', diff: 'normal',
  world: null, brains: [null, null],
  score: [0, 0], round: 0, arena: 0, matchNo: 0, matchesDone: 0,
  held: [false, false], acc: 0, timeScale: 1, tsTarget: 1, hitstop: 0, trauma: 0,
  cam: { x: 0, y: -100, z: 1 }, camInit: false,
  parts: [], rings: [], texts: [], lines: [],
  vis: [mkVis(), mkVis()],
  prev: null, doom: -1, doomCheck: 0, stateT: 0, koInfo: null, koFx: null, banner: null, flash: 0, flashCol: '#fff',
  flex: 0, flexV: 0, flexAt: 0, roundWinner: -1, paused: false, ad: false, time: 0,
  stats: null, skins: [0, 1], fps: 60, lastSaved: -9, tut: null, crowdJump: 0, lightning: 0
};

function curArt() { return ARENA_ART[ARENAS[G.arena].id]; }
function curPit() { return PIT[curArt().pit || 'lava']; }

// ---------------------------------------------------------------- world setup
function makeWorld(arena, dropIn, windDir) {
  const cfg = SIM.cfgFor(arena, ARENAS);
  cfg.windDir = windDir || 1;
  const w = new SIM.World(cfg, ((Date.now() & 0xffffff) ^ (G.round * 7919 + G.matchNo * 104729)) >>> 0);
  if (dropIn) {
    for (const b of w.b) { b.g = false; b.anchor = b.u; b.y = -820 - (b.side > 0 ? 0 : 0); b.vy = 0; b.airT = 0; b.minY = b.y; }
  }
  G.prev = snapshot(w);
  return w;
}
function snapshot(w) { return { th: w.th, f: w.f, L: w.L, b: [{ x: w.b[0].x, y: w.b[0].y }, { x: w.b[1].x, y: w.b[1].y }] }; }

function setArena(a) {
  G.arena = a;
  bgCache.key = '';
}

function newBrains() {
  const seed = (Date.now() & 0xffff) + G.round * 977;
  if (G.mode === 'cpu') G.brains = [null, new SIM.Brain(1, G.diff, seed)];
  else if (G.mode === 'demo') G.brains = [new SIM.Brain(0, 'normal', seed + 3), new SIM.Brain(1, 'normal', seed + 11)];
  else G.brains = [null, null];
}

function startDemo() {
  G.mode = 'demo'; G.state = 'menu';
  G.round = 0; G.score = [0, 0];
  setArena(G.demoArena = ((G.demoArena === undefined ? -1 : G.demoArena) + 1) % ARENAS.length);
  if (G.demoFirst === undefined) { G.demoFirst = true; setArena(0); }   // during the event the menu opens on the Pumpkin Patch
  if (EVENT.on && G.demoArena % 2 === 1) setArena(EV_ARENA);          // and comes back to it every other demo
  G.world = makeWorld(G.arena, true, 1);
  newBrains();
  G.vis = [mkVis(), mkVis()];
  G.doom = -1; G.tsTarget = 1; G.timeScale = 1; G.koFx = null; G.koInfo = null; G.banner = null;
  G.stateT = 0;
  Sfx.Music.setSpooky(ARENAS[G.arena].id === 'pumpkin');
}

function startMatch(mode) {
  G.mode = mode;
  G.score = [0, 0]; G.round = 0; G.matchNo++;
  G.stats = { maxAlt: [0, 0], slams: [0, 0], throws: [0, 0], rounds: 0, t0: G.time, candy: 0, stomps: [0, 0], pkWins: 0 };
  G.arenaBase = G.matchNo === 1 ? 0 : ((G.matchNo - 1) * 2) % NREG;
  if (G.tut === null) G.tut = Store.get('tut', 0) < 2 ? { jumps: 0, pounds: 0 } : false;
  G.rookie = !!G.tut;
  Sfx.Music.setIntensity(0);
  nextRound();
  Ads.gameplayStart();
}

function nextRound() {
  G.round++;
  let a = REG0 + (G.round === 1 && G.matchNo === 1 ? 0 : (G.arenaBase + G.round - 1) % NREG);
  // Halloween: every other round is the Pumpkin Patch (a brand new player learns on the plain Volcano first)
  if (EVENT.on) a = (G.round % 2 === 1) !== G.rookie ? EV_ARENA : REG0 + (G.matchNo === 1 && G.round <= 2 ? 0 : (G.arenaBase + (G.round >> 1)) % NREG);
  setArena(a);
  G.world = makeWorld(a, true, G.round % 2 ? 1 : -1);
  G.rec = []; G.lastLaunch = [0, 0];
  newBrains();
  G.vis = [mkVis(), mkVis()];
  G.state = 'intro'; G.stateT = 0;
  G.doom = -1; G.tsTarget = 1; G.timeScale = 1; G.koFx = null; G.koInfo = null;
  G.held = [G.held[0], G.held[1]];
  const mp = G.score[0] === WIN_AT - 1 || G.score[1] === WIN_AT - 1;
  const art = ARENAS[a];
  G.banner = { text: mp && G.score[0] === G.score[1] ? 'FINAL ROUND' : (mp ? 'MATCH POINT' : 'ROUND ' + G.round), sub: art.name.toUpperCase() + (art.id !== 'volcano' ? ' · ' + art.tag : ''), t: 0, life: 1.35 };
  G.otShown = false;
  Sfx.Music.setIntensity(mp ? 1 : 0);
  Sfx.Music.setSpooky(art.id === 'pumpkin');
  UI.hud();
  Sfx.taiko(0.5);
}

// ---------------------------------------------------------------- per-step input and events
function inputsFor(w) {
  const h = [false, false];
  if (G.state === 'play') {
    for (let i = 0; i < 2; i++) h[i] = G.brains[i] ? G.brains[i].update(w) : G.held[i];
  } else if (G.state === 'menu' && G.mode === 'demo') {
    for (let i = 0; i < 2; i++) h[i] = G.brains[i] ? G.brains[i].update(w) : false;
  }
  return h;
}

function stepWorld() {
  const w = G.world;
  const p = G.prev;
  p.th = w.th; p.f = w.f; p.L = w.L;
  for (let i = 0; i < 2; i++) { p.b[i].x = w.b[i].x; p.b[i].y = w.b[i].y; }
  const h = inputsFor(w);
  w.step(h);
  if (G.state === 'intro') { w.th = 0; w.om = 0; }
  for (const e of w.ev) onEvent(e);
  w.ev.length = 0;
}

function shake(v) { G.trauma = Math.min(1, G.trauma + v); }

function onEvent(e) {
  const w = G.world, live = G.mode !== 'demo';
  const vol = live || G.state !== 'menu' ? 1 : 0.35;
  const b = e.i !== undefined ? w.b[e.i] : null, V = e.i !== undefined ? G.vis[e.i] : null;
  switch (e.type) {
    case 'press':
      if (e.g) Sfx.chargeStart(e.i);
      break;
    case 'jump': {
      Sfx.chargeStop(e.i);
      if (vol > 0.5) Sfx.jump(e.ch, e.i);
      V.sqV -= 5 + e.ch * 7; V.wob = Math.max(V.wob, 0.4);
      dust(b.x, b.y + w.c.r * 0.9, 5 + e.ch * 6, 0.6 + e.ch * 0.5);
      if (G.tut && e.i === 0 && G.mode === 'cpu') G.tut.jumps++;
      break;
    }
    case 'pound':
      Sfx.chargeStop(e.i);
      if (vol > 0.5) Sfx.hang();
      V.sqV += 6; V.wob = 0.6;
      G.texts.push({ x: b.x, y: b.y - w.c.r * 1.6, text: '!', size: 30, col: '#fff', t: 0, life: 0.4, pop: 1 });
      if (G.tut && e.i === 0) G.tut.pounds++;
      break;
    case 'land': {
      const k = clamp((e.v - 250) / 1400, 0, 1);
      if (vol > 0.5) Sfx.land(e.v, e.pounded); else if (e.v > 600) Sfx.land(e.v * 0.6, false);
      V.sqV += 3 + e.v / 70; V.wob = Math.min(1.4, V.wob + 0.3 + k);
      dust(b.x, b.y + w.c.r * 0.95, 4 + k * 14, 0.5 + k * 1.2);
      if (G.state === 'intro') { shake(0.12); break; }
      if (e.power > 1.6 && !e.blocked) {
        G.rings.push({ x: b.x, y: b.y + w.c.r * 0.9, r0: w.c.r * 0.6, r1: w.c.r * (1.8 + k * 2.6), t: 0, life: 0.32 + k * 0.2, col: e.pounded ? '#fff27a' : '#ffffff', lw: 6 + k * 8, flat: 0.35 });
        if (live && G.state === 'play') G.hitstop = Math.max(G.hitstop, clamp((e.power - 2.6) * 0.022, 0, 0.085));
        shake(clamp(e.power / 14, 0, 0.55));
        G.flexV += (e.s > 0 ? 1 : -1) * e.power * 9; G.flexAt = e.s;
        // words only for the really big ones, so they stay special
        if (e.power > 4.6 && live && G.time - (G.lastWord || 0) > 1.2) {
          G.lastWord = G.time;
          G.texts.push({ x: b.x, y: b.y - w.c.r * 2.2, text: e.pounded ? pick(['WHAM!', 'SLAM!', 'BOOM!']) : pick(['THUD!', 'BONK!']), size: 26 + k * 16, col: e.pounded ? '#fff27a' : '#fff', t: 0, life: 0.6, pop: 1, rot: rr(-0.15, 0.15) });
        }
        if (G.stats && live) G.stats.slams[e.i] += e.pounded ? 1 : 0;
      } else if (e.blocked && live && e.v > 500) {
        G.texts.push({ x: b.x, y: b.y - w.c.r * 1.7, text: 'BLOCKED', size: 20, col: '#ffe0e0', t: 0, life: 0.6, pop: 1 });
      }
      break;
    }
    case 'stop': {
      if (e.om > 1) {
        if (vol > 0.5) Sfx.clack(e.om);
        const sx = e.dir > 0 ? 108 : -108;
        for (let k = 0; k < 6 + e.om * 2; k++) G.parts.push({ k: 'spark', x: G.world.f + sx, y: 50, vx: rr(-260, 260), vy: rr(-420, -80), g: 1400, t: 0, life: rr(0.25, 0.5), size: rr(3, 6), col: pick(['#fff27a', '#ffffff', '#ffb703']) });
        G.flexV += -e.dir * e.om * 7;
      }
      break;
    }
    case 'launch': {
      if (vol > 0.5) Sfx.whoosh(e.v);
      G.lastLaunch = G.lastLaunch || [0, 0]; G.lastLaunch[e.i] = w.t;
      V.sqV -= 7; V.wob = 1;
      if (e.v > 900 && live) { Sfx.scream(e.i); V.screamT = 1.2; }
      if (e.v > 1100 && live) { Sfx.ooh(); G.crowdJump = 1; }
      for (let k = 0; k < 10; k++) G.lines.push({ x: b.x + rr(-w.c.r, w.c.r), y: b.y + rr(0, w.c.r * 1.5), len: rr(60, 140) * clamp(e.v / 1000, 0.5, 1.6), t: 0, life: rr(0.2, 0.35) });
      if (G.stats && live) G.stats.throws[e.i]++;
      break;
    }
    case 'thud':
      V.sqV += 2 + e.v / 120;
      break;
    case 'corner':
      if (vol > 0.5) Sfx.bonk();
      V.wob = 1;
      break;
    case 'slip':
      if (live) Sfx.scream(e.i);
      break;
    case 'bonk':
      Sfx.bonk();
      for (let k = 0; k < 6; k++) G.parts.push({ k: 'star', x: e.x, y: e.y, vx: rr(-300, 300), vy: rr(-400, -100), g: 900, t: 0, life: 0.6, size: rr(8, 13), col: '#fff27a', rot: rr(0, 6) });
      break;
    case 'ko':
      onKO(e);
      break;
    // ---- Halloween pumpkins
    case 'pkDrop':
      if (vol > 0.5) Sfx.whistle();
      break;
    case 'pkLand': {
      const k = clamp(e.power / 5, 0, 1);
      if (vol > 0.5) Sfx.pumpkinThud(e.power);
      dust(e.x, e.y, 6 + k * 10, 0.6 + k);
      shake(clamp(e.power / 16, 0.08, 0.4) * vol);
      if (e.power > 1.4 && !e.blocked) {
        G.rings.push({ x: e.x, y: e.y, r0: 20, r1: 90 + k * 110, t: 0, life: 0.35, col: '#ffb24a', lw: 8 + k * 6, flat: 0.35 });
        G.flexV += (e.x > w.f ? 1 : -1) * e.power * 8; G.flexAt = e.x - w.f;
      }
      break;
    }
    case 'pkFlick': if (vol > 0.5) Sfx.bonk(); break;
    case 'pkFall': if (vol > 0.5) Sfx.whoosh(500); break;
    case 'pkSmash': pumpkinSplat(e.x, e.y, e.how === 'pit', vol); break;
    case 'pkStomp': {
      if (vol > 0.5) Sfx.stomp();
      V.sqV -= 9; V.wob = 1;
      G.texts.push({ x: e.x, y: e.y - 70, text: pick(['SQUASH!', 'SPLAT!', 'STOMP!']), size: 30, col: '#ffb24a', t: 0, life: 0.7, pop: 1, rot: rr(-0.15, 0.15) });
      if (live && G.stats) { G.stats.stomps[e.i]++; if (G.mode === '2p' || e.i === 0) { G.stats.candy++; candyPop(e.x, e.y - 30); } }
      break;
    }
    case 'pkBonk':
      if (vol > 0.5) Sfx.bonk();
      V.sqV += 8; V.wob = 1;
      G.texts.push({ x: e.x, y: e.y - 60, text: 'BONK!', size: 30, col: '#fff', t: 0, life: 0.6, pop: 1, rot: rr(-0.2, 0.2) });
      for (let k = 0; k < 5; k++) G.parts.push({ k: 'star', x: b.x, y: b.y - w.c.r, vx: rr(-260, 260), vy: rr(-380, -120), g: 900, t: 0, life: 0.6, size: rr(8, 12), col: '#fff27a', rot: rr(0, 6) });
      break;
    case 'pkBowl':
      if (vol > 0.5) Sfx.strike();
      if (live) Sfx.scream(e.i);
      V.wob = 1.2; V.screamT = 1;
      if (live) G.texts.push({ x: e.x, y: e.y - 90, text: 'STRIKE!', size: 36, col: '#ffb24a', t: 0, life: 0.8, pop: 1, rot: rr(-0.12, 0.12) });
      shake(0.3 * vol);
      break;
  }
}

function pumpkinSplat(x, y, pit, vol) {
  if (vol > 0.5) Sfx.splat();
  for (let k = 0; k < 16; k++) {
    const a = rr(0, TAU), sp = rr(150, 520);
    G.parts.push({ k: 'chunk', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, g: 1600, t: 0, life: rr(0.5, 0.9), size: rr(6, 14), col: pick(['#ff8a1f', '#ffb24a', '#d9590a', '#fff27a']), rot: rr(0, 6), vr: rr(-12, 12) });
  }
  if (!pit) G.rings.push({ x, y, r0: 10, r1: 110, t: 0, life: 0.3, col: '#ffb24a', lw: 10, flat: 0.6 });
}
function candyPop(x, y) {
  for (let k = 0; k < 3; k++) G.parts.push({ k: 'candy', x, y, vx: rr(-160, 160), vy: rr(-520, -320), g: 1300, t: 0, life: 0.9, size: 11, col: pick(['#ff8a1f', '#ffffff', '#a066ff', '#7cf07a']), rot: rr(0, 6), vr: rr(-10, 10) });
  G.texts.push({ x, y: y - 40, text: '+1 CANDY', size: 22, col: '#ffd08a', t: 0, life: 0.9, pop: 1 });
}

function dust(x, y, n, s) {
  for (let k = 0; k < n; k++) {
    const dir = k % 2 ? 1 : -1;
    G.parts.push({ k: 'dust', x: x + rr(-14, 14), y: y + rr(-4, 4), vx: dir * rr(80, 380) * s, vy: rr(-140, -20) * s, g: -60, drag: 3.2, t: 0, life: rr(0.35, 0.7), size: rr(8, 16) * (0.7 + s * 0.4), col: 'rgba(255,255,255,.85)' });
  }
}

function splashFx(i, x) {
  const w = G.world;
  const pit = curPit();
  Sfx.splash();
  shake(0.8);
  G.flash = 0.5; G.flashCol = pit.flash;
  const y = w.c.lavaY;
  for (let k = 0; k < 46; k++) {
    const a = -Math.PI / 2 + rr(-0.9, 0.9), sp = rr(300, 1250);
    G.parts.push({ k: 'drop', x: x + rr(-30, 30), y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 2200, t: 0, life: rr(0.7, 1.4), size: rr(7, 17), col: pick(pit.drops) });
  }
  for (let k = 0; k < 10; k++) G.parts.push({ k: 'steam', x: x + rr(-60, 60), y: y - rr(0, 30), vx: rr(-60, 60), vy: rr(-220, -90), g: -40, drag: 1.5, t: 0, life: rr(1, 1.8), size: rr(22, 40), col: 'rgba(255,255,255,.7)' });
  G.rings.push({ x, y, r0: 20, r1: 220, t: 0, life: 0.55, col: '#fff27a', lw: 14, flat: 0.28 });
  G.koFx = { i, x, t: 0 };
}

function onKO(e) {
  const w = G.world, live = G.mode !== 'demo';
  const other = 1 - e.i;
  Sfx.chargeStop(e.i);
  splashFx(e.i, e.x);
  const how = e.how || 'launch';
  if (live) {
    const words = curArt().pit === 'slime' ? SLIME_WORDS : KO_WORDS;
    const txt = pick(words[how] || words.launch);
    G.koInfo = { i: e.i, text: txt, t: 0, alt: Math.round(e.alt * M_PER_U) };
    Sfx.gong();
    Sfx.ooh();
    if (EVENT.on) setTimeout(() => Sfx.boo(), 550);
    setTimeout(() => Sfx.cheer(), 250);
    G.crowdJump = 1.5;
  }
  if (G.stats && live) G.stats.maxAlt[e.i] = Math.max(G.stats.maxAlt[e.i], e.alt);
  if (G.state === 'play') {
    G.state = 'ko'; G.stateT = 0; G.roundWinner = other;
    if (live && G.stats && ARENAS[G.arena].id === 'pumpkin' && (G.mode === '2p' || other === 0)) G.stats.pkWins++;
    G.koAt = w.t; G.koX = e.x; G.koI = e.i;
    G.replayDue = live && G.score[other] + 1 >= WIN_AT;
    G.doom = e.i; G.tsTarget = 0.55;
    G.vis[other].smugT = 2.5;
  } else if (G.state === 'ko' && G.stateT < 0.35) {
    G.roundWinner = -1; // double KO
  } else if (G.state === 'menu') {
    G.demoKO = G.time;
  }
}

// ---------------------------------------------------------------- frame update
function update(dt) {
  G.time += dt;
  G.stateT += dt;
  const w = G.world;
  if (!w) return;
  if (G.paused || G.ad) return;

  // time scale (slow motion) and hitstop
  G.timeScale = lerp(G.timeScale, G.tsTarget, 1 - Math.exp(-dt * (G.tsTarget < G.timeScale ? 14 : 5)));
  if (G.hitstop > 0) G.hitstop -= dt;
  else {
    G.acc += dt * G.timeScale;
    let n = 0;
    while (G.acc >= SIM.DT && n < 8) { stepWorld(); G.acc -= SIM.DT; n++; }
    if (n >= 8) G.acc = 0;
  }
  const wdt = dt * G.timeScale;

  // doom check: is a flying blob headed for the lava? (slow motion gives a chance to belly-slam back)
  if ((G.state === 'play' || (G.state === 'menu' && G.mode === 'demo')) && (G.doomCheck -= dt) <= 0) {
    G.doomCheck = 0.06;
    let d = -1;
    for (let i = 0; i < 2; i++) { const b = w.b[i]; if (b.alive && !b.g && (b.launchV > 0 || b.airT > 0.05) && w.doomed(i, 2.4)) d = i; }
    if (d >= 0) {
      G.doom = d;
      // slow motion from the top of the arc down to the splash (and a last chance to belly-slam back)
      if (G.state === 'play' && w.b[d].vy > -220) {
        const mp = G.score[1 - d] === WIN_AT - 1;
        G.tsTarget = mp ? 0.26 : 0.4;
      }
    } else if (d < 0 && G.doom >= 0 && G.state === 'play') {
      const b = w.b[G.doom];
      if (b.alive && b.g) {
        G.texts.push({ x: b.x, y: b.y - 90, text: 'SAVED!', size: 40, col: '#7cf07a', t: 0, life: 1, pop: 1 });
        Sfx.saved();
      }
      G.doom = -1; G.tsTarget = 1;
    }
  }

  // overtime: say it once, so the burning plank and the hot hub read as a rule, not a bug
  if (G.state === 'play' && !G.otShown && w.t > w.c.otStart && G.mode !== 'demo') {
    G.otShown = true;
    G.banner = { text: 'OVERTIME!', sub: 'THE PLANK IS BURNING', t: 0, life: 1.3 };
    Sfx.burn();
  }

  // state machine
  if (G.state === 'intro') {
    if (G.stateT > 1.25) {
      G.state = 'play'; G.stateT = 0;
      G.banner = { text: 'GO!', sub: '', t: 0, life: 0.6, go: true };
      Sfx.go();
      for (let i = 0; i < 2; i++) if (G.brains[i]) G.brains[i].nextAttack = w.t + 0.35 + G.brains[i].rand() * 0.6;
    }
  } else if (G.state === 'ko') {
    if (G.stateT > 0.35 && G.tsTarget < 1 && G.koFx && G.koFx.t > 0.25) G.tsTarget = 1;
    if (G.stateT > 0.35 && G.roundWinner < 0) G.replayDue = false;
    if (G.stateT > (G.replayDue ? 1.5 : 2.0)) { if (G.replayDue) startReplay(); else endRound(); }
  } else if (G.state === 'replay') {
    updateReplay(dt);
    updateFx(dt * 0.45, dt);
    updateCamera(dt);
    return;
  } else if (G.state === 'menu' && G.mode === 'demo') {
    if (G.demoKO && G.time - G.demoKO > 1.6) { G.demoKO = 0; startDemo(); }
    if (w.t > 40) startDemo();
  }

  updateVis(dt, wdt);
  updateFx(wdt, dt);
  updateCamera(dt);
  if (G.state === 'play' || G.state === 'ko') record();
}

// ---------------------------------------------------------------- instant replay of the match-winning knockout
const REC_KEEP = 3.6;
function record() {
  const w = G.world, rec = G.rec || (G.rec = []);
  const a = clamp(G.acc / SIM.DT, 0, 1), p = G.prev;
  rec.push({
    t: G.time, th: lerp(p.th, w.th, a), f: lerp(p.f, w.f, a), L: w.L, wt: w.t, windV: w.windV,
    b: w.b.map((b, i) => ({ x: lerp(p.b[i].x, b.x, a), y: lerp(p.b[i].y, b.y, a), g: b.g, alive: b.alive, ang: b.ang, hold: b.hold, ht: b.ht, pound: b.pound, teeter: b.teeter, u: b.u, vx: b.vx, vy: b.vy, launchV: b.launchV, side: b.side })),
    v: G.vis.map(V => ({ sq: V.sq, axis: V.axis, wob: V.wob, mood: V.mood, look: V.look.slice(), blink: V.blink, sway: V.sway, trail: [], hint: 0 }))
  });
  while (rec.length && rec[0].wt < w.t - REC_KEEP) rec.shift();
}
function startReplay() {
  const rec = G.rec || [];
  if (rec.length < 20) { endRound(); return; }
  G.state = 'replay'; G.stateT = 0;
  // start just before the throw that sent them flying, play at 40% game speed
  const ll = G.lastLaunch ? G.lastLaunch[G.koI] : 0;
  const from = ll > 0 && G.koAt - ll < 2.6 ? ll - 0.55 : G.koAt - 1.6;
  G.replay = { frames: rec.slice(), t: Math.max(rec[0].wt, from), end: Math.min(rec[rec.length - 1].wt, G.koAt + 0.6), k: 0, splashed: false };
  UI.el.hud.classList.add('hidden');
  G.parts.length = 0; G.rings.length = 0; G.texts.length = 0; G.lines.length = 0;
  G.koFx = null; G.koInfo = null; G.timeScale = 1; G.tsTarget = 1;
  G.banner = null;
  Sfx.rewind();
}
function updateReplay(dt) {
  const R = G.replay;
  R.t += dt * 0.4;
  while (R.k < R.frames.length - 1 && R.frames[R.k + 1].wt <= R.t) R.k++;
  if (!R.splashed && R.t >= G.koAt) { R.splashed = true; splashFx(G.koI, G.koX); G.crowdJump = 1.5; Sfx.ooh(); }
  if (R.t >= R.end || G.skipReplay) { G.skipReplay = false; G.replay = null; G.state = 'ko'; G.stateT = 99; G.replayDue = false; UI.el.hud.classList.remove('hidden'); endRound(); }
}
function replayWorld() {
  const R = G.replay; if (!R) return null;
  const fr = R.frames[R.k];
  const w = Object.create(SIM.World.prototype);
  w.c = G.world.c; w.th = fr.th; w.f = fr.f; w.L = fr.L; w.t = fr.wt; w.windV = fr.windV; w.om = 0;
  w.b = fr.b.map(b => Object.assign({}, b));
  return { w, vis: fr.v };
}

function endRound() {
  const wi = G.roundWinner;
  if (wi >= 0) G.score[wi]++;
  G.stats.rounds++;
  UI.hud(true);
  if (G.tut && (G.tut.jumps >= 2 && G.tut.pounds >= 1)) { Store.set('tut', 2); G.tut = false; }
  if (G.score[0] >= WIN_AT || G.score[1] >= WIN_AT) endMatch();
  else {
    if (wi < 0) G.banner = { text: 'DOUBLE KO!', sub: 'REPLAY', t: 0, life: 1 };
    nextRound();
  }
}

function endMatch() {
  G.state = 'over'; G.stateT = 0;
  G.matchesDone++;
  Ads.gameplayStop();
  const p1Won = G.score[0] > G.score[1];
  Sfx.Music.setIntensity(0);
  if (G.mode === 'cpu' && p1Won) Ads.happyTime();
  Sfx.fanfare(G.mode === '2p' || p1Won);
  confetti();
  setTimeout(() => UI.showResult(), 700);
}

function confetti() {
  const cols = ['#ffd23f', '#ff4b5c', '#3d8bff', '#3fcf5a', '#ff8cc6', '#ffffff'];
  const w = G.world;
  for (let k = 0; k < 90; k++) G.parts.push({ k: 'confetti', x: G.cam.x + rr(-500, 500), y: G.cam.y - rr(400, 700), vx: rr(-120, 120), vy: rr(-100, 200), g: 500, drag: 1.2, t: 0, life: rr(2, 3.5), size: rr(8, 14), col: pick(cols), rot: rr(0, 6), vr: rr(-10, 10) });
}

// ---------------------------------------------------------------- visuals of the blobs
function updateVis(dt, wdt) {
  const w = G.world;
  for (let i = 0; i < 2; i++) {
    const b = w.b[i], V = G.vis[i], o = w.b[1 - i];
    // squash target
    let tgt = 0.035, axisT = w.th;
    if (b.alive && b.g) {
      tgt = b.hold ? 0.08 + w.charge(b) * 0.26 : 0.035;
      if (b.teeter > 0.2) tgt += Math.sin(G.time * 30) * 0.03;
    } else if (b.alive) {
      const sp = Math.hypot(b.vx, b.vy);
      if (b.pound === 2) { tgt = 0.16; axisT = 0; }
      else if (b.pound === 3) { tgt = -0.24; axisT = 0; }
      else { tgt = -clamp(sp / 2600, 0, 0.22); axisT = Math.atan2(b.vy, b.vx) - Math.PI / 2; }
    }
    // angle easing (shortest way)
    let da = axisT - V.axis; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    if (Math.abs(da) > Math.PI / 2) { da += da > 0 ? -Math.PI : Math.PI; tgt = tgt; }
    V.axis += da * (1 - Math.exp(-wdt * 14));
    V.sqV += ((tgt - V.sq) * 420 - V.sqV * 15) * wdt;
    V.sq = clamp(V.sq + V.sqV * wdt, -0.38, 0.5);
    V.wob *= Math.exp(-wdt * 2.6);
    V.swayV += (-V.sway * 120 - V.swayV * 7 - (b.g ? 0 : b.vx * 0.004)) * wdt; V.sway += V.swayV * wdt; V.sway = clamp(V.sway, -0.6, 0.6);
    // blink
    V.blinkT -= dt; if (V.blinkT <= 0) { V.blink = 1; V.blinkT = rr(1.6, 4); }
    V.blink = Math.max(0, V.blink - dt * 7);
    V.smugT -= dt; V.screamT -= dt;
    // look at the opponent (or where you are flying, or down at the lava)
    let lx = clamp((o.x - b.x) / 260, -1, 1), ly = clamp((o.y - b.y) / 300, -1, 1);
    if (!b.g && b.launchV > 0) { lx = clamp(b.vx / 600, -1, 1); ly = clamp(b.vy / 900, -1, 1); }
    if (b.teeter > 0.3) { lx = Math.sign(b.u) * 0.6; ly = 1; }
    V.look[0] = lerp(V.look[0], lx, 1 - Math.exp(-dt * 10)); V.look[1] = lerp(V.look[1], ly, 1 - Math.exp(-dt * 10));
    // mood
    let m = 'idle';
    if (!b.alive) m = 'ko';

    else if (G.state === 'over') m = 'sad';
    else if (b.g && !b.hold && G.state === 'ko' && G.roundWinner === i) m = 'smug';
    else if (b.g && b.hold) m = 'charge';
    else if (!b.g && b.pound >= 2) m = 'pound';
    else if (!b.g && (b.launchV > 0 || V.screamT > 0)) m = 'fly';
    else if (b.g && b.teeter > 0.3) m = 'teeter';
    else if (!b.g) m = 'air';
    else if (V.smugT > 0 || (G.state === 'ko' && G.roundWinner === i)) m = 'smug';

  }
}

function updateFx(wdt, dt) {
  const w = G.world;
  G.trauma = Math.max(0, G.trauma - dt * 1.6);
  G.flash = Math.max(0, G.flash - dt * 2.4);
  G.crowdJump = Math.max(0, G.crowdJump - dt);
  G.flexV += (-G.flex * 900 - G.flexV * 9) * wdt; G.flex += G.flexV * wdt;
  const ps = G.parts;
  for (let k = ps.length - 1; k >= 0; k--) {
    const p = ps[k];
    p.t += wdt;
    if (p.t >= p.life) { ps.splice(k, 1); continue; }
    if (p.drag) { const f = Math.exp(-p.drag * wdt); p.vx *= f; p.vy *= f; }
    p.vy += (p.g || 0) * wdt; p.x += p.vx * wdt; p.y += p.vy * wdt;
    if (p.vr) p.rot += p.vr * wdt;
    if (p.k === 'drop' && p.y > w.c.lavaY && p.vy > 0) { p.life = p.t; }
  }
  for (let k = G.rings.length - 1; k >= 0; k--) { const r = G.rings[k]; r.t += wdt; if (r.t >= r.life) G.rings.splice(k, 1); }
  for (let k = G.texts.length - 1; k >= 0; k--) { const t = G.texts[k]; t.t += dt; if (t.t >= t.life) G.texts.splice(k, 1); }
  for (let k = G.lines.length - 1; k >= 0; k--) { const l = G.lines[k]; l.t += wdt; if (l.t >= l.life) G.lines.splice(k, 1); }
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }
  if (G.koInfo) G.koInfo.t += dt;
  if (G.koFx) G.koFx.t += wdt;
  // ambient: embers from the lava, flames on burnt plank ends, arena particles
  if (ps.length < 260) {
    if (rnd() < wdt * 9) ps.push({ k: 'ember', x: G.cam.x + rr(-700, 700), y: w.c.lavaY + 10, vx: rr(-30, 30), vy: rr(-170, -60), g: -20, t: 0, life: rr(1.5, 3), size: rr(2.5, 5), col: pick(curPit().embers) });
    // Halloween: bats cross the sky in every arena, more of them in the Pumpkin Patch
    if (EVENT.on && rnd() < wdt * (curArt().fx === 'bats' ? 0.32 : 0.14)) {
      const dir = rnd() < 0.5 ? 1 : -1, n = 1 + Math.floor(rnd() * 2.4), y0 = G.cam.y - rr(150, 520);
      for (let k = 0; k < n; k++) ps.push({ k: 'bat', x: G.cam.x - dir * rr(900, 1100) - dir * k * 60, y: y0 + rr(-60, 60), vx: dir * rr(260, 380), vy: rr(-20, 20), g: 0, t: 0, life: 7, size: rr(16, 26), col: '#2a1238', ph: rr(0, 6), sp: rr(16, 22) });
    }
    if (curArt().fx === 'bats' && rnd() < wdt * 0.5) ps.push({ k: 'wisp', x: G.cam.x + rr(-800, 800), y: w.c.lavaY - rr(0, 40), vx: rr(-20, 20), vy: rr(-60, -30), g: 0, t: 0, life: rr(3, 5), size: rr(14, 22), col: 'rgba(255,255,255,.5)', ph: rr(0, 6) });
    if (w.L < w.c.L - 2) for (const s of [-1, 1]) if (rnd() < wdt * 30) {
      const fr = w.frame(), es = s * w.L - w.f;
      ps.push({ k: 'flame', x: w.f + fr.dx * es + rr(-8, 8), y: fr.dy * es - 8, vx: rr(-30, 30), vy: rr(-200, -90), g: -60, t: 0, life: rr(0.3, 0.6), size: rr(8, 15), col: pick(['#ffe14d', '#ffb703', '#ff5a00']) });
    }
    const fx = curArt().fx;
    if (fx === 'snow' && rnd() < wdt * 14) ps.push({ k: 'snow', x: G.cam.x + rr(-800, 800), y: G.cam.y - rr(500, 900), vx: rr(-40, 10), vy: rr(60, 130), g: 0, t: 0, life: 9, size: rr(3, 6), col: '#ffffff' });
    if (fx === 'wind' && rnd() < wdt * 18) ps.push({ k: 'gust', x: G.cam.x - Math.sign(w.windV || 1) * 900, y: G.cam.y + rr(-600, 250), vx: (w.windV || 120) * 4.2, vy: rr(-10, 10), g: 0, t: 0, life: 1.4, size: rr(60, 160), col: 'rgba(255,255,255,.55)' });
    if (fx === 'bubbles' && rnd() < wdt * 4) ps.push({ k: 'bubble', x: G.cam.x + rr(-700, 700), y: G.cam.y + rr(100, 400), vx: rr(-20, 20), vy: rr(-80, -40), g: 0, t: 0, life: rr(3, 6), size: rr(6, 16), col: 'rgba(255,255,255,.6)' });
  }
}

// ---------------------------------------------------------------- camera
// The plank sits at a fixed height on screen (higher on tall phones, so the sky has room for big throws);
// the camera only zooms out to keep flying blobs in view, and leans in on a blob headed for the lava.
// Small screens: the plank must fit the width, which left the blobs tiny on portrait phones (23 px radius at 390 px wide).
// The blobs (and pumpkins) are drawn bigger there, bottom-aligned on the real physics body, so nothing about the
// physics or the CPU changes. G.vk is that draw scale, G.halfW the half width the camera must keep in view.
const BASE_HALF_W = 390, VIS_TARGET_PX = 36, VIS_MAX = 1.5;
G.vk = 1; G.halfW = BASE_HALF_W;
function updateVisScale() {
  let k = 1;
  for (let it = 0; it < 4; it++) {
    const hw = Math.max(BASE_HALF_W, SIM.BASE.L + SIM.BASE.r * k + 16);
    const z = Math.min(W / (hw * 2), H / (SIM.BASE.lavaY + 60 + 340));
    k = clamp(VIS_TARGET_PX / (SIM.BASE.r * z), 1, VIS_MAX);
    G.halfW = Math.max(BASE_HALF_W, SIM.BASE.L + SIM.BASE.r * k + 16);
  }
  G.vk = k;
}
// drawn blob centre: the bottom stays where the physics body's bottom is
function visY(y, r) { return y + r - r * G.vk; }
function pivotFrac() {
  const portrait = H > W * 1.15;
  if (G.state === 'menu') return portrait ? 0.56 : 0.6;
  return portrait ? 0.6 : 0.62;
}
function baseZoom() {
  const lava = G.world ? G.world.c.lavaY : 300;
  // width fits the plank; height must show the sky above and the lava below
  return Math.min(W / (G.halfW * 2), H / (lava + 60 + 340));
}
function updateCamera(dt) {
  const w = G.world;
  const z0 = baseZoom();
  const lava = w.c.lavaY, r = w.c.r;
  let hx = G.halfW, top = -300;
  const R = r * G.vk;
  for (const b of w.b) {
    if (!b.alive) continue;
    hx = Math.max(hx, Math.abs(b.x) + R + 50);
    top = Math.min(top, b.y + r - 2 * R - 70);
  }
  if (G.koFx && G.koFx.t < 1.2) hx = Math.max(hx, Math.abs(G.koFx.x) + 140);
  // pivot height on screen: a fixed fraction, but never so low that the lava drops out of view
  let z = Math.min(z0, W / (2 * hx));
  let py = Math.min(pivotFrac() * H, H - (lava + 45) * z);
  z = Math.min(z, py / -top);
  z = Math.max(z, z0 * 0.4);
  py = Math.min(pivotFrac() * H, H - (lava + 45) * z);
  let cx = 0, cy = (H / 2 - py) / z;
  // slow-motion doom: lean in on the falling blob
  if (G.doom >= 0 && (G.state === 'play' || G.state === 'ko') && G.timeScale < 0.8) {
    const b = w.b[G.doom];
    const fx = G.koFx ? G.koFx.x : b.x, fy = G.koFx ? lava - 60 : Math.min(b.y, lava - 60);
    const k = clamp((0.8 - G.timeScale) / 0.4, 0, 1);
    // frame the falling blob AND the lava waiting below it
    const zz = clamp(H * 0.78 / (lava + 70 - fy + r * 2), z0 * 0.85, z0 * 1.3);
    z = lerp(z, zz, k * 0.85);
    cx = lerp(0, fx * 0.55, k);
    const cyFocus = Math.min((fy - r + lava + 70) / 2, lava + 70 - H / 2 / z);
    cy = lerp((H / 2 - Math.min(pivotFrac() * H, H - (lava + 45) * z)) / z, cyFocus, k * 0.8);
  }
  if (G.state === 'replay' && G.replay) {
    const fr = G.replay.frames[G.replay.k], b = fr.b[G.koI];
    let hx2 = G.halfW * 0.9, top2 = -260;
    for (const q of fr.b) { if (!q.alive) continue; hx2 = Math.max(hx2, Math.abs(q.x - b.x * 0.35) + r + 40); top2 = Math.min(top2, q.y - r - 60); }
    z = Math.min(z0 * 1.12, W / (2 * hx2));
    let py2 = Math.min(pivotFrac() * H, H - (lava + 45) * z);
    z = Math.max(z0 * 0.45, Math.min(z, py2 / -top2));
    py2 = Math.min(pivotFrac() * H, H - (lava + 45) * z);
    cx = b.x * 0.35; cy = (H / 2 - py2) / z;
  }
  const c = G.cam;
  if (!G.camInit) { c.x = cx; c.y = cy; c.z = z; G.camInit = true; }
  const kz = 1 - Math.exp(-dt * (z < c.z ? 7 : 3.2));
  c.z += (z - c.z) * kz;
  const kp = 1 - Math.exp(-dt * 8);
  c.x += (cx - c.x) * kp;
  c.y += (cy - c.y) * kp;
}

// ---- 35_render.js
// ---------------------------------------------------------------- rendering
const bgCache = { key: '', sky: null };
const SCENERY = {};   // per-arena silhouettes, generated once

function sceneryFor(id) {
  if (SCENERY[id]) return SCENERY[id];
  const R = SIM.rng(id.length * 7919 + id.charCodeAt(0) * 31);
  const far = [], mid = [];
  // far range: one hero shape in the middle plus a jagged or rounded range
  const pts = [];
  for (let x = -2600; x <= 2600; x += 120) {
    let y;
    if (id === 'jelly') y = -170 - 120 * Math.abs(Math.sin(x / 260 + 1)) - R() * 30;
    else if (id === 'roller') y = (Math.floor((x + 2600) / 600) % 2 ? -260 : -150) - R() * 18;
    else y = -150 - R() * 210 - (id === 'ice' ? (Math.floor(x / 120) % 2 ? 90 : 0) : 0);
    pts.push([x, y]);
  }
  far.push(pts);
  const cliffs = [];
  for (const s of [-1, 1]) {
    cliffs.push({ x: s * 540, w: 200, top: 60 - R() * 30, s });
    cliffs.push({ x: s * 800, w: 230, top: -40 - R() * 40, s });
  }
  const crowd = [];
  const cols = ['#ff4b5c', '#3d8bff', '#ffd23f', '#3fcf5a', '#ff8cc6', '#9b6bff', '#ff9f1c', '#2ed3c6', '#ffffff'];
  for (const cl of cliffs.slice(0, 4)) {
    const n = 5 + Math.floor(R() * 3);
    for (let k = 0; k < n; k++) crowd.push({ x: cl.x + (k - (n - 1) / 2) * (cl.w / (n + 0.5)), y: cl.top, col: cols[Math.floor(R() * cols.length)], ph: R() * 6, sp: 5 + R() * 4, r: 15 + R() * 6 });
  }
  const clouds = [];
  for (let k = 0; k < 7; k++) clouds.push({ x: -1400 + k * 430 + R() * 120, y: -720 - R() * 520, s: 0.7 + R() * 0.7, v: 6 + R() * 10 });
  return (SCENERY[id] = { far, cliffs, crowd, clouds });
}

function skyCanvas() {
  const art = curArt();
  const key = ARENAS[G.arena].id + W + 'x' + H;
  if (bgCache.key === key) return bgCache.sky;
  const c = bgCache.sky || document.createElement('canvas');
  c.width = Math.max(2, Math.round(W * DPR / 2)); c.height = Math.max(2, Math.round(H * DPR / 2));
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, c.height);
  art.sky.forEach((col, k) => g.addColorStop(k / (art.sky.length - 1), col));
  x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  // sunburst (or, in the Pumpkin Patch, a huge harvest moon)
  const sx = c.width * 0.72, sy = c.height * 0.2, R = Math.hypot(c.width, c.height);
  x.save(); x.translate(sx, sy);
  x.fillStyle = art.moon ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.07)';
  for (let k = 0; k < 18; k++) { x.rotate(TAU / 18); x.beginPath(); x.moveTo(0, 0); x.lineTo(R, -R * 0.09); x.lineTo(R, R * 0.09); x.closePath(); x.fill(); }
  x.restore();
  const sg = x.createRadialGradient(sx, sy, 0, sx, sy, c.height * 0.45);
  sg.addColorStop(0, art.sunGlow + '0.75)'); sg.addColorStop(0.25, art.sunGlow + '0.25)'); sg.addColorStop(1, art.sunGlow + '0)');
  x.fillStyle = sg; x.fillRect(0, 0, c.width, c.height);
  const sr = Math.min(c.width, c.height) * (art.moon ? 0.15 : 0.085);
  x.fillStyle = art.sun; x.beginPath(); x.arc(sx, sy, sr, 0, TAU); x.fill();
  if (art.moon) {
    x.fillStyle = 'rgba(214,180,120,.35)';
    for (const [dx, dy, rr2] of [[-0.35, -0.2, 0.22], [0.3, 0.25, 0.16], [0.05, -0.45, 0.1], [-0.15, 0.4, 0.13], [0.45, -0.25, 0.09]]) { x.beginPath(); x.arc(sx + dx * sr, sy + dy * sr, rr2 * sr, 0, TAU); x.fill(); }
  }
  bgCache.key = key; bgCache.sky = c;
  return c;
}

// world -> screen for a parallax layer (p = 1 is the play layer)
function layerXf(p) {
  const c = G.cam, zl = c.z * (0.5 + 0.5 * p);
  return { zl, ox: W / 2 - c.x * p * zl, oy: H / 2 + (G.world.c.lavaY + 75 - c.y) * c.z - (G.world.c.lavaY + 75) * zl + (1 - p) * 0 };
}

function render() {
  if (G.state === 'replay' && G.replay) {
    const r = replayWorld(), realW = G.world, realV = G.vis;
    G.world = r.w; G.vis = r.vis;
    const p0 = G.prev; G.prev = snapshot(r.w);
    try { renderScene(); } finally { G.world = realW; G.vis = realV; G.prev = p0; }
    if (!CLEAN) replayOverlay();
    return;
  }
  renderScene();
}

function replayOverlay() {
  const bar = Math.round(H * 0.075);
  ctx.fillStyle = '#120818'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
  const s = clamp(Math.min(W, H) / 16, 18, 34);
  ctx.save();
  ctx.font = s + "px 'Titan', sans-serif"; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const on = Math.floor(G.time * 2) % 2 === 0;
  ctx.fillStyle = on ? '#ff3b4e' : 'rgba(255,59,78,.35)';
  ctx.beginPath(); ctx.arc(24 + s * 0.4, bar / 2, s * 0.32, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText('REPLAY', 24 + s * 1.0, bar / 2 + 1);
  ctx.textAlign = 'right'; ctx.font = Math.round(s * 0.55) + "px 'Fred', sans-serif"; ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillText('TAP TO SKIP', W - 20, H - bar / 2);
  ctx.restore();
}

function renderScene() {
  const w = G.world;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!w) { ctx.fillStyle = '#ff8a4c'; ctx.fillRect(0, 0, W, H); return; }
  const art = curArt();
  const id = ARENAS[G.arena].id;
  const sc = sceneryFor(id);
  ctx.drawImage(skyCanvas(), 0, 0, W, H);
  if (id === 'storm' && G.lightning > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (G.lightning * 0.5) + ')'; ctx.fillRect(0, 0, W, H); }

  const c = G.cam;
  const tr = G.trauma * G.trauma;
  const shx = (Math.sin(G.time * 71) + Math.sin(G.time * 113)) * 9 * tr, shy = (Math.sin(G.time * 89) + Math.cos(G.time * 127)) * 9 * tr;

  // clouds
  let L = layerXf(0.22);
  ctx.save(); ctx.translate(L.ox + shx * 0.2, L.oy); ctx.scale(L.zl, L.zl);
  ctx.fillStyle = art.cloud;
  for (const cl of sc.clouds) {
    const x = ((cl.x + G.time * cl.v + 1800) % 3600) - 1800;
    cloud(x, cl.y, cl.s);
  }
  ctx.restore();

  // far range
  L = layerXf(0.32);
  ctx.save(); ctx.translate(L.ox + shx * 0.3, L.oy + shy * 0.3); ctx.scale(L.zl, L.zl);
  farRange(id, art, sc);
  ctx.restore();

  // mid cliffs, flags and the crowd
  L = layerXf(0.62);
  ctx.save(); ctx.translate(L.ox + shx * 0.6, L.oy + shy * 0.6); ctx.scale(L.zl, L.zl);
  midLayer(id, art, sc, w);
  ctx.restore();

  // play layer
  ctx.save();
  ctx.translate(W / 2 + shx, H / 2 + shy); ctx.scale(c.z, c.z); ctx.translate(-c.x, -c.y);
  const a = clamp(G.acc / SIM.DT, 0, 1);
  const p = G.prev || snapshot(w);
  const th = lerp(p.th, w.th, a), f = lerp(p.f, w.f, a);
  const view = { x0: c.x - W / 2 / c.z - 60, x1: c.x + W / 2 / c.z + 60, y0: c.y - H / 2 / c.z - 60, y1: c.y + H / 2 / c.z + 60 };
  lavaGlow(w, view);
  pillar(id, art, w, f);
  // motion smear: a fast whip leaves ghost planks behind it
  const om = w.om || 0;
  if (Math.abs(om) > 2.5 && G.state !== 'replay') {
    ctx.globalAlpha = clamp((Math.abs(om) - 2.5) / 6, 0, 0.35);
    plank(id, art, w, th - om * 0.035, f, true);
    ctx.globalAlpha *= 0.5;
    plank(id, art, w, th - om * 0.07, f, true);
    ctx.globalAlpha = 1;
  }
  plank(id, art, w, th, f);
  // shadows, charge rings, trails, blobs
  const pos = [0, 1].map(i => ({ x: lerp(p.b[i].x, w.b[i].x, a), y: lerp(p.b[i].y, w.b[i].y, a) }));
  if (w.pk && w.pk.length) pumpkinsFor(w);
  for (let i = 0; i < 2; i++) shadowFor(w, i, pos[i], th, f);
  for (let i = 0; i < 2; i++) trailFor(i);
  for (let i = 0; i < 2; i++) blobFor(w, i, pos[i], th);
  drawParts(view, false);
  lavaSurface(w, view);
  koBlob(w);
  drawParts(view, true);
  drawRings();
  for (const l of G.lines) {
    const k = l.t / l.life;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * (1 - k)) + ')'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(l.x, l.y + l.len * k * 0.6); ctx.lineTo(l.x, l.y + l.len * (0.6 * k + 0.4)); ctx.stroke();
  }
  if (!CLEAN) { hints(w, pos); worldTexts(); }
  ctx.restore();

  if (!CLEAN) {
    offscreen(w, pos);
    if (G.koInfo && G.state !== 'menu') koText();
    if (G.banner) banner();
  }
  if (G.flash > 0) { ctx.fillStyle = G.flashCol; ctx.globalAlpha = G.flash * 0.6; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.timeScale < 0.8) {
    const k = clamp((0.8 - G.timeScale) / 0.5, 0, 1);
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(42,18,56,0)'); vg.addColorStop(1, 'rgba(42,18,56,' + (0.45 * k) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
}

function cloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 70 * s, 0, TAU); ctx.arc(x + 80 * s, y + 18 * s, 56 * s, 0, TAU); ctx.arc(x - 85 * s, y + 22 * s, 50 * s, 0, TAU);
  ctx.arc(x + 30 * s, y - 34 * s, 50 * s, 0, TAU); ctx.rect(x - 130 * s, y + 18 * s, 260 * s, 52 * s);
  ctx.fill();
}

function farRange(id, art, sc) {
  const lava = G.world.c.lavaY;
  // hero shape
  ctx.fillStyle = art.far;
  ctx.beginPath();
  if (id === 'volcano' || id === 'storm') {
    ctx.moveTo(-900, lava + 80); ctx.lineTo(-240, -470); ctx.quadraticCurveTo(-170, -520, -120, -500); ctx.lineTo(-60, -470); ctx.lineTo(10, -505); ctx.quadraticCurveTo(80, -520, 120, -470); ctx.lineTo(900, lava + 80); ctx.closePath(); ctx.fill();
    if (id === 'volcano') {
      // glowing crater and lava streaks
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(-50, -492, 66, 12, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ff9f1c'; ctx.lineWidth = 12; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-80, -485); ctx.quadraticCurveTo(-120, -420, -150, -340); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-10, -485); ctx.quadraticCurveTo(10, -440, 40, -400); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      for (let k = 0; k < 4; k++) { const t = (G.time * 0.15 + k / 4) % 1; ctx.globalAlpha = 0.6 * (1 - t); ctx.beginPath(); ctx.arc(-40 + t * 140, -540 - t * 360, 40 + t * 70, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
  } else if (id === 'ice') {
    ctx.moveTo(-800, lava + 80); ctx.lineTo(-300, -380); ctx.lineTo(-200, -300); ctx.lineTo(-60, -540); ctx.lineTo(80, -330); ctx.lineTo(170, -420); ctx.lineTo(800, lava + 80); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-60, -540); ctx.lineTo(-120, -450); ctx.lineTo(-80, -470); ctx.lineTo(-50, -430); ctx.lineTo(-10, -470); ctx.lineTo(10, -450); ctx.closePath(); ctx.fill();
  } else if (id === 'pumpkin') {
    // a rolling hill with a crooked haunted house and two bare trees
    ctx.moveTo(-900, lava + 80); ctx.quadraticCurveTo(-420, -420, 40, -330); ctx.quadraticCurveTo(420, -260, 900, lava + 80); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(-120, -350); ctx.rotate(-0.06);
    ctx.fillRect(-70, -110, 140, 120); ctx.beginPath(); ctx.moveTo(-90, -100); ctx.lineTo(0, -190); ctx.lineTo(90, -100); ctx.closePath(); ctx.fill();
    ctx.fillRect(30, -230, 34, 110); ctx.beginPath(); ctx.moveTo(22, -225); ctx.lineTo(47, -275); ctx.lineTo(72, -225); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    for (const [wx, wy] of [[-42, -70], [8, -70], [-17, -135], [40, -190]]) { ctx.globalAlpha = 0.65 + 0.35 * Math.sin(G.time * 3 + wx); ctx.fillRect(wx, wy, 18, 24); }
    ctx.globalAlpha = 1; ctx.restore();
    ctx.strokeStyle = art.far; ctx.lineCap = 'round';
    for (const [tx, ty, s] of [[260, -300, 1], [-470, -250, 0.8]]) {
      ctx.lineWidth = 16 * s; ctx.beginPath(); ctx.moveTo(tx, ty + 40); ctx.lineTo(tx + 6 * s, ty - 110 * s); ctx.stroke();
      ctx.lineWidth = 8 * s; ctx.beginPath(); ctx.moveTo(tx + 4 * s, ty - 50 * s); ctx.quadraticCurveTo(tx + 50 * s, ty - 90 * s, tx + 70 * s, ty - 140 * s);
      ctx.moveTo(tx + 3 * s, ty - 80 * s); ctx.quadraticCurveTo(tx - 40 * s, ty - 110 * s, tx - 60 * s, ty - 160 * s);
      ctx.moveTo(tx + 50 * s, ty - 92 * s); ctx.lineTo(tx + 90 * s, ty - 100 * s); ctx.stroke();
    }
  } else if (id === 'jelly') {
    ctx.arc(0, lava + 60, 560, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(-160, -330, 70, 0, TAU); ctx.fill();
  } else {
    ctx.moveTo(-700, lava + 80); ctx.lineTo(-560, -280); ctx.lineTo(-180, -300); ctx.lineTo(-120, lava + 80); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(150, lava + 80); ctx.lineTo(230, -380); ctx.lineTo(620, -360); ctx.lineTo(700, lava + 80); ctx.closePath(); ctx.fill();
  }
  // range
  ctx.fillStyle = art.mid;
  for (const pts of sc.far) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], lava + 200);
    for (const q of pts) ctx.lineTo(q[0], q[1] + 120);
    ctx.lineTo(pts[pts.length - 1][0], lava + 200); ctx.closePath(); ctx.fill();
  }
  if (id === 'storm' && G.lightning > 0.3) {
    ctx.strokeStyle = '#fff8c4'; ctx.lineWidth = 8; ctx.lineJoin = 'miter';
    ctx.beginPath(); let x = G.boltX || 300, y = -900; ctx.moveTo(x, y);
    const R = SIM.rng(Math.floor(G.time * 3) + 9);
    while (y < -150) { x += (R() - 0.5) * 120; y += 60 + R() * 60; ctx.lineTo(x, y); }
    ctx.stroke();
  }
}

function midLayer(id, art, sc, w) {
  const lava = w.c.lavaY;
  ctx.fillStyle = art.near;
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  for (const cl of sc.cliffs) {
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(cl.x - cl.w * 0.62, lava + 120);
      ctx.lineTo(cl.x - cl.w * 0.5, cl.top + 30); ctx.quadraticCurveTo(cl.x - cl.w * 0.48, cl.top, cl.x - cl.w * 0.4, cl.top);
      ctx.lineTo(cl.x + cl.w * 0.4, cl.top); ctx.quadraticCurveTo(cl.x + cl.w * 0.48, cl.top, cl.x + cl.w * 0.5, cl.top + 30);
      ctx.lineTo(cl.x + cl.w * 0.62, lava + 120); ctx.closePath();
    };
    path();
    const g = ctx.createLinearGradient(0, cl.top, 0, lava + 60);
    g.addColorStop(0, art.mid); g.addColorStop(1, art.near);
    ctx.fillStyle = g; ctx.fill(); ctx.stroke();
    ctx.save(); path(); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(cl.x - cl.w, cl.top, cl.w * 2, 14);
    ctx.strokeStyle = 'rgba(42,18,56,.22)'; ctx.lineWidth = 4;
    for (let y = cl.top + 50; y < lava; y += 55) { ctx.beginPath(); ctx.moveTo(cl.x - cl.w, y); ctx.quadraticCurveTo(cl.x, y + 12, cl.x + cl.w, y - 6); ctx.stroke(); }
    ctx.fillStyle = 'rgba(42,18,56,.18)'; ctx.fillRect(cl.x + cl.w * 0.15 * cl.s, cl.top, cl.w * 0.6, lava);
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
  }
  // Halloween: jack-o'-lanterns sit on the cliff tops in every arena
  if (EVENT.on) for (const cl of sc.cliffs) {
    if (Math.abs(cl.x) > 700) continue;
    drawPumpkin(ctx, cl.x - cl.s * cl.w * 0.42, cl.top - 22, 24, -cl.s * 0.1, 0.7 + 0.3 * Math.sin(G.time * 4 + cl.x));
  }
  // nobori flags on poles
  for (const s of [-1, 1]) {
    const cl = sc.cliffs[s < 0 ? 0 : 2], px = cl.x + s * cl.w * 0.3, top = -330, bot = cl.top;
    ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(px, bot); ctx.lineTo(px, top); ctx.stroke();
    ctx.strokeStyle = '#d9b27a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(px, bot); ctx.lineTo(px, top); ctx.stroke();
    const col = art.bunting[s < 0 ? 0 : 2];
    const fw = 70, fh = 230, dir = -s;
    ctx.fillStyle = col; ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(px, top + 14);
    for (let k = 0; k <= 8; k++) { const yy = top + 14 + fh * k / 8; ctx.lineTo(px + dir * (fw + Math.sin(G.time * 5 + k * 0.7) * 8 * (k / 8)), yy); }
    ctx.lineTo(px, top + 14 + fh); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(px + dir * 36, top + 80, 20, 0, TAU); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px + dir * 36, top + 80, 9, 0, TAU); ctx.fill();
  }
  // crowd
  const jump = G.crowdJump;
  for (const q of sc.crowd) {
    const hop = Math.abs(Math.sin(G.time * q.sp * (1 + jump) + q.ph)) * (4 + jump * 26);
    const x = q.x, y = q.top !== undefined ? q.top : q.y;
    const yy = q.y - q.r - hop;
    ctx.fillStyle = q.col; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(x, yy, q.r, q.r * (0.92 + Math.min(hop, 8) * 0.01), 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK;
    const lx = clamp((G.cam.x - x) / 900, -1, 1) * 3;
    ctx.beginPath(); ctx.arc(x - q.r * 0.32 + lx, yy - q.r * 0.15, q.r * 0.14, 0, TAU); ctx.arc(x + q.r * 0.32 + lx, yy - q.r * 0.15, q.r * 0.14, 0, TAU); ctx.fill();
    if (jump > 0.2) { ctx.beginPath(); ctx.ellipse(x + lx, yy + q.r * 0.3, q.r * 0.18, q.r * 0.22, 0, 0, TAU); ctx.fill(); }
  }
}

function lavaGlow(w, v) {
  const lava = w.c.lavaY, pit = curPit();
  const g = ctx.createLinearGradient(0, lava - 260, 0, lava);
  g.addColorStop(0, pit.glow + '0)'); g.addColorStop(1, pit.glow + '.45)');
  ctx.fillStyle = g; ctx.fillRect(v.x0, lava - 260, v.x1 - v.x0, 262);
}

function lavaSurface(w, v) {
  const lava = w.c.lavaY, t = G.time, pit = curPit();
  const x0 = v.x0, x1 = v.x1;
  const wave = x => Math.sin(x * 0.012 + t * 2.1) * 7 + Math.sin(x * 0.031 - t * 3.3) * 4;
  ctx.beginPath(); ctx.moveTo(x0, lava + 1200);
  for (let x = x0; x <= x1 + 20; x += 20) ctx.lineTo(x, lava + wave(x));
  ctx.lineTo(x1 + 20, lava + 1200); ctx.closePath();
  const g = ctx.createLinearGradient(0, lava - 10, 0, lava + 260);
  g.addColorStop(0, pit.stops[0]); g.addColorStop(0.12, pit.stops[1]); g.addColorStop(0.45, pit.stops[2]); g.addColorStop(1, pit.stops[3]);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pit.rim; ctx.lineWidth = 7;
  ctx.beginPath();
  for (let x = x0; x <= x1 + 20; x += 20) { const y = lava + wave(x) + 3; if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
  ctx.stroke();
  // crust plates drifting at several depths, and bubbles
  for (let row = 0; row < 5; row++) {
    ctx.fillStyle = row < 2 ? pit.crust[0] : pit.crust[1];
    const dir = row % 2 ? -1 : 1, sp = 14 + row * 6, gap = 200 + row * 40;
    for (let k = 0; k < Math.ceil((x1 - x0) / gap) + 2; k++) {
      const bx = Math.floor(x0 / gap) * gap + k * gap + ((dir * t * sp + row * 77) % gap + gap) % gap;
      ctx.beginPath(); ctx.ellipse(bx, lava + 38 + row * 60 + (k % 2) * 14, 50 + row * 8, 9 + row * 2, 0, 0, TAU); ctx.fill();
    }
  }
  for (let k = 0; k < 6; k++) {
    const ph = (t * 0.7 + k * 0.37) % 1;
    const bx = Math.floor(x0 / 300) * 300 + k * 300 + Math.sin(k * 9.1) * 90;
    const r = 6 + ph * 16;
    ctx.strokeStyle = pit.bub + (1 - ph) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(bx, lava + wave(bx) - 2, r, Math.PI, TAU); ctx.stroke();
  }
}

function pillar(id, art, w, f) {
  const lava = w.c.lavaY;
  ctx.lineJoin = 'round';
  // column
  ctx.fillStyle = art.pillar[0]; ctx.strokeStyle = INK; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-58, 70); ctx.lineTo(58, 70); ctx.lineTo(86, lava + 40); ctx.lineTo(-86, lava + 40); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = art.pillar[1]; ctx.beginPath(); ctx.moveTo(22, 72); ctx.lineTo(55, 72); ctx.lineTo(82, lava + 38); ctx.lineTo(34, lava + 38); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(42,18,56,.35)'; ctx.lineWidth = 3;
  for (let y = 110, k = 0; y < lava; y += 46, k++) {
    const hw = 58 + (y - 70) / (lava - 30) * 28;
    ctx.beginPath(); ctx.moveTo(-hw + 3, y); ctx.lineTo(hw - 3, y); ctx.stroke();
    const jx = (k % 2 ? -18 : 20);
    ctx.beginPath(); ctx.moveTo(jx, y); ctx.lineTo(jx, y + 46); ctx.stroke();
  }
  // a stern stone face keeps watch
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(-20, 132, 8, 5, 0.2, 0, TAU); ctx.ellipse(20, 132, 8, 5, -0.2, 0, TAU); ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.beginPath(); ctx.moveTo(-28, 152); ctx.quadraticCurveTo(0, 140, 28, 152); ctx.stroke();
  // platform
  ctx.fillStyle = art.pillarTop; ctx.lineWidth = 6;
  rrect(ctx, -132, 52, 264, 26, 10); ctx.fill(); ctx.stroke();
  // stops (rubber pads the plank clacks on)
  ctx.fillStyle = '#ff4b5c';
  for (const s of [-1, 1]) { rrect(ctx, s * 108 - 15, 43, 30, 12, 5); ctx.fill(); ctx.lineWidth = 4; ctx.stroke(); }
  // fulcrum
  if (id === 'roller') {
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.moveTo(-100, 50); ctx.lineTo(100, 50); ctx.stroke();
    ctx.beginPath(); ctx.arc(f, 30, 21, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.translate(f, 30); ctx.rotate(f / 21);
    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(15, 0); ctx.moveTo(0, -15); ctx.lineTo(0, 15); ctx.stroke(); ctx.restore();
    ctx.fillStyle = art.pillarTop; ctx.beginPath(); ctx.moveTo(f - 14, 12); ctx.lineTo(f + 14, 12); ctx.lineTo(f + 8, 20); ctx.lineTo(f - 8, 20); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (id === 'pumpkin') {
    // the plank balances on a giant jack-o'-lantern
    const glow = ctx.createRadialGradient(f, 34, 10, f, 34, 120);
    glow.addColorStop(0, 'rgba(255,200,80,.5)'); glow.addColorStop(1, 'rgba(255,160,40,0)');
    ctx.fillStyle = glow; ctx.fillRect(f - 120, -86, 240, 240);
    drawPumpkin(ctx, f, 30, 40, 0, 0.75 + 0.25 * Math.sin(G.time * 7), 'grin');
  } else {
    ctx.fillStyle = art.pillarTop; ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(f - 42, 54); ctx.lineTo(f, 8); ctx.lineTo(f + 42, 54); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function plank(id, art, w, th, f) {
  const c = w.c, ph = c.ph, L = w.L;
  const s0 = -L - f, s1 = L - f;
  ctx.save();
  ctx.translate(f, 0); ctx.rotate(th);
  const flex = G.flex;
  const N = 16;
  const yAt = s => flex * Math.pow(s / c.L, 2) * (s * G.flexAt >= 0 ? 1 : 0.6);
  // body as a strip
  const top = [], bot = [];
  for (let k = 0; k <= N; k++) { const s = s0 + (s1 - s0) * k / N, y = yAt(s); top.push([s, y - ph]); bot.push([s, y + ph]); }
  ctx.beginPath();
  ctx.moveTo(top[0][0], top[0][1]);
  for (const q of top) ctx.lineTo(q[0], q[1]);
  ctx.arc(s1, yAt(s1), ph, -Math.PI / 2, Math.PI / 2);
  for (let k = N; k >= 0; k--) ctx.lineTo(bot[k][0], bot[k][1]);
  ctx.arc(s0, yAt(s0), ph, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -ph, 0, ph);
  if (art.jelly) { g.addColorStop(0, 'rgba(210,255,200,.95)'); g.addColorStop(0.5, 'rgba(110,235,110,.92)'); g.addColorStop(1, 'rgba(40,180,90,.95)'); }
  else { g.addColorStop(0, art.plankTop); g.addColorStop(0.35, art.plank[0]); g.addColorStop(1, art.plank[1]); }
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  // grain / shine
  ctx.strokeStyle = art.grain; ctx.lineWidth = 2.5;
  for (const yy of [-4, 4]) {
    ctx.beginPath();
    for (let k = 0; k <= N; k++) { const s = s0 + (s1 - s0) * k / N; const y = yAt(s) + yy + Math.sin(s * 0.05 + yy) * 1.5; if (k === 0) ctx.moveTo(s, y); else ctx.lineTo(s, y); }
    ctx.stroke();
  }
  if (id === 'ice' || art.jelly) {
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 4;
    for (let s = s0 + 40; s < s1 - 30; s += 110) { ctx.beginPath(); ctx.moveTo(s, yAt(s) - ph + 5); ctx.lineTo(s + 26, yAt(s) - ph + 5); ctx.stroke(); }
  }
  // rope bands near the ends
  ctx.strokeStyle = art.rope; ctx.lineWidth = 4;
  for (const sg of [-1, 1]) {
    const sb = sg * (c.L - 46) - f;
    if (Math.abs(sb + f) > L - 6) continue;
    for (let k = 0; k < 3; k++) { const s = sb + (k - 1) * 8; ctx.beginPath(); ctx.moveTo(s - 4, yAt(s) - ph); ctx.lineTo(s + 4, yAt(s) + ph); ctx.stroke(); }
  }
  // overtime: the hub glows red hot and the glow spreads outward
  if (w.hub > c.sMin + 1) {
    const hr = w.hub;
    const hg = ctx.createLinearGradient(-hr - 30, 0, hr + 30, 0);
    const a = 0.75 + 0.2 * Math.sin(G.time * 18);
    hg.addColorStop(0, 'rgba(255,90,0,0)'); hg.addColorStop(0.12, 'rgba(255,80,0,' + a + ')'); hg.addColorStop(0.5, 'rgba(255,220,90,' + a + ')');
    hg.addColorStop(0.88, 'rgba(255,80,0,' + a + ')'); hg.addColorStop(1, 'rgba(255,90,0,0)');
    ctx.fillStyle = hg; ctx.fillRect(-hr - 30, -ph - 4, (hr + 30) * 2, ph * 2 + 8);
  }
  // burnt ends in overtime
  if (L < c.L - 1) {
    for (const sg of [-1, 1]) {
      const se = sg * L - f;
      const bg = ctx.createLinearGradient(se - sg * 70, 0, se, 0);
      bg.addColorStop(0, 'rgba(30,10,10,0)'); bg.addColorStop(1, 'rgba(30,10,10,.9)');
      ctx.fillStyle = bg; ctx.fillRect(Math.min(se, se - sg * 70), -ph - 20, 70, ph * 2 + 40);
      ctx.fillStyle = '#ff7a00'; ctx.beginPath(); ctx.arc(se, yAt(se), 7, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  // outline
  ctx.beginPath();
  ctx.moveTo(top[0][0], top[0][1]);
  for (const q of top) ctx.lineTo(q[0], q[1]);
  ctx.arc(s1, yAt(s1), ph, -Math.PI / 2, Math.PI / 2);
  for (let k = N; k >= 0; k--) ctx.lineTo(bot[k][0], bot[k][1]);
  ctx.arc(s0, yAt(s0), ph, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke();
  // centre bolt
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
  ctx.restore();
}

function shadowFor(w, i, pos, th, f) {
  const b = w.b[i];
  if (!b.alive || b.g) return;
  const fr = w.frame();
  const s = (pos.x - w.f - fr.nx * w.c.ph) / fr.dx;
  if (Math.abs(s + w.f) > w.L) return;
  const sy = fr.dy * s + fr.ny * w.c.ph;
  const hgt = Math.max(0, sy - pos.y - w.c.r);
  const k = clamp(1 - hgt / 700, 0.15, 1);
  ctx.save(); ctx.translate(pos.x, sy - 1); ctx.rotate(th);
  const R = w.c.r * G.vk;
  ctx.fillStyle = 'rgba(42,18,56,' + (0.35 * k) + ')';
  ctx.beginPath(); ctx.ellipse(0, 0, R * (0.5 + 0.5 * k), 6 * k + 2, 0, 0, TAU); ctx.fill();
  if (b.pound >= 1) {
    // incoming slam: a target mark where it will land
    const pulse = 0.6 + 0.4 * Math.sin(G.time * 30);
    ctx.strokeStyle = 'rgba(255,60,80,' + pulse + ')'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(0, 0, R * 1.05, 10, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function trailFor(i) {
  const V = G.vis[i], skin = SKINS[G.skins[i]] || SKINS[i];
  const r = G.world.c.r, R = r * G.vk;
  for (let k = 0; k < V.trail.length; k++) {
    const p = V.trail[k], a = (k / V.trail.length) * (1 - p[2] / 0.25);
    ctx.fillStyle = hexA(skin.light, 0.45 * a);
    ctx.beginPath(); ctx.arc(p[0], visY(p[1], r), R * (0.4 + 0.5 * k / V.trail.length), 0, TAU); ctx.fill();
  }
}

// pumpkins: a warning target on the plank while one falls, then the jack-o'-lantern itself
function pumpkinsFor(w) {
  const c = w.c, fr = w.frame(), ks = 1 + (G.vk - 1) * 0.6, R = c.pkR * ks;
  for (const p of w.pk) {
    if (p.st === 2) continue;
    if (p.st === 0 && p.first && p.vy >= 0) {
      const ys = w.surfY(p.x, fr);
      if (ys !== null) {
        const near = clamp(1 - (ys - p.y) / (c.pkH + 40), 0, 1), pulse = 0.55 + 0.45 * Math.sin(G.time * (14 + near * 20));
        ctx.save(); ctx.translate(p.x, ys - 1); ctx.rotate(Math.atan2(fr.dy, fr.dx));
        ctx.fillStyle = 'rgba(42,18,56,' + (0.15 + near * 0.3) + ')'; ctx.beginPath(); ctx.ellipse(0, 0, R * (0.5 + near * 0.6), 5 + near * 5, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,138,31,' + pulse + ')'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.ellipse(0, 0, R * 1.3, 11, 0, 0, TAU); ctx.stroke();
        ctx.restore();
      }
    }
    const y = p.st === 1 ? p.y + c.pkR - R : p.y;   // rolling: bottom on the plank
    drawPumpkin(ctx, p.x, y, R, p.ang, 0.7 + 0.3 * Math.sin(G.time * 9 + p.id), p.st === 0 && !p.first ? 'shock' : 'grin');
  }
}

function blobFor(w, i, pos, th) {
  const b = w.b[i], V = G.vis[i];
  if (!b.alive) return;
  const r0 = w.c.r, r = r0 * G.vk, cy = visY(pos.y, r0);

function koBlob(w) {

    const up = easeOut(clamp(tt / 0.5, 0, 1)) * r * 1.8 + Math.max(0, tt - 0.5) * r * 3.2;
    const gx = k.x + Math.sin(tt * 3) * r * 0.5 + Math.max(0, tt - 0.6) * (k.x < 0 ? -1 : 1) * r * 0.9;

}

function drawParts(v, front) {
  for (const p of G.parts) {
    const isFront = p.k === 'drop' || p.k === 'steam' || p.k === 'confetti' || p.k === 'snow' || p.k === 'gust' || p.k === 'star' || p.k === 'chunk' || p.k === 'candy';
    if (isFront !== front) continue;
    if (p.x < v.x0 - 100 || p.x > v.x1 + 100 || p.y < v.y0 - 200 || p.y > v.y1 + 100) continue;
    const k = p.t / p.life;
    switch (p.k) {
      case 'dust': case 'steam': case 'bubble':
        ctx.fillStyle = p.col; ctx.globalAlpha = (1 - k) * (p.k === 'bubble' ? 0.8 : 1);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.6 + k * 0.9), 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
        break;
      case 'drop':
        ctx.fillStyle = p.col; ctx.strokeStyle = INK; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - k * 0.4), 0, TAU); ctx.fill(); ctx.stroke();
        break;
      case 'spark': case 'ember': case 'flame': case 'snow':
        ctx.fillStyle = p.col; ctx.globalAlpha = p.k === 'snow' ? 0.9 : 1 - k;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.k === 'flame' ? 1 - k * 0.6 : 1), 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
        break;

        break;
      case 'confetti':
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2 * Math.abs(Math.cos(p.t * 9))); ctx.restore();
        break;

        ctx.restore(); ctx.globalAlpha = 1;

function drawRings() {

function outlinedText(text, x, y, size, fill, opts) {

function worldTexts() {
  for (const t of G.texts) {

    const s = t.pop ? easeOutBack(clamp(t.t / 0.18, 0, 1)) : 1;
    ctx.save(); ctx.translate(t.x, t.y - k * 40); ctx.rotate(t.rot || 0); ctx.scale(s, s);

// teaching by showing: a pressing thumb, "HOLD", "LET GO!", "TAP = SLAM"
function hints(w, pos) {
  const z = G.cam.z, sz = 26 / Math.max(0.5, z);
  if (G.state === 'play' && G.tut && G.mode === 'cpu') {
    const b = w.b[0], p = { x: pos[0].x, y: visY(pos[0].y, w.c.r) }, r = w.c.r * G.vk;
    let txt = null;
    if (b.g && !b.hold && G.tut.jumps < 2) txt = 'HOLD';
    else if (b.g && b.hold && w.charge(b) > 0.55 && G.tut.jumps < 2) txt = 'LET GO!';
    else if (!b.g && b.pound === 0 && G.tut.pounds < 1 && b.vy > -400 && G.tut.jumps >= 1) txt = 'TAP = SLAM!';
    if (txt) {
      const bob = Math.sin(G.time * 8) * 6;
      // keep the hint on screen even when the blob is at the plank's edge
      ctx.font = sz + "px 'Titan', sans-serif";
      const half = ctx.measureText(txt).width / 2 + sz * 0.3, vx0 = G.cam.x - W / 2 / z, vx1 = G.cam.x + W / 2 / z;
      const tx = clamp(p.x, vx0 + half, vx1 - half);
      outlinedText(txt, tx, p.y - r * (txt === 'HOLD' ? 2.9 : 2.2) + bob, sz, '#fff27a');
      if (txt === 'HOLD') thumb(p.x + r * 0.15, p.y - r * 1.15, r * 1.1, (G.time * 1.3) % 1);
      if (txt === 'TAP = SLAM!') { ctx.fillStyle = '#fff27a'; ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(p.x - 16, p.y + r * 1.4); ctx.lineTo(p.x + 16, p.y + r * 1.4); ctx.lineTo(p.x, p.y + r * 1.4 + 24); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }
  }
  if (G.mode === '2p' && G.round === 1 && (G.state === 'intro' || (G.state === 'play' && G.stateT < 4))) {
    const touch = UI.touchSeen;
    for (let i = 0; i < 2; i++) {
      const p = pos[i];
      const label = touch ? (i ? 'TAP RIGHT' : 'TAP LEFT') : (i ? 'L' : 'A');
      keycap(p.x, visY(p.y, w.c.r) - w.c.r * G.vk * 2.3, label, i, sz);
    }
  }
}
function keycap(x, y, label, i, sz) {
  ctx.save();
  ctx.font = sz + "px 'Titan', sans-serif";
  const tw = Math.max(sz * 1.3, ctx.measureText(label).width + sz * 0.8), th = sz * 1.5;
  ctx.fillStyle = i ? '#3d8bff' : '#ff4b5c'; ctx.strokeStyle = INK; ctx.lineWidth = sz * 0.16;
  rrect(ctx, x - tw / 2, y - th / 2 + sz * 0.12, tw, th, sz * 0.35); ctx.fillStyle = INK; ctx.fill();
  rrect(ctx, x - tw / 2, y - th / 2 - sz * 0.08, tw, th, sz * 0.35); ctx.fillStyle = i ? '#3d8bff' : '#ff4b5c'; ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y - sz * 0.05);
  ctx.restore();
}
function thumb(x, y, s, ph) {
  // a pointing hand pressing down
  const press = ph < 0.45 ? easeOut(ph / 0.45) : 1;
  ctx.save(); ctx.translate(x, y + press * s * 0.22); ctx.rotate(-0.35);
  ctx.fillStyle = '#ffe3c8'; ctx.strokeStyle = INK; ctx.lineWidth = s * 0.1; ctx.lineJoin = 'round';
  rrect(ctx, -s * 0.16, -s * 0.15, s * 0.32, s * 0.75, s * 0.16); ctx.fill(); ctx.stroke();       // index finger
  rrect(ctx, -s * 0.38, s * 0.35, s * 0.78, s * 0.62, s * 0.26); ctx.fill(); ctx.stroke();        // fist

}

function offscreen(w, pos) {
  const c = G.cam, top = c.y - H / 2 / c.z;
  for (let i = 0; i < 2; i++) {
    const b = w.b[i];
    if (!b.alive || pos[i].y + w.c.r > top + 10) continue;
    const sx = clamp(W / 2 + (pos[i].x - c.x) * c.z, 40, W - 40);
    const skin = SKINS[G.skins[i]] || SKINS[i];
    const alt = Math.max(0, Math.round(-pos[i].y * M_PER_U));
    const y = 64;
    ctx.save();
    ctx.fillStyle = skin.body; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(sx, y - 46); ctx.lineTo(sx - 14, y - 26); ctx.lineTo(sx + 14, y - 26); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, y, 24, 0, TAU); ctx.fill(); ctx.stroke();

    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(sx - 8, y - 5, 3.5, 0, TAU); ctx.arc(sx + 8, y - 5, 3.5, 0, TAU); ctx.fill();

function banner() {
  const b = G.banner, k = b.t / b.life;

function koText() {

// ---------------------------------------------------------------- meta progress
const Meta = {
  trophies: Store.get('trophies', 0),
  unlocked: Store.get('unlocked', [0, 1]),
  wins: Store.get('wins', 0),
  bestAlt: Store.get('bestAlt', 0),
  candy: Store.get('candy', 0),          // Halloween currency (kept, but only earned while the event runs)
  treatDay: Store.get('treatDay', 0),    // the daily treat: bonus candy for the first match of each event day
  isUnlocked(k) { return this.unlocked.indexOf(k) >= 0 || (!SKINS[k].event && SKINS[k].cost <= 0); },
  // event skins show while their event runs, and forever once earned
  visible(k) { return !SKINS[k].event || SKINS[k].event === EVENT.id || this.isUnlocked(k); },
  nextLocked() { for (let k = 0; k < SKINS.length; k++) if (!SKINS[k].event && !this.isUnlocked(k)) return k; return -1; },
  nextCandy() { for (let k = 0; k < SKINS.length; k++) if (SKINS[k].event === EVENT.id && !this.isUnlocked(k)) return k; return -1; },
  unlock(k) { if (!this.isUnlocked(k)) { this.unlocked.push(k); Store.set('unlocked', this.unlocked); return true; } return false; },
  award(n) {
    this.trophies += n; Store.set('trophies', this.trophies);
    const fresh = [];
    for (let k = 0; k < SKINS.length; k++) if (!SKINS[k].event && !this.isUnlocked(k) && this.trophies >= SKINS[k].cost) { this.unlock(k); fresh.push(k); }
    return fresh;
  },
  addCandy(n) {
    this.candy += n; Store.set('candy', this.candy);
    const fresh = [];
    for (let k = 0; k < SKINS.length; k++) if (SKINS[k].event === EVENT.id && !this.isUnlocked(k) && this.candy >= SKINS[k].candy) { this.unlock(k); fresh.push(k); }
    return fresh;
  }
};
