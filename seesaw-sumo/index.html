    startDemo();
    show(el.menu, true);
    el.btnPause.style.visibility = 'hidden';
    paintLogo();
    api.paintEvent();
  };

  // pause
  api.setPaused = function (p) {
    if (G.state === 'menu' || G.state === 'over') { if (!p) G.paused = false; return; }
    if (p === G.paused) return;
    G.paused = p; Sfx.setPaused(p);
    show(el.pause, p);
    G.held = [false, false];
    if (p) Ads.gameplayStop(); else Ads.gameplayStart();
  };
  el.btnPause.addEventListener('click', e => { e.stopPropagation(); Sfx.click(); api.setPaused(!G.paused); });
  el.btnResume.addEventListener('click', e => { e.stopPropagation(); Sfx.click(); api.setPaused(false); });
  el.btnQuit.addEventListener('click', e => { e.stopPropagation(); Sfx.click(); api.toMenu(); });

  // HUD
  function pips(node, n, on) {
    node.innerHTML = '';
    for (let k = 0; k < n; k++) { const d = document.createElement('div'); d.className = 'pip' + (k < on ? ' on' : ''); node.appendChild(d); }
  }
  api.hud = function (pop) {
    pips(el.pipsL, WIN_AT, G.score[0]); pips(el.pipsR, WIN_AT, G.score[1]);
    const cpu = G.mode === 'cpu';
    el.nameL.textContent = cpu ? 'YOU' : 'P1';
    el.nameR.textContent = cpu ? G.diff.toUpperCase() + ' CPU' : 'P2';
    el.hudRound.textContent = 'ROUND ' + Math.max(1, G.round);
    const ar = ARENAS[G.arena];
    el.hudArena.textContent = ar.name.toUpperCase() + (ar.id !== 'volcano' ? ' · ' + ar.tag : '');
    paintPortrait(el.faceL, SKINS[G.skins[0]], 'idle', [0.5, 0], { scale: 0.3, cy: 0.58 });
    paintPortrait(el.faceR, SKINS[G.skins[1]], 'idle', [-0.5, 0], { scale: 0.3, cy: 0.58 });
  };

  // results
  api.showResult = function () {
    const cpu = G.mode === 'cpu', p1 = G.score[0] > G.score[1];
    const wi = p1 ? 0 : 1;
    el.resTitle.textContent = cpu ? (p1 ? 'YOU WIN!' : 'CPU WINS') : (p1 ? 'P1 WINS!' : 'P2 WINS!');
    el.resTitle.style.color = cpu ? (p1 ? '#e0203f' : INK) : (p1 ? '#e0203f' : '#1f5fd6');
    el.resSub.textContent = G.score[0] + ' : ' + G.score[1] + (cpu ? ' vs ' + G.diff.toUpperCase() + ' CPU' : '');
    paintPortrait(el.resPortrait, SKINS[G.skins[wi]], cpu && !p1 ? 'smug' : 'win', [0, 0], { scale: 0.32, cy: 0.62 });
    // highest throw: what the winner did to the loser
    const alt = Math.max(G.stats.maxAlt[1 - wi], G.stats.maxAlt[wi] * 0);
    const m = Math.round(Math.max(G.stats.maxAlt[0], G.stats.maxAlt[1]) * M_PER_U);
    el.stThrow.textContent = m + ' m';
    el.stSlams.textContent = G.stats.slams[0] + (cpu ? '' : ' / ' + G.stats.slams[1]);
    // every finished match moves the skin bar; wins on harder CPUs move it more
    let gain = 1;
    if (cpu && p1) gain = { easy: 2, normal: 3, hard: 5 }[G.diff] || 2;
    el.stTroph.textContent = '+' + gain;
    const before = Meta.trophies;
    const fresh = Meta.award(gain);
    if (cpu && p1) { Meta.wins++; Store.set('wins', Meta.wins); }
    if (m > Meta.bestAlt) { Meta.bestAlt = m; Store.set('bestAlt', m); }
    paintUnlock(before);
    // Halloween candy: stomped pumpkins, Pumpkin Patch rounds won, the match itself, a win, and the first match of the day
    let candyFresh = [];
    if (EVENT.on) {
      let c = G.stats.candy + G.stats.pkWins + 2 + (cpu && p1 ? 3 : 0);
      const treat = Meta.treatDay !== EVENT.dayKey;
      if (treat) { c += 3; Meta.treatDay = EVENT.dayKey; Store.set('treatDay', EVENT.dayKey); }
      G.lastCandy = c;
      candyFresh = Meta.addCandy(c);
      paintCandy(c, treat);
    }
    show(el.candyBox, EVENT.on);
    show(el.hud, false);
    show(el.result, true);
    el.btnPause.style.visibility = 'hidden';
    const all = candyFresh.concat(fresh);
    if (all.length) {
      setTimeout(() => { Sfx.unlock(); api.toast('NEW SKIN: ' + SKINS[all[0]].name.toUpperCase() + '!'); }, 600);
    }
  };
  function paintCandy(gain, treat) {
    const nx = Meta.nextCandy();
    let txt = '+' + gain + ' CANDY' + (treat ? ' (incl. daily treat +3)' : '') + ' · ';
    let pct = 1;
    if (nx < 0) txt += 'all Halloween skins unlocked!';
    else {
      const prev = SKINS.filter(s => s.event === EVENT.id && s.candy < SKINS[nx].candy).reduce((m, s) => Math.max(m, s.candy), 0);
      txt += SKINS[nx].name + ' at ' + SKINS[nx].candy + ' (' + Math.max(0, SKINS[nx].candy - Meta.candy) + ' to go)';
      pct = clamp((Meta.candy - prev) / Math.max(1, SKINS[nx].candy - prev), 0, 1);
    }
    el.candyTxt.textContent = txt;
    el.candyBar.style.width = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.candyBar.style.width = (pct * 100).toFixed(0) + '%'; }));
  }
  api.paintEvent = function () {
    show(el.evBadge, EVENT.on);
    if (!EVENT.on) return;
    el.evSub.textContent = 'PUMPKIN PATCH · UNTIL ' + EVENT.endsText;
    el.evCandy.textContent = Meta.candy;
    const c = el.evIcon.getContext('2d'); c.clearRect(0, 0, el.evIcon.width, el.evIcon.height);
    drawPumpkin(c, el.evIcon.width / 2, el.evIcon.height * 0.56, el.evIcon.width * 0.36, -0.1, 1);
    el.menuHint.textContent = 'Hold to charge, let go to jump. Land on pumpkins for candy!';
  };
  function paintUnlock(before) {
    const nx = Meta.nextLocked();
    if (nx < 0) { el.unlockTxt.textContent = 'Every skin unlocked. Champion!'; el.unlockBar.style.width = '100%'; return; }
    const prevCost = nx > 0 ? Math.max(0, SKINS[nx - 1].cost) : 0, cost = SKINS[nx].cost;
    const need = cost - Meta.trophies;
    el.unlockTxt.textContent = need > 0 ? 'Next skin: ' + SKINS[nx].name + ' at ' + cost + ' trophies (' + need + ' to go)' : 'Next skin: ' + SKINS[nx].name;
    const pct = clamp((Meta.trophies - prevCost) / Math.max(1, cost - prevCost), 0, 1);
    el.unlockBar.style.width = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.unlockBar.style.width = (pct * 100).toFixed(0) + '%'; }));
  }

  // skins
  function openSkins() {
    Sfx.unlock(); Sfx.click();
    skinTab = 0; paintTabs(); paintSkins(); show(el.skins, true);
  }
  el.btnSkins.addEventListener('click', e => { e.stopPropagation(); openSkins(); });
  el.btnResSkins.addEventListener('click', e => { e.stopPropagation(); openSkins(); });
  el.btnSkinsClose.addEventListener('click', e => { e.stopPropagation(); Sfx.click(); show(el.skins, false); api.hud(); paintLogo(); api.paintEvent(); });
  el.skinTabs.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); skinTab = +b.dataset.p; paintTabs(); paintSkins(); Sfx.click(); });
  function paintTabs() { el.skinTabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.p === skinTab)); }
  function paintSkins() {
    el.trophyLine.textContent = Meta.trophies + ' trophies · win matches to unlock more' + (EVENT.on ? ' · ' + Meta.candy + ' candy' : '');
    el.skinGrid.innerHTML = '';
    SKINS.forEach((sk, k) => {
      if (!Meta.visible(k)) return;
      const d = document.createElement('button');
      const un = Meta.isUnlocked(k);
      d.className = 'sk' + (G.skins[skinTab] === k ? ' sel' : '') + (un ? '' : ' lock') + (sk.event ? ' ev' : '');
      d.setAttribute('aria-label', sk.name + (un ? '' : ', locked'));
      const c = document.createElement('canvas'); c.width = 120; c.height = 120; d.appendChild(c);
      paintPortrait(c, sk, 'idle', [0.3, 0.1], { scale: 0.3, cy: 0.62 });
      const n = document.createElement('div'); n.textContent = sk.name; d.appendChild(n);
      if (!un) { const l = document.createElement('div'); l.className = 'lk'; l.textContent = sk.event ? sk.candy + ' CANDY' : sk.cost + '★'; d.appendChild(l); }
      if (sk.event) { const t = document.createElement('div'); t.className = 'evt'; t.textContent = 'HALLOWEEN'; d.appendChild(t); }
      if (G.skins[0] === k || G.skins[1] === k) { const p = document.createElement('div'); p.className = 'p'; p.textContent = G.skins[0] === k ? 'P1' : 'P2'; p.style.background = G.skins[0] === k ? '#ff4b5c' : '#3d8bff'; d.appendChild(p); }
      d.addEventListener('click', e => {
        e.stopPropagation();
        if (!un) { Sfx.bonk(); api.toast(sk.event ? 'Halloween skin: ' + sk.candy + ' candy. Stomp pumpkins!' : 'Locked: ' + sk.cost + ' trophies'); return; }
        const other = G.skins[1 - skinTab];
        if (other === k) G.skins[1 - skinTab] = G.skins[skinTab];
        G.skins[skinTab] = k;
        Store.set('skins', G.skins);
        Sfx.pop(); paintSkins();
      });
      el.skinGrid.appendChild(d);
    });
    const nx = Meta.nextLocked();
    el.btnAdUnlock.style.display = nx < 0 ? 'none' : '';
    if (nx >= 0) el.adUnlockTxt.textContent = 'UNLOCK ' + SKINS[nx].name.toUpperCase() + ' NOW';
  }
  el.btnAdUnlock.addEventListener('click', e => {
    e.stopPropagation();
    if (rewardBusy) return;
    const nx = Meta.nextLocked(); if (nx < 0) return;
    rewardBusy = true; el.btnAdUnlock.disabled = true;
    adBreak('rewarded').then(ok => {
      rewardBusy = false; el.btnAdUnlock.disabled = false;
      if (ok) {
        Meta.unlock(nx); G.skins[skinTab] = nx; Store.set('skins', G.skins);
        Sfx.unlock(); api.toast('UNLOCKED: ' + SKINS[nx].name.toUpperCase() + '!');
      } else api.toast('No ad available right now. Try again soon.');
      paintSkins();
    });
  });

  function paintLogo() {
    const c = el.logo;
    drawLogo(c.getContext('2d'), c.width, c.height, EVENT.on);
  }
  api.paintLogo = paintLogo;
  return api;
})();

// ad breaks: mute, freeze, resume
function adBreak(kind) {
  G.ad = true; G.held = [false, false];
  Sfx.setPaused(true);
  const onStart = () => { Sfx.setAdMuted(true); };
  const p = kind === 'rewarded' ? Ads.rewardedBreak(onStart) : Ads.commercialBreak(onStart);
  const done = res => { G.ad = false; Sfx.setAdMuted(false); Sfx.setPaused(false); last = performance.now(); return res; };
  return p.then(done, () => done(false));
}

// ---------------------------------------------------------------- input
const Input = (function () {
  const P1KEYS = new Set(['KeyA', 'KeyQ', 'KeyW', 'KeyS', 'KeyZ', 'KeyX', 'ShiftLeft']);
  const P2KEYS = new Set(['KeyL', 'KeyK', 'KeyP', 'KeyO', 'KeyM', 'ShiftRight', 'Enter', 'NumpadEnter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
  const keysDown = [new Set(), new Set()];
  const ptrs = new Map(); // pointerId -> player
  function sync(i) {
    let on = keysDown[i].size > 0;
    for (const v of ptrs.values()) if (v === i) on = true;
    G.held[i] = on;
  }
  function playerForKey(code) {
    if (G.mode === '2p') { if (P1KEYS.has(code)) return 0; if (P2KEYS.has(code)) return 1; if (code === 'Space') return 0; return -1; }
    if (P1KEYS.has(code) || P2KEYS.has(code) || code === 'Space') return 0;
    return -1;
  }
  function gameActive() { return (G.state === 'play' || G.state === 'intro' || G.state === 'ko') && !G.paused && !G.ad; }
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyM' && G.mode !== '2p') { UI.setMuted(!Sfx.muted); return; }
    if (e.code === 'Escape' || e.code === 'KeyP' && G.mode !== '2p') { if (G.state !== 'menu' && G.state !== 'over') UI.setPaused(!G.paused); e.preventDefault(); return; }
    Sfx.unlock();
    if (G.state === 'menu' && !UI.el.menu.classList.contains('hidden') && (e.code === 'Space' || e.code === 'Enter') && UI.el.skins.classList.contains('hidden')) {
      e.preventDefault(); UI.begin('cpu'); return;
    }
    if (G.state === 'over' && !UI.el.result.classList.contains('hidden') && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); UI.begin(G.mode === '2p' ? '2p' : 'cpu'); return; }
    if (G.state === 'replay' && !e.repeat) { G.skipReplay = true; e.preventDefault(); return; }
    if (!gameActive()) return;
    const i = playerForKey(e.code);
    if (i < 0) return;
    e.preventDefault();
    if (e.repeat) return;
    keysDown[i].add(e.code); sync(i);
  });
  window.addEventListener('keyup', e => {
    for (let i = 0; i < 2; i++) if (keysDown[i].delete(e.code)) sync(i);
  });
  function down(e) {
    if (e.pointerType === 'touch') UI.touchSeen = true;
    if (G.state === 'replay') { G.skipReplay = true; return; }
    Sfx.unlock();
    if (!Sfx.Music.on && Sfx.ready()) Sfx.Music.start();
    if (G.state === 'menu' && G.mode === 'demo' && !UI.el.menu.classList.contains('hidden') && UI.el.skins.classList.contains('hidden')) {
      // tapping the live scene starts a match: one tap to play
      UI.begin('cpu'); return;
    }
    if (!gameActive()) return;
    e.preventDefault();
    let i = 0;
    if (G.mode === '2p') i = e.clientX < W / 2 ? 0 : 1;
    ptrs.set(e.pointerId, i);
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* fine */ }
    sync(i);
  }
  function up(e) {
    if (!ptrs.has(e.pointerId)) return;
    const i = ptrs.get(e.pointerId); ptrs.delete(e.pointerId); sync(i);
  }
  cv.addEventListener('pointerdown', down);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  function clear() { keysDown[0].clear(); keysDown[1].clear(); ptrs.clear(); G.held = [false, false]; }
  window.addEventListener('blur', clear);
  return { clear };
})();

// ---------------------------------------------------------------- loop, resize, visibility
let last = performance.now();
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  updateVisScale();
  bgCache.key = '';
  G.camInit = false;
}
window.addEventListener('resize', resize);

let fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 0.05);
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { G.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  try {
    if (G.world && ARENAS[G.arena].id === 'storm') { G.lightning = Math.max(0, G.lightning - dt * 3); if (rnd() < dt * 0.12) { G.lightning = 1; G.boltX = rr(-600, 600); } }
    update(dt);
    render();
  } catch (err) {
    if (!G.errLogged) { G.errLogged = true; console.error(err); }
  }
}

document.addEventListener('visibilitychange', () => {
  const hid = document.hidden;
  Sfx.setHidden(hid);
  if (hid) { Input.clear(); if (G.state === 'play' || G.state === 'intro' || G.state === 'ko' || G.state === 'replay') UI.setPaused(true); }
});
Ads.hooks.pause = () => { G.ad = true; Sfx.setAdMuted(true); };
Ads.hooks.resume = () => { G.ad = false; Sfx.setAdMuted(false); last = performance.now(); };

// ---------------------------------------------------------------- test hooks (used by the automated soak tests)
window.__ss = {
  state() {
    const w = G.world;
    return {
      state: G.state, mode: G.mode, diff: G.diff, round: G.round, score: G.score.slice(), arena: ARENAS[G.arena].id,
      paused: G.paused, ad: G.ad, fps: Math.round(G.fps), ads: Ads.log.slice(), kind: Ads.kind, timeScale: +G.timeScale.toFixed(2),
      t: w ? +w.t.toFixed(2) : 0, th: w ? +w.th.toFixed(3) : 0,
      blobs: w ? w.b.map(b => ({ alive: b.alive, g: b.g, x: Math.round(b.x), y: Math.round(b.y), u: Math.round(b.u), hold: b.hold, pound: b.pound, vy: Math.round(b.vy), launchV: Math.round(b.launchV) })) : [],
      menu: !UI.el.menu.classList.contains('hidden'), result: !UI.el.result.classList.contains('hidden'), matchesDone: G.matchesDone,
      trophies: Meta.trophies, event: EVENT.id, candy: Meta.candy, lastCandy: G.lastCandy || 0, vk: +G.vk.toFixed(2), blobPx: Math.round(SIM.BASE.r * G.vk * G.cam.z),
      arenas: ARENAS.map(a => a.id), pumpkins: w && w.pk ? w.pk.filter(p => p.st < 2).length : 0, pkDrops: w ? w.pkId : 0, hub: w ? Math.round(w.hub) : 0,
      unlocked: Meta.unlocked.slice(), visibleSkins: SKINS.map((s, k) => k).filter(k => Meta.visible(k)).map(k => SKINS[k].id)
    };
  },
  world() { return G.world; },
  // what a player would see: used by the test bots to play like a person
  view(i) {
    const w = G.world; if (!w) return null;
    const b = w.b[i], o = w.b[1 - i];
    return { alive: b.alive, g: b.g, hold: b.hold, charge: +w.charge(b).toFixed(2), endUp: +(-Math.sign(b.u - w.f) * w.th).toFixed(3), vy: Math.round(b.vy), pound: b.pound,
      oAlive: o.alive, oG: o.g, oTTL: o.g ? 9 : +SIM.timeToLand(w, o).toFixed(3), oVy: Math.round(o.vy), x: b.x, y: b.y };
  },
  toScreen(x, y) { const c = G.cam; return { x: W / 2 + (x - c.x) * c.z, y: H / 2 + (y - c.y) * c.z }; },
  timeToLand(i) { return SIM.timeToLand(G.world, G.world.b[i]); },
  setScore(a, b) { G.score = [a, b]; UI.hud(); },
  // tests: jump straight to a given arena (index into the live rotation) for the next round
  forceArena(id) { const k = ARENAS.findIndex(a => a.id === id); if (k >= 0 && G.world) { setArena(k); G.world = makeWorld(k, false, 1); newBrains(); } return k; }
};

// ---------------------------------------------------------------- boot
(function boot() {
  if (CLEAN) for (const id of ['hud', 'corner', 'toast']) { const n = $(id); if (n) n.style.visibility = 'hidden'; }
  resize();
  const saved = Store.get('skins', null);
  if (Array.isArray(saved) && saved.length === 2) G.skins = saved.map((k, i) => (SKINS[k] && Meta.isUnlocked(k)) ? k : i);
  if (G.skins[0] === G.skins[1]) G.skins[1] = G.skins[0] === 1 ? 0 : 1;
  startDemo();
  UI.el.btnPause.style.visibility = 'hidden';
  requestAnimationFrame(t => { last = t; frame(t); });
  const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load("40px 'Titan'"), document.fonts.load("700 20px 'Fred'")]).catch(() => null) : Promise.resolve();
  fontsReady.then(() => { UI.paintLogo(); UI.hud(); });
  UI.paintLogo();
  UI.paintEvent();
  Ads.init().then(() => { Ads.loadingFinished(); });
})();

})();
</script>
