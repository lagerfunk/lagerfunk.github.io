:root{
  --ink:#2a1238; --ink2:#4a2160; --cream:#fff6e8; --sun:#ffd23f; --sun2:#ffb703; --red:#ff4b5c; --blue:#3d8bff;
  --panel:#fff6e8; --panel2:#ffe6c7; --shadow:0 6px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ff8a4c;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{font-family:'Fred',system-ui,sans-serif;color:var(--ink)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
.hidden{display:none!important}
button{font-family:inherit;color:var(--ink);cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:3px dashed #fff;outline-offset:3px}

/* chunky cartoon buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.45em;font-family:'Titan',sans-serif;letter-spacing:.02em;
  background:var(--cream);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:.5em 1.1em;font-size:20px;line-height:1;
  transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active,.btn.press{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:clamp(28px,7.2vmin,46px);padding:.42em 1.25em;border-radius:24px;border-width:5px;box-shadow:0 8px 0 var(--ink);background:linear-gradient(#ffe266,#ffc21a 70%,#ffab00)}
.btn.big:active{box-shadow:0 2px 0 var(--ink);transform:translateY(6px)}
.btn.sun{background:linear-gradient(#ffe266,#ffc21a 70%,#ffab00)}
.btn.red{background:linear-gradient(#ff7b86,#ff4b5c);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.blue{background:linear-gradient(#78b0ff,#3d8bff);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.green{background:linear-gradient(#8ff08a,#3fcf5a);}
.btn .ico{width:1.05em;height:1.05em;display:block}
.btn.round{width:52px;height:52px;padding:0;border-radius:16px;font-size:22px}
.btn[disabled]{filter:grayscale(.6) brightness(.9);pointer-events:none}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* top corner controls */
#corner{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;z-index:30}
#corner .btn{width:46px;height:46px;border-radius:14px;padding:0;box-shadow:0 4px 0 var(--ink);border-width:3px}
#corner .btn:active{box-shadow:0 1px 0 var(--ink);transform:translateY(3px)}
#corner svg{width:24px;height:24px}

/* menu */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));pointer-events:none}
#menu>*{pointer-events:auto}
#logo{width:min(92vw,560px);height:auto;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(42,18,56,.35));margin-top:clamp(28px,6vh,60px)}
#menuBottom{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(94vw,460px)}
.seg{display:flex;background:var(--ink);border-radius:16px;padding:4px;gap:4px;box-shadow:0 5px 0 rgba(42,18,56,.45)}
.seg button{font-family:'Titan',sans-serif;font-size:15px;color:#e9d9ff;padding:9px 14px;border-radius:12px;letter-spacing:.04em}
.seg button.on{background:var(--cream);color:var(--ink)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#menuHint{font-size:13px;color:#fff;background:rgba(42,18,56,.72);border-radius:12px;padding:6px 12px;text-align:center;line-height:1.3}
@media (orientation:landscape) and (max-height:520px){
  #logo{width:min(46vw,420px);margin-top:4px}
  #menuBottom{gap:9px}
  .btn.big{font-size:30px}
}

/* hud */
#hud{display:flex;justify-content:space-between;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
.side{display:flex;align-items:center;gap:8px;background:rgba(42,18,56,.82);border-radius:16px;padding:6px 12px 6px 6px;color:#fff;box-shadow:0 4px 0 rgba(42,18,56,.35)}
.side.r{flex-direction:row-reverse;padding:6px 6px 6px 12px}
.side canvas{width:clamp(38px,3.1vw,56px);height:clamp(38px,3.1vw,56px)}
.side .nm{font-family:'Titan',sans-serif;font-size:clamp(15px,1.35vw,22px);letter-spacing:.03em;line-height:1}
.side .sub{font-size:11px;opacity:.8;letter-spacing:.06em}
.pips{display:flex;gap:5px;margin-top:4px}
.side.r .pips{justify-content:flex-end}
.pip{width:clamp(14px,1.15vw,20px);height:clamp(14px,1.15vw,20px);border-radius:50%;border:3px solid #fff;background:transparent}
.pip.on{background:var(--sun);border-color:var(--sun);box-shadow:0 0 10px var(--sun)}
#hudMid{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 0 rgba(42,18,56,.7);pointer-events:none}
#hudRound{font-family:'Titan',sans-serif;font-size:clamp(16px,1.4vw,24px);letter-spacing:.06em}
#hudArena{font-size:clamp(11px,.9vw,15px);letter-spacing:.08em;opacity:.9}
#hud{padding-right:calc(max(12px,env(safe-area-inset-right)) + 112px)}
@media (orientation:portrait){ #hudMid{top:calc(max(12px,env(safe-area-inset-top)) + 118px)} #hud{padding-top:calc(max(10px,env(safe-area-inset-top)) + 58px);padding-right:max(12px,env(safe-area-inset-right))} #hudArena{display:none} }
@media (orientation:landscape) and (max-width:900px){ #hudMid{display:none} .side{padding:4px 10px 4px 4px;gap:6px} .side.r{padding:4px 4px 4px 10px} .side canvas{width:30px;height:30px} .side .nm{font-size:13px} .pip{width:12px;height:12px;border-width:2.5px} #corner .btn{width:40px;height:40px} #hud{padding-right:calc(max(12px,env(safe-area-inset-right)) + 100px)} }

/* panels */
.veil{position:fixed;inset:0;background:rgba(42,18,56,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;pointer-events:auto}
.card{background:var(--panel);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:20px 18px 18px;width:min(94vw,440px);max-height:92vh;overflow:auto;text-align:center;position:relative}
.card h2{font-family:'Titan',sans-serif;font-size:clamp(30px,8vmin,44px);margin:0 0 6px;letter-spacing:.02em;line-height:1.05}
.card .sub{font-size:15px;opacity:.75;margin-bottom:12px}
.stats{display:flex;justify-content:center;gap:10px;margin:10px 0 16px;flex-wrap:wrap}
.stat{background:var(--panel2);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;min-width:92px}
.stat b{display:block;font-family:'Titan',sans-serif;font-size:24px;line-height:1.1}
.stat span{font-size:11px;letter-spacing:.06em;opacity:.75}
#resPortrait{width:150px;height:130px;display:block;margin:-6px auto 2px}
.prog{height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff9f1c);width:0;transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.small{font-size:13px;opacity:.8}
#btnAdUnlock{font-size:17px;max-width:100%;white-space:normal}
#skinGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 12px}
.sk{position:relative;background:var(--panel2);border:3px solid var(--ink);border-radius:14px;padding:4px 2px 4px;font-size:11px;line-height:1.1}
.sk canvas{width:100%;aspect-ratio:1/1;display:block}
.sk.sel{background:#ffe266;box-shadow:inset 0 0 0 3px #fff}
.sk.lock canvas{filter:brightness(.25) saturate(0)}
.sk .lk{position:absolute;top:30%;left:0;right:0;font-family:'Titan',sans-serif;font-size:14px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.sk .p{position:absolute;top:2px;left:4px;font-family:'Titan',sans-serif;font-size:11px;color:#fff;border-radius:6px;padding:1px 4px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:4px}
.tabs button{font-family:'Titan',sans-serif;font-size:14px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;background:#fff}
.tabs button.on{background:var(--ink);color:#fff}
.x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-family:'Titan',sans-serif;font-size:20px;box-shadow:0 3px 0 var(--ink)}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(260%);visibility:hidden;background:var(--ink);color:#fff;font-family:'Titan',sans-serif;font-size:16px;padding:12px 18px;border-radius:16px;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
#rotate{display:none}
/* Halloween event */
#evBadge{display:flex;align-items:center;gap:8px;background:linear-gradient(#ffb24a,#ff8a1f);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:4px 12px 4px 4px;color:var(--ink)}
#evBadge canvas{width:44px;height:44px}
#evBadge b{display:block;font-family:'Titan',sans-serif;font-size:16px;letter-spacing:.03em;line-height:1.05}

#evCandy{margin-left:4px;font-family:'Titan',sans-serif;font-size:18px;background:#fff6e8;border:3px solid var(--ink);border-radius:12px;padding:2px 8px}
#evCandy:before{content:'';display:inline-block;width:11px;height:13px;margin-right:5px;vertical-align:-1px;background:linear-gradient(#fff 0 33%,#ff8a1f 33% 66%,#ffd23f 66%);clip-path:polygon(50% 0,100% 100%,0 100%)}
.prog.candy i{background:linear-gradient(90deg,#ffb24a,#a066ff)}
#candyBox{margin-top:8px}
.sk.ev{background:#ffe0bd}
.sk .evt{position:absolute;bottom:18px;left:0;right:0;font-family:'Titan',sans-serif;font-size:8px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 0 var(--ink)}
@media (orientation:landscape) and (max-height:520px){ #evBadge{padding:2px 10px 2px 2px} #evBadge canvas{width:34px;height:34px} #evBadge b{font-size:13px} }
/* landscape phones: the result card must fit without scrolling, REMATCH included */
@media (orientation:landscape) and (max-height:520px){
  #result .card{width:min(94vw,560px);padding:10px 16px 12px}
  #resPortrait{width:74px;height:62px;margin:-4px auto 0}
  #result h2{font-size:26px;margin:0}
  #result .sub{font-size:13px;margin-bottom:4px}
  #result .stats{margin:4px 0 6px;gap:8px}
  #result .stat{padding:3px 10px;min-width:84px}
  #result .stat b{font-size:18px}
  #result .prog{height:12px;margin:3px 0 2px}
  #candyBox{margin-top:4px}

  #result .btn.big{font-size:24px;padding:.3em 1.1em}
  #result .btn{font-size:16px;padding:.4em .9em}
}

<body>
<canvas id="cv" aria-label="Seesaw Sumo game"></canvas>

<div id="corner">
  <button class="btn" id="btnPause" aria-label="Pause" title="Pause (Esc)"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.5" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.5" fill="currentColor"/></svg></button>
  <button class="btn" id="btnMute" aria-label="Mute sound" title="Sound (M)"></button>
</div>

<div id="hud" class="layer hidden">
  <div class="side l" id="sideL"><canvas width="76" height="76" id="faceL"></canvas><div><div class="nm" id="nameL">YOU</div><div class="pips" id="pipsL"></div></div></div>
  <div class="side r" id="sideR"><canvas width="76" height="76" id="faceR"></canvas><div><div class="nm" id="nameR">CPU</div><div class="pips" id="pipsR"></div></div></div>
  <div id="hudMid"><div id="hudRound">ROUND 1</div><div id="hudArena">VOLCANO</div></div>
</div>

<div id="menu" class="layer">
  <canvas id="logo" width="1120" height="520" aria-label="Seesaw Sumo"></canvas>
  <div id="menuBottom">
    <div id="evBadge" class="hidden"><canvas id="evIcon" width="88" height="88"></canvas><div><b>HALLOWEEN EVENT</b><span id="evSub">PUMPKIN PATCH</span></div><div id="evCandy" title="Candy">0</div></div>
    <div class="seg" id="diffSeg" role="group" aria-label="CPU difficulty">
      <button data-d="easy" class="on">EASY</button><button data-d="normal">NORMAL</button><button data-d="hard">HARD</button>
    </div>
    <button class="btn big pulse" id="btnPlay">PLAY</button>
    <div class="row">
      <button class="btn blue" id="btn2p"><svg class="ico" viewBox="0 0 24 24"><circle cx="8" cy="9" r="4" fill="currentColor"/><circle cx="17" cy="10" r="3.4" fill="currentColor"/><path d="M1.5 21c.5-4 3.2-6.4 6.5-6.4s6 2.4 6.5 6.4z" fill="currentColor"/><path d="M14.6 21c-.2-2.2-1-4-2.3-5.1 1.2-.9 2.9-1.3 4.6-1.3 3 0 5.2 2 5.6 6.4z" fill="currentColor"/></svg>2 PLAYERS</button>
      <button class="btn" id="btnSkins"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3c5 0 9 4 9 9.5 0 4.6-3.4 8-9 8s-9-3.4-9-8C3 7 7 3 12 3z" fill="#ff4b5c" stroke="#2a1238" stroke-width="2"/><circle cx="9" cy="12" r="1.8" fill="#2a1238"/><circle cx="15" cy="12" r="1.8" fill="#2a1238"/></svg>SKINS</button>
    </div>
    <div id="menuHint">Hold to charge, let go to jump. Tap in the air to belly slam.</div>
  </div>
</div>

<div id="pause" class="veil hidden">
  <div class="card">
    <h2>PAUSED</h2>
    <div class="row" style="margin-top:14px"><button class="btn sun" id="btnResume">RESUME</button><button class="btn" id="btnQuit">MENU</button></div>
  </div>
</div>

<div id="result" class="veil hidden">
  <div class="card">
    <canvas id="resPortrait" width="300" height="260"></canvas>
    <h2 id="resTitle">YOU WIN!</h2>
    <div class="sub" id="resSub">3 : 1 vs CPU</div>
    <div class="stats">
      <div class="stat"><b id="stThrow">0 m</b><span>HIGHEST THROW</span></div>
      <div class="stat"><b id="stSlams">0</b><span>BELLY SLAMS</span></div>
      <div class="stat"><b id="stTroph">+0</b><span>TROPHIES</span></div>
    </div>

      <div class="small" id="unlockTxt">Next skin at 4 trophies</div>
      <div class="prog"><i id="unlockBar"></i></div>
    </div>

    <div class="row" style="margin-top:12px"><button class="btn" id="btnMenu">MENU</button><button class="btn" id="btnResSkins">SKINS</button></div>
  </div>
</div>

<div id="skins" class="veil hidden">
  <div class="card">
    <button class="x" id="btnSkinsClose" aria-label="Close">&times;</button>

    <div class="tabs" id="skinTabs"><button data-p="0" class="on">PLAYER 1</button><button data-p="1">PLAYER 2</button></div>
    <div class="small" id="trophyLine">0 trophies</div>
    <div id="skinGrid"></div>
    <button class="btn green" id="btnAdUnlock"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3" fill="#2a1238"/><path d="M10 9v6l5-3z" fill="#fff"/></svg><span id="adUnlockTxt">UNLOCK NOW</span></button>
  </div>
</div>

<div id="toast"></div>

<script>
// ================================================================ SEESAW SUMO: physics core and CPU brain
// Pure logic, no DOM. Runs in the browser and in node (tools/tune.js) with the same numbers.
// World units: 1 unit is about 1 px at 1x zoom. y points down. The fulcrum sits at (f, 0).
//
// One button per player:
//   on the plank: hold = crouch and charge, release = jump (longer hold, higher jump)
//   in the air:   press = BELLY SLAM (hang for a blink, then drop straight down, fast)
// Landing whips the plank. Whoever stands on the other end rides it up and is thrown at the stop.
// Every throw also pushes you outward, so your distance to the edge is your health bar.
(function (root) {
  'use strict';

  const DT = 1 / 120;

  // Every number that shapes the feel lives here.
  const BASE = {
    g: 2700,          // gravity. High gravity = snappy arcs, short hang time
    r: 46,            // blob radius
    ph: 16,           // plank half thickness
    L: 330,           // plank half length
    start: 185,       // starting distance from the fulcrum
    thMax: 0.34,      // tilt at which the plank hits its stops (about 19.5 deg)
    Ip: 52000,        // plank inertia about its middle
    Mp: 1.4,          // plank mass (for the off-centre weight on the rolling-pivot arena)
    K: 520000,        // centring spring in the hinge
    C: 60000,         // hinge damping
    jumpMin: 660,     // tap hop speed
    jumpMax: 1320,    // full charge jump speed
    chargeT: 0.38,    // seconds of hold for full charge
    react: 0.2,       // how much a take-off pushes your own end down
    poundHang: 0.08,  // belly slam wind-up at the top of the arc (the readable tell)
    poundK: 62,       // belly slam drop speed = poundK * sqrt(height above the plank)
    poundMin: 380,
    rampLo: 320,      // landings slower than this barely whip the plank...
    rampHi: 1250,     // ...and the full slam amplifier kicks in by this speed
    gain: 2.6,        // slam amplifier: how hard a falling blob whips the plank
    kick: 0.16,       // sideways throw of a launch, as a share of launch speed
    kickMin: 260,     // launches slower than this throw nobody sideways
    stopE: 0.14,      // bounce off the stops
    mu: 0.9,          // plank friction (grip)
    e: 0,             // landing bounce of blobs
    sMin: 58,         // the bolt on the fulcrum: blobs cannot stand closer than this
    lavaY: 300,       // lava surface
    wind: 0,          // wind strength (arena)
    windPeriod: 9,
    windDir: 1,       // which way the first gust blows (the game flips it every round)
    grip: 1.7,        // holding the button multiplies your grip (squat to cling on ice)
    pivotAmp: 0,      // rolling pivot travel (arena)
    pivotPeriod: 8,
    otStart: 24,      // overtime: plank ends start to burn...
    otRate: 12,
    otMin: 120,
    hubRate: 24,      // ...and the hub heats up: the no-standing zone around the fulcrum grows outward
    hubMax: 210,
    // Halloween Pumpkin Patch: jack-o'-lanterns drop from the sky, whip the plank, then roll downhill
    pumpkins: 0,
    pkR: 34,          // pumpkin radius
    pkM: 0.55,        // pumpkin mass (a blob is 1)
    pkG: 1700,        // pumpkins fall a little floaty so the drop reads
    pkH: 760,         // drop height above the fulcrum
    pkGain: 1.9,      // landing whip amplifier
    pkRoll: 50,       // rolling resistance
    pkFirst: 2.6,     // world seconds before the first drop (the intro takes 1.25)
    pkEvery: [2.8, 4.4],
    pkMax: 2
  };

  const ARENAS = [
    { id: 'volcano', name: 'Volcano', tag: 'CLASSIC', mods: {} },
    { id: 'ice', name: 'Ice Plank', tag: 'SLIPPERY', mods: { mu: 0.2, otStart: 10, hubRate: 30 } },  // ice rounds stalled at the hub: overtime comes early
    { id: 'jelly', name: 'Jelly Plank', tag: 'BOUNCY', mods: { stopE: 0.42, gain: 3.0, K: 640000 } },
    { id: 'roller', name: 'Rolling Pivot', tag: 'MOVING PIVOT', mods: { pivotAmp: 80, pivotPeriod: 7.5 } },
    { id: 'storm', name: 'Storm Peak', tag: 'WINDY', mods: { wind: 150, windPeriod: 7 } }
  ];

  // Seasonal arenas join the rotation only while their event runs (the game decides; the physics just knows them)
  const EVENT_ARENAS = {
    halloween: [{ id: 'pumpkin', name: 'Pumpkin Patch', tag: 'PUMPKIN RAIN', mods: { pumpkins: 1 }, event: 'halloween' }]
  };
  function arenaList(event) { return event && EVENT_ARENAS[event] ? EVENT_ARENAS[event].concat(ARENAS) : ARENAS; }

  function cfgFor(arenaIdx, list) {
    list = list || ARENAS;
    const a = list[((arenaIdx % list.length) + list.length) % list.length];
    return Object.assign({}, BASE, a.mods);
  }

  function mkBlob(side, c) {
    return {
      side, alive: true, ko: false, g: true, u: side * c.start, vs: 0,
      x: side * c.start, y: -(c.ph + c.r), vx: 0, vy: 0,
      hold: false, ht: 0, hd: 0, airT: 0, landT: 9, spin: 0, ang: 0,
      anchor: null,      // plank spot a plain hop will land back on (keeps position = health honest)
      pound: 0,          // 0 none, 1 queued (fires at the top of the arc), 2 hanging, 3 dropping, 4 used
      pt: 0,
      launchV: 0, koT: 0, koHow: '', minY: 0, teeter: 0,
      jumps: 0, pounds: 0, flights: 0, bestThrow: 0, pkHit: 0
    };
  }

  function World(cfg, seed) {
    this.c = cfg;
    this.dt = DT;
    this.t = 0;
    this.th = 0; this.om = 0;
    this.f = 0;          // fulcrum offset along the plank (rolling pivot)
    this.L = cfg.L;      // current half length (burns down in overtime)
    this.hub = cfg.sMin; // no-standing zone around the fulcrum (grows in overtime)
    this.windV = 0;
    this.b = [mkBlob(-1, cfg), mkBlob(1, cfg)];
    this.ev = [];
    this.quiet = false;
    this.flip = false;
    this.pk = [];        // pumpkins (Pumpkin Patch arena)
    this.pkId = 0;
    this.pkSide = 0;
    this.rs = ((seed >>> 0) || 0x9e3779b9) >>> 0;
    this.pkNext = cfg.pumpkins ? cfg.pkFirst : 1e9;
    this.placeGrounded();
  }

  World.prototype.rnd = function () {
    let s = this.rs; s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; this.rs = s; return s / 4294967296;
  };

  World.prototype.clone = function (coarse) {
    const w = Object.create(World.prototype);
    w.c = this.c; w.dt = coarse ? 1 / 60 : this.dt; w.t = this.t; w.th = this.th; w.om = this.om;
    w.f = this.f; w.L = this.L; w.hub = this.hub; w.windV = this.windV;
    w.b = [Object.assign({}, this.b[0]), Object.assign({}, this.b[1])];
    w.pk = this.pk.map(p => Object.assign({}, p)); w.pkId = this.pkId; w.pkSide = this.pkSide; w.rs = this.rs;
    w.pkNext = 1e9;      // look-ahead worlds do not invent new pumpkins
    w.ev = []; w.quiet = true; w.flip = this.flip;
    return w;
  };

  World.prototype.emit = function (type, o) {
    if (this.quiet) return;
    o.type = type; o.t = this.t; this.ev.push(o);
  };

  World.prototype.frame = function () {
    const ct = Math.cos(this.th), st = Math.sin(this.th);
    return { dx: ct, dy: st, nx: st, ny: -ct };
  };

  // Blobs stand upright: the centre sits straight above the point of the plank top they stand on.
  World.prototype.restPos = function (b, fr) {
    const s = b.u - this.f, ph = this.c.ph;
    b.x = this.f + fr.dx * s + fr.nx * ph;
    b.y = fr.dy * s + fr.ny * ph - this.c.r;
  };
  // velocity of the plank top at lever s (plus any slide along it)
  World.prototype.surfVel = function (s, vs, fr, om) {
    const ph = this.c.ph, rx = fr.dx * s + fr.nx * ph, ry = fr.dy * s + fr.ny * ph;
    return [-om * ry + fr.dx * vs, om * rx + fr.dy * vs];
  };

  World.prototype.placeGrounded = function () {
    const fr = this.frame();
    for (const b of this.b) if (b.g && b.alive) {
      this.restPos(b, fr);
      const v = this.surfVel(b.u - this.f, b.vs, fr, this.om);
      b.vx = v[0]; b.vy = v[1];
    }
  };

  World.prototype.inertia = function (skip) {
    let I = this.c.Ip + this.c.Mp * this.f * this.f;
    for (const b of this.b) if (b !== skip && b.g && b.alive) { const s = b.u - this.f; I += s * s; }
    for (const p of this.pk) if (p.st === 1 && p !== skip) { const s = p.u - this.f; I += this.c.pkM * s * s; }
    return I;
  };

  World.prototype.charge = function (b) { return Math.min(1, b.ht / this.c.chargeT); };

  World.prototype.jump = function (b) {
    const c = this.c, fr = this.frame();
    const ch = this.charge(b);
    const e = Math.pow(ch, 0.85);
    const vj = c.jumpMin + (c.jumpMax - c.jumpMin) * e;
    const s = b.u - this.f;
    const sv = this.surfVel(s, b.vs, fr, this.om);
    const un = -sv[1];                             // how fast your spot on the plank rises
    const Ir = this.inertia(b);
    let dOm = s * (vj * c.react) / Ir;
    if ((this.th >= c.thMax - 1e-4 && dOm > 0) || (this.th <= -c.thMax + 1e-4 && dOm < 0)) dOm = 0;
    // leave straight up: the plank's vertical motion carries over, its sideways swing does not
    b.vx = fr.dx * b.vs;
    b.vy = sv[1] - vj;
    if (un > c.kickMin) { b.vx += Math.sign(s) * c.kick * un; b.launchV = un; b.flights++; b.anchor = null; }
    else { b.launchV = 0; b.anchor = Math.abs(b.vs) < 1 ? b.u : null; }
    this.om += dOm;
    b.g = false; b.airT = 0; b.ht = 0; b.jumps++; b.pound = 0;
    b.spin = 0; b.minY = b.y;
    this.emit('jump', { i: this.b.indexOf(b), ch, v: vj });
  };

  // In the air, the first button edge (press or let go) asks for a belly slam.
  // It waits for the top of the arc, hangs for a blink, then drops straight down.
  World.prototype.askPound = function (b) {
    if (b.g || b.pound !== 0) return;
    b.pound = 1; b.pounds++;
  };
  World.prototype.startPound = function (b) {
    b.pound = 2; b.pt = this.c.poundHang;
    b.vx *= 0.15; b.vy = 0; b.anchor = null;
    this.emit('pound', { i: this.b.indexOf(b) });
  };
  World.prototype.surfY = function (x, fr) {
    const c = this.c, s = (x - this.f - fr.nx * c.ph) / fr.dx;
    if (Math.abs(s + this.f) > this.L) return null;
    return fr.dy * s + fr.ny * c.ph;
  };

  // held[i]: is player i's button down this step
  World.prototype.input = function (held) {
    const dt = this.dt;
    for (let k = 0; k < 2; k++) {
      const i = this.flip ? 1 - k : k;   // alternate who goes first so neither side is favoured
      const b = this.b[i]; if (!b.alive) continue;
      const h = !!held[i];
      if (h && !b.hold) {
        b.hold = true; b.ht = 0; b.hd = 0;
        if (!b.g) this.askPound(b);
        this.emit('press', { i, g: b.g });
      } else if (h) { b.ht += dt; b.hd += dt; }
      else if (b.hold) {
        b.hold = false;
        if (b.g) this.jump(b);
        else { this.askPound(b); b.ht = 0; }
      }
      if (b.hold) b.ht = Math.min(b.ht, this.c.chargeT * 2);
    }
  };

  World.prototype.step = function (held) {
    const c = this.c, dt = this.dt;
    this.t += dt;
    this.flip = !this.flip;
    const order = this.flip ? [this.b[1], this.b[0]] : this.b;
    if (held) this.input(held);

    if (c.pivotAmp) this.f = c.pivotAmp * Math.sin(this.t * 2 * Math.PI / c.pivotPeriod);
    if (c.wind) {
      // calm for the first second, then gusts that swap sides
      const raw = Math.sin(Math.max(0, this.t - 1.2) * 2 * Math.PI / c.windPeriod);
      this.windV = c.windDir * c.wind * Math.sign(raw) * Math.min(1, Math.abs(raw) * 2.2);
    }
    if (this.t > c.otStart) {
      if (this.L > c.otMin) this.L = Math.max(c.otMin, this.L - c.otRate * dt);
      this.hub = Math.min(c.hubMax, c.sMin + c.hubRate * (this.t - c.otStart));
    }
    if (c.pumpkins && this.t >= this.pkNext && !this.quiet) this.spawnPumpkin();

    // ---- plank
    const fr0 = this.frame();
    const I = this.inertia(null);
    let tq = -c.K * this.th - c.C * this.om + c.Mp * c.g * (-this.f) * fr0.dx;
    for (const b of this.b) if (b.g && b.alive) tq += c.g * (b.u - this.f) * fr0.dx;
    for (const p of this.pk) if (p.st === 1) tq += c.g * c.pkM * (p.u - this.f) * fr0.dx;
    this.om += tq / I * dt;
    this.th += this.om * dt;
    let stopHit = 0, stopOm = 0;
    if (this.th > c.thMax) { this.th = c.thMax; if (this.om > 0) { stopOm = this.om; this.om = -this.om * c.stopE; stopHit = 1; } }
    if (this.th < -c.thMax) { this.th = -c.thMax; if (this.om < 0) { stopOm = this.om; this.om = -this.om * c.stopE; stopHit = -1; } }
    if (stopHit && Math.abs(stopOm) > 0.4) this.emit('stop', { dir: stopHit, om: Math.abs(stopOm) });

    const fr = this.frame();

    // ---- grounded blobs
    for (const b of order) {
      if (!b.alive || !b.g) continue;
      b.landT += dt;
      const s0 = b.u - this.f;
      if (stopHit) {
        const un = -this.surfVel(s0, 0, fr0, stopOm)[1];  // how fast this spot was rising
        if (un > 70) {                        // rising end: the stop throws you
          b.g = false; b.airT = 0; b.pound = 0;
          // the stop flicks you straight up, plus an outward throw for big launches
          b.vx = fr0.dx * b.vs;
          b.vy = -un + fr0.dy * b.vs;
          if (un > c.kickMin) { b.vx += Math.sign(s0) * c.kick * un; b.anchor = null; }
          else b.anchor = Math.abs(b.vs) < 1 ? b.u : null;
          b.launchV = un; b.minY = b.y; b.flights++; b.bestThrow = Math.max(b.bestThrow, un);
          b.spin = Math.sign(s0) * Math.min(16, un / 110);
          this.emit('launch', { i: this.b.indexOf(b), v: un });
          continue;
        } else if (un < -70) this.emit('thud', { i: this.b.indexOf(b), v: -un });
      }
      // slide along the plank (ice), held in place by friction otherwise
      const gAlong = c.g * fr.dy, gN = c.g * Math.abs(fr.dx);
      const mu = b.hold ? c.mu * c.grip : c.mu;
      if (Math.abs(b.vs) < 2 && Math.abs(gAlong) <= mu * gN) b.vs = 0;
      else {
        b.vs += gAlong * dt;
        const fric = mu * gN * dt;
        if (Math.abs(b.vs) <= fric) b.vs = 0; else b.vs -= Math.sign(b.vs) * fric;
      }
      b.u += b.vs * dt;
      let s = b.u - this.f;
      if (Math.abs(s) < this.hub) { const sg = Math.sign(s || b.side); b.u = this.f + sg * this.hub; if (Math.sign(b.vs) !== sg) b.vs = 0; s = b.u - this.f; }
      b.teeter = Math.max(0, Math.min(1, (Math.abs(b.u) - (this.L - c.r * 0.7)) / (c.r * 0.7)));
      this.restPos(b, fr);
      const sv = this.surfVel(s, b.vs, fr, this.om);
      b.vx = sv[0]; b.vy = sv[1];
      if (Math.abs(b.u) > this.L) {           // slid or burned off the end
        b.g = false; b.airT = 0; b.minY = b.y; b.vx += Math.sign(b.u) * 60; b.launchV = 0; b.anchor = null;
        this.emit('slip', { i: this.b.indexOf(b) });
      }
    }

    // ---- airborne blobs
    for (const b of order) {
      if (!b.alive || b.g) continue;
      b.airT += dt;
      if (b.pound === 1 && b.vy > -90) this.startPound(b);
      if (b.pound === 2) {
        b.pt -= dt;
        b.vx *= 0.8;
        if (b.pt <= 0) {
          b.pound = 3; b.vx *= 0.3;
          const sy = this.surfY(b.x, fr);
          const h = Math.max(0, (sy === null ? 0 : sy) - (b.y + c.r));
          b.vy = Math.max(c.poundMin, c.poundK * Math.sqrt(h));
        }
      } else {
        b.vy += c.g * dt;
        if (c.wind && b.pound < 2) { b.vx += this.windV * dt; b.anchor = null; }
        b.x += b.vx * dt; b.y += b.vy * dt;
      }
      if (b.anchor !== null) { b.x = this.f + fr.dx * (b.anchor - this.f) + fr.nx * c.ph; b.vx = 0; }
      b.ang += b.spin * dt;
      if (b.y < b.minY) b.minY = b.y;
      this.collidePlank(b, fr);
      if (b.alive && !b.g && b.y > c.lavaY) this.koBlob(b);
      if (b.alive && !b.g && (Math.abs(b.x) > 3000 || b.y < -12000)) this.koBlob(b);
    }

    this.collideBlobs(fr);
    if (this.pk.length) this.stepPumpkins(stopHit ? fr0 : null, stopOm, fr);
  };

  // ---------------------------------------------------------------- pumpkins (Halloween: Pumpkin Patch)
  World.prototype.spawnPumpkin = function () {
    const c = this.c;
    let live = 0; for (const p of this.pk) if (p.st < 2) live++;
    this.pkNext = this.t + c.pkEvery[0] + (c.pkEvery[1] - c.pkEvery[0]) * this.rnd();
    if (live >= c.pkMax) return;
    // alternate sides so nobody is picked on; never straight onto a standing blob's head
    this.pkSide = this.pkSide ? -this.pkSide : (this.rnd() < 0.5 ? -1 : 1);
    let u = 0;
    for (let k = 0; k < 6; k++) {
      u = this.pkSide * (90 + this.rnd() * (this.L - 130));
      let ok = true;
      for (const b of this.b) if (b.alive && Math.abs((b.g ? b.u : b.x) - u) < c.r + c.pkR + 20) ok = false;
      if (ok) break;
    }
    const id = ++this.pkId;
    this.pk.push({ id, st: 0, first: true, tu: u, x: this.f + u, y: -c.pkH, vx: 0, vy: 0, u: 0, vs: 0, ang: (this.rnd() - 0.5) * 0.6, spin: (this.rnd() - 0.5) * 3, t: 0 });
    this.emit('pkDrop', { id, u });
  };

  World.prototype.pkLandImpulse = function (x, vrel, gain) {
    const c = this.c;
    const Ie = this.inertia(null), a = x - this.f;
    const J = c.pkM * vrel / (1 + c.pkM * a * a / Ie);
    const ramp = Math.max(0, Math.min(1, (vrel - c.rampLo) / (c.rampHi - c.rampLo)));
    let dOm = a * J / Ie * (1 + (gain - 1) * ramp);
    const blocked = (this.th >= c.thMax - 1e-4 && this.om + dOm > 0) || (this.th <= -c.thMax + 1e-4 && this.om + dOm < 0);
    if (blocked) dOm = -this.om;
    this.om += dOm;
    return { power: Math.abs(dOm), blocked };
  };

  World.prototype.smashPumpkin = function (p, how, i) {
    p.st = 2;
    this.emit('pkSmash', { id: p.id, x: p.x, y: p.y, how, i: i === undefined ? -1 : i });
  };

  World.prototype.stepPumpkins = function (fr0, stopOm, fr) {
    const c = this.c, dt = this.dt, R = c.pkR, rr = c.r + R;
    for (const p of this.pk) {
      if (p.st === 2) continue;
      p.t += dt;
      if (p.st === 1) {
        // rolling on the plank: a ball rolls downhill at 5/7 g sin(tilt)
        let s = p.u - this.f;
        if (fr0) {
          const un = -this.surfVel(s, 0, fr0, stopOm)[1];
          if (un > 300) {   // the stop flicks a rising pumpkin into the air
            p.st = 0; p.vx = fr0.dx * p.vs + Math.sign(s) * 0.1 * un; p.vy = -un * 0.8 + fr0.dy * p.vs; p.spin = Math.sign(s) * 6;
            this.emit('pkFlick', { id: p.id, v: un });
            continue;
          }
        }
        p.vs += c.g * fr.dy * (5 / 7) * dt;
        const rf = c.pkRoll * dt;
        if (Math.abs(p.vs) <= rf) p.vs = 0; else p.vs -= Math.sign(p.vs) * rf;
        p.u += p.vs * dt; s = p.u - this.f;
        p.ang += p.vs / R * dt;
        p.x = this.f + fr.dx * s + fr.nx * (c.ph + R); p.y = fr.dy * s + fr.ny * (c.ph + R);
        p.vx = fr.dx * p.vs; p.vy = fr.dy * p.vs;
        if (Math.abs(p.u) > this.L) {   // over the edge and into the pit
          p.st = 0; p.vx = fr.dx * p.vs; p.vy = fr.dy * p.vs; p.first = false; p.spin = p.vs / R;
          this.emit('pkFall', { id: p.id });
          continue;
        }
        // bowling: a rolling pumpkin knocks a standing blob outward
        for (let i = 0; i < 2; i++) {
          const b = this.b[i];
          if (!b.alive || !b.g) continue;
          const d = b.u - p.u;
          if (Math.abs(d) >= rr) continue;
          const sg = Math.sign(d) || 1, rel = (p.vs - b.vs) * sg;
          if (rel > 90) {
            b.g = false; b.airT = 0; b.pound = 0; b.anchor = null; b.launchV = 0; b.minY = b.y; b.flights++;
            b.vx = sg * (160 + 0.45 * rel) * fr.dx; b.vy = -(380 + 0.25 * rel);
            b.spin = sg * 9; b.pkHit = this.t;
            this.emit('pkBowl', { i, v: rel, x: b.x, y: b.y });
            this.smashPumpkin(p, 'bowl', i);
            break;
          }
          // slow contact: the pumpkin rests against the blob and rides along with it
          p.u = b.u - sg * rr; p.vs = b.vs;
        }
        if (p.st !== 1) continue;
      } else {
        // flying or falling
        p.vy += c.pkG * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.ang += p.spin * dt;
        const s = (p.x - this.f - fr.nx * c.ph) / fr.dx, ys = fr.dy * s + fr.ny * c.ph;
        if (Math.abs(s + this.f) <= this.L && p.vy > 0 && p.y + R > ys && p.y + R < ys + c.ph * 2 + R) {
          const vsy = this.om * (fr.dx * s + fr.nx * c.ph), vrel = p.vy - vsy;
          const hit = this.pkLandImpulse(p.x, vrel, c.pkGain);
          p.st = 1; p.u = s + this.f; p.vs = (p.vx * fr.dx + p.vy * fr.dy) * 0.4; p.y = ys - R;
          this.emit('pkLand', { id: p.id, x: p.x, y: p.y + R, v: vrel, power: hit.power, blocked: hit.blocked, first: p.first });
          p.first = false;
        } else if (p.y > c.lavaY) {
          this.smashPumpkin(p, 'pit');
          continue;
        }
      }
      // pumpkins and blobs touching in the air: stomp it, or get bonked by it
      for (let i = 0; i < 2 && p.st < 2; i++) {
        const b = this.b[i];
        if (!b.alive) continue;
        const dx = b.x - p.x, dy = b.y - p.y;
        if (dx * dx + dy * dy >= rr * rr * 0.92) continue;
        if (!b.g && dy < -R * 0.3 && b.vy > p.vy - 50) {
          // landed on top of it: SQUASH, and the pumpkin springs you back up
          b.vy = -760; b.vx *= 0.5; b.pound = 0; b.anchor = null; b.airT = 0.1; b.minY = b.y;
          this.emit('pkStomp', { i, x: p.x, y: p.y });
          this.smashPumpkin(p, 'stomp', i);
        } else if (p.st === 0 && dy > R * 0.2 && p.vy > 0) {
          // a pumpkin on the head: the hit goes through the blob into the plank
          if (b.g) this.pkLandImpulse(b.x, p.vy, c.pkGain);
          else { b.vy += p.vy * 0.5; b.anchor = null; }
          this.emit('pkBonk', { i, x: p.x, y: p.y });
          this.smashPumpkin(p, 'bonk', i);
        } else if (!b.g) {
          b.vx += (Math.sign(dx) || 1) * 260; b.anchor = null;
          this.smashPumpkin(p, 'side', i);
        }
      }
    }
    if (this.pk.length > 6) this.pk = this.pk.filter(p => p.st < 2);
  };

  World.prototype.collidePlank = function (b, fr) {
    const c = this.c;
    // the plank top straight below the blob
    const s = (b.x - this.f - fr.nx * c.ph) / fr.dx;
    const u = s + this.f;
    const ys = fr.dy * s + fr.ny * c.ph;
    const foot = b.y + c.r;
    if (Math.abs(u) <= this.L && foot > ys && foot < ys + c.ph * 2 + c.r * 0.9) {
      const vsy = this.om * (fr.dx * s + fr.nx * c.ph);
      const vrel = b.vy - vsy;            // > 0: closing in
      b.y = ys - c.r;
      if (vrel > 0) this.land(b, s, vrel, fr);
      return;
    }
    // the rounded ends: blobs that land half off roll off the corner, outward
    for (let k = 0; k < 2; k++) {
      const sgn = k ? 1 : -1;
      const es = sgn * this.L - this.f;
      const ex = this.f + fr.dx * es, ey = fr.dy * es;
      const dx = b.x - ex, dy = b.y - ey, dd = Math.hypot(dx, dy);
      const R = c.r + c.ph;
      if (dd < R && dd > 1e-6 && Math.abs(u) > this.L) {
        const nx = dx / dd, ny = dy / dd;
        b.x = ex + nx * R; b.y = ey + ny * R;
        const ux = -this.om * ey, uy = this.om * (ex - this.f);
        const vr = (b.vx - ux) * nx + (b.vy - uy) * ny;
        if (vr < 0) {
          b.vx -= 1.3 * vr * nx; b.vy -= 1.3 * vr * ny;
          b.vx += sgn * 40;
          b.spin = sgn * 9; b.anchor = null;
          this.emit('corner', { i: this.b.indexOf(b), v: -vr });
        }
      }
    }
  };

  World.prototype.land = function (b, s, vrel, fr) {
    const c = this.c;
    const i = this.b.indexOf(b);
    const Ie = this.inertia(b);
    const a = b.x - this.f;               // horizontal lever
    const J = vrel / (1 + a * a / Ie);
    // the gain applies to the blob's own fall, not to the plank running up into a hovering blob
    const own = Math.max(0, Math.min(1, b.vy / vrel));
    const ramp = Math.max(0, Math.min(1, (vrel - c.rampLo) / (c.rampHi - c.rampLo)));
    const gEff = 1 + (c.gain - 1) * own * ramp;
    let dOm = a * J / Ie * gEff;
    const intoStop = (this.th >= c.thMax - 1e-4 && this.om + dOm > 0) || (this.th <= -c.thMax + 1e-4 && this.om + dOm < 0);
    if (intoStop) dOm = -this.om; // your end is already down: the stop eats the hit
    this.om += dOm;
    const impact = vrel;
    const pounded = b.pound === 3;
    b.pound = 0;
    this.emit('land', { i, v: impact, s, dOm, blocked: intoStop, power: Math.abs(dOm), pounded, air: b.airT, alt: -b.minY, x: b.x, y: b.y });
    if (c.e > 0 && impact > 300 && !b.hold) {
      // jelly: bounce back up
      const vsy = this.om * (fr.dx * s + fr.nx * c.ph);
      b.vy = vsy - impact * c.e; b.vx *= 0.6;
      b.airT = 0; b.minY = b.y; b.spin *= 0.5; b.launchV = 0;
      return;
    }
    const vt = b.vx * fr.dx + b.vy * fr.dy;
    b.g = true; b.u = b.anchor !== null ? b.anchor : s + this.f; b.landT = 0; b.launchV = 0; b.anchor = null; b.pkHit = 0;
    b.vs = c.mu > 0.3 ? 0 : vt * 0.85;
    b.spin = 0; b.ang = 0;
  };

  World.prototype.collideBlobs = function (fr) {
    const A = this.b[0], B = this.b[1];
    if (!A.alive || !B.alive) return;
    const c = this.c;
    const dx = B.x - A.x, dy = B.y - A.y, dd = Math.hypot(dx, dy), R = c.r * 1.9;
    if (dd >= R || dd < 1e-6) return;
    const nx = dx / dd, ny = dy / dd, pen = R - dd;
    if (A.g && B.g) { const p = pen * 0.5; A.u -= p; B.u += p; this.placeGrounded(); return; }
    const wa = A.g ? 0.2 : 1, wb = B.g ? 0.2 : 1, ws = wa + wb;
    A.x -= nx * pen * wa / ws; A.y -= ny * pen * wa / ws;
    B.x += nx * pen * wb / ws; B.y += ny * pen * wb / ws;
    const vr = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
    if (vr < 0) {
      const j = -(1.5) * vr / ws;
      A.vx -= nx * j * wa; A.vy -= ny * j * wa;
      B.vx += nx * j * wb; B.vy += ny * j * wb;
      for (const g of [A, B]) { if (g.g) g.vx = g.vy = 0; else g.anchor = null; }
      this.emit('bonk', { v: -vr, x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 });
    }
  };

  World.prototype.koBlob = function (b) {
    b.alive = false; b.ko = true; b.koT = this.t; b.g = false; b.hold = false; b.pound = 0;
    const alt = -b.minY;
    b.koHow = alt > 1100 ? 'orbit' : (b.launchV > 1000 ? 'yeet' : (b.launchV > 0 ? 'launch' : (b.pkHit && this.t - b.pkHit < 3 ? 'pumpkin' : (this.L < this.c.L - 5 || this.hub > this.c.sMin + 5 ? 'burn' : 'slip'))));
    this.emit('ko', { i: this.b.indexOf(b), x: b.x, how: b.koHow, alt });
  };

  // Will this airborne blob end in the lava if nobody presses anything?
  World.prototype.doomed = function (i, horizon) {
    const b = this.b[i];
    if (!b.alive) return true;
    if (b.g) return false;
    const w = this.clone(true);
    const steps = Math.ceil((horizon || 2.5) / w.dt);
    const held = [this.b[0].hold, this.b[1].hold];
    held[i] = b.hold;
    for (let k = 0; k < steps; k++) {
      w.step(held);
      const q = w.b[i];
      if (!q.alive) return true;
      if (q.g) return false;
    }
    return false;
  };

  // ---------------------------------------------------------------- CPU brain
  // A rule-based sumo with a short look-ahead for dodges. It plays the way a good human does:
  // attack when your end is up, hop over incoming slams, belly-slam back if a throw would carry you off.
  // Difficulty = reaction time, timing noise, patience between attacks, and how often it blunders.
  const LEVELS = {
    easy:   { react: 0.42, jitter: 0.07, patience: [0.8, 2.0], dodge: 0.3, recover: 0.3, apexPound: 0.2, blunder: 0.35, charge: [0.25, 0.6], greed: 0 },

      o.frequency.setValueAtTime(base, t0); o.frequency.exponentialRampToValueAtTime(base * 1.25, t0 + 0.15);
      o.frequency.exponentialRampToValueAtTime(base * 0.45, t0 + dur);
      lfo.frequency.value = 11; lg.gain.value = 24; lfo.connect(lg); lg.connect(o.frequency);
      f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 4;
      f2.type = 'bandpass'; f2.frequency.value = 1300; f2.Q.value = 5;
      env(g, t0, 0.03, 0.16, dur);
      o.connect(f); o.connect(f2); f.connect(g); f2.connect(g); g.connect(sfx);
      o.start(t0); lfo.start(t0); o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
    },
    splash() {
      noise(0.9, 0.7, 'lowpass', 2200, 220, { q: 0.5 });
      noise(1.4, 0.25, 'highpass', 3500, 6000, { a: 0.05 });
      for (let i = 0; i < 7; i++) tone('sine', rr(260, 520), rr(700, 1300), 0.07, 0.14, { delay: 0.12 + i * rr(0.05, 0.12) });
    },
    gong() {
      if (!ok()) return;
      [[110, 0.4], [264, 0.22], [431, 0.15], [572, 0.1], [787, 0.06]].forEach(([f, v]) => tone('sine', f, f * 0.985, 2.2, v, { a: 0.004 }));
      noise(0.3, 0.2, 'bandpass', 600, 300, { q: 1 });
    },
    taiko(v) { tone('sine', 120, 48, 0.32, v || 0.5, { glide: 0.25 }); noise(0.06, 0.18, 'lowpass', 700, 300); },
    ooh() { noise(0.9, 0.22, 'bandpass', 520, 380, { q: 2.2, a: 0.18 }); noise(0.9, 0.14, 'bandpass', 1100, 800, { q: 2.5, a: 0.2 }); },
    cheer() {
      noise(1.6, 0.26, 'bandpass', 900, 1600, { q: 1.1, a: 0.12 });
      for (let i = 0; i < 14; i++) noise(0.04, 0.12, 'highpass', 1800, 1800, { delay: rr(0, 1.2) });
    },
    bonk() { tone('triangle', 300, 520, 0.08, 0.3); tone('sine', 900, 600, 0.06, 0.15, { delay: 0.02 }); },
    tick() { tone('triangle', 1250, 1250, 0.05, 0.2); },
    go() { tone('square', 660, 660, 0.1, 0.16, { lp: 2400 }); tone('square', 990, 990, 0.22, 0.16, { delay: 0.1, lp: 2400 }); S.taiko(0.6); },
    saved() { [660, 880, 1320].forEach((f, i) => tone('triangle', f, f, 0.14, 0.2, { delay: i * 0.06 })); },
    fanfare(win) {
      const notes = win ? [523, 659, 784, 1047, 784, 1047] : [440, 415, 392, 330];
      const step = win ? 0.11 : 0.18;
      notes.forEach((f, i) => { tone('square', f, f, step * 1.6, 0.13, { delay: i * step, lp: 2600 }); tone('triangle', f / 2, f / 2, step * 1.6, 0.14, { delay: i * step }); });
      if (win) S.cheer();
    },
    unlock() { [523, 784, 1047, 1568].forEach((f, i) => tone('triangle', f, f * 1.01, 0.25, 0.2, { delay: i * 0.07 })); },
    burn() { noise(0.6, 0.18, 'highpass', 2500, 1200); },
    // ---- Halloween
    whistle() { tone('sine', 1500, 520, 0.9, 0.09, { glide: 0.9, a: 0.05 }); tone('triangle', 1520, 530, 0.9, 0.04, { glide: 0.9, a: 0.05 }); },
    pumpkinThud(p) {
      const k = clamp(p / 5, 0.2, 1);
      tone('sine', 120, 40, 0.3, 0.4 + k * 0.4, { glide: 0.25 }); noise(0.18, 0.25 + k * 0.3, 'lowpass', 700, 120);
      tone('triangle', 260, 180, 0.12, 0.18, { delay: 0.02 });
    },
    splat() { noise(0.25, 0.45, 'lowpass', 1600, 140, { q: 1.2 }); tone('sine', 300, 70, 0.2, 0.3, { glide: 0.15 }); for (let i = 0; i < 4; i++) tone('sine', rr(400, 700), rr(150, 260), 0.06, 0.1, { delay: 0.04 + i * 0.04 }); },
    stomp() { tone('sine', 220, 880, 0.18, 0.4); tone('triangle', 440, 1320, 0.14, 0.15, { delay: 0.03 }); noise(0.1, 0.2, 'bandpass', 900, 400, { q: 1 }); },
    strike() { noise(0.35, 0.4, 'bandpass', 1800, 700, { q: 1.5 }); for (let i = 0; i < 6; i++) tone('triangle', rr(500, 900), rr(300, 500), 0.07, 0.14, { delay: i * rr(0.02, 0.05) }); },
    boo() {
      if (!ok()) return;
      const t0 = T(), dur = 1.1;
      const o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = 'sine'; o.frequency.setValueAtTime(330, t0); o.frequency.linearRampToValueAtTime(420, t0 + 0.35); o.frequency.linearRampToValueAtTime(250, t0 + dur);
      lfo.frequency.value = 6; lg.gain.value = 18; lfo.connect(lg); lg.connect(o.frequency);
      f.type = 'lowpass'; f.frequency.value = 1200;
      env(g, t0, 0.15, 0.2, dur);
      o.connect(f); f.connect(g); g.connect(sfx); o.start(t0); lfo.start(t0); o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
    },
    rewind() { tone('sawtooth', 1400, 180, 0.45, 0.08, { lp: 2500, glide: 0.45 }); noise(0.45, 0.12, 'bandpass', 3000, 600, { q: 2 }); },
    chargeStart(i) {
      if (!ok()) return;
      S.chargeStop(i);
      const t0 = T();
      const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = 'triangle';
      const base = i ? 230 : 200;
      o.frequency.setValueAtTime(base, t0);
      o.frequency.exponentialRampToValueAtTime(base * 3.2, t0 + SIM.BASE.chargeT);
      f.type = 'lowpass'; f.frequency.value = 2200;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.05);
      o.connect(f); f.connect(g); g.connect(sfx);
      o.start(t0);
      charges[i] = { o, g };
    },
    chargeStop(i) {
      const c = charges[i]; if (!c || !ac) return;
      charges[i] = null;
      try { c.g.gain.setTargetAtTime(0.0001, T(), 0.02); c.o.stop(T() + 0.1); } catch (e) { /* already stopped */ }
    }
  };

  // ---- music: a bouncy taiko + pluck loop on a pentatonic scale, scheduled ahead
  const Music = (function () {
    let on = false, timer = null, next = 0, step = 0, intensity = 0, spooky = false;
    const BPM = 116, SPB = 60 / BPM / 4;
    const BRIGHT = [293.66, 329.63, 392.0, 440.0, 493.88, 587.33, 659.25, 783.99];
    const SPOOKY = [293.66, 311.13, 369.99, 392.0, 440.0, 466.16, 554.37, 587.33];   // D phrygian dominant: same tune, haunted
    let scale = BRIGHT;
    const mel = [
      [0, -1, 2, -1, 3, -1, 2, 4, -1, 3, 2, -1, 0, -1, 1, -1],
      [2, -1, 3, -1, 5, -1, 4, 3, -1, 2, 3, -1, 2, -1, -1, -1],
      [5, -1, 4, -1, 3, -1, 4, 5, -1, 6, 5, -1, 3, -1, 2, -1],
      [3, -1, 2, -1, 0, -1, 1, 2, -1, -1, 0, -1, -1, -1, -1, -1]
    ];
    const bass = [0, 0, 2, 2, 3, 3, 1, 1];
    function pluck(f, t, v) {
      const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
      o.type = 'square'; o.frequency.setValueAtTime(f * 1.012, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
      fl.type = 'lowpass'; fl.frequency.setValueAtTime(3600, t); fl.frequency.exponentialRampToValueAtTime(700, t + 0.2);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.connect(fl); fl.connect(g); g.connect(mus); o.start(t); o.stop(t + 0.36);
    }
    function drum(t, f0, f1, v, d) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d * 0.8);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(mus); o.start(t); o.stop(t + d + 0.02);
    }
    function hat(t, v) {
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      s.connect(f); f.connect(g); g.connect(mus); s.start(t, Math.random()); s.stop(t + 0.07);
    }
    function sched() {
      if (!ac || !on) return;
      while (next < ac.currentTime + 0.25) {
        if (ac.state === 'running') {
          const s16 = step % 16, bar = (step >> 4) % 4, t = next;
          if (s16 === 0 || s16 === 10) drum(t, 110, 46, 0.55, 0.3);
          if (s16 === 4 || s16 === 12) drum(t, 220, 140, 0.24, 0.12);
          if (s16 === 14 && bar === 3) drum(t, 160, 60, 0.35, 0.2);
          if (s16 % 2 === 0) hat(t, s16 % 4 === 2 ? 0.06 : 0.035);
          if (intensity > 0 && s16 % 2 === 1) hat(t, 0.03 * intensity);
          if (s16 % 4 === 0) { const b = scale[bass[(bar * 2 + (s16 >> 3)) % 8]] / 4; pluck(b, t, 0.16); }
          const n = mel[bar][s16];
          if (n >= 0) pluck(scale[n], t, 0.075);
        }
        next += SPB; step++;
      }
    }
    return {
      start() {
        if (!ac || on) return;
        on = true; next = ac.currentTime + 0.08; step = 0;
        timer = setInterval(sched, 60);
      },
      stop() { on = false; if (timer) clearInterval(timer); timer = null; },
      setIntensity(v) { intensity = v; },
      setSpooky(v) { spooky = !!v; scale = spooky ? SPOOKY : BRIGHT; },
      get on() { return on; }
    };
  })();

  return Object.assign(S, {
    unlock, Music,
    setMuted(m) { userMuted = m; apply(); },
    get muted() { return userMuted; },
    setAdMuted(m) { adMuted = m; apply(); },
    setHidden(h) { hidden = h; apply(); },
    setPaused(p) { paused = p; if (p) { S.chargeStop(0); S.chargeStop(1); } },
    ready() { return !!ac; }
  });
})();

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function mixHex(a, b, t) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(x >> 16, y >> 16, t)), g = Math.round(lerp((x >> 8) & 255, (y >> 8) & 255, t)), bl = Math.round(lerp(x & 255, y & 255, t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}

function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// smooth closed curve through points
function smoothPath(ctx, pts) {
  const n = pts.length;
  ctx.beginPath();
  let mx = (pts[n - 1][0] + pts[0][0]) / 2, my = (pts[n - 1][1] + pts[0][1]) / 2;
  ctx.moveTo(mx, my);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}

// ---------------------------------------------------------------- the blob
// o: x,y = centre of the undeformed body, r, skin, sq (squash: + flatter, - taller), axis (squash direction),
//    rot (body spin), wob (jiggle amount), t (time), flat (ground contact), slope (plank angle), mood, look [x,y],
//    blink 0..1, charge 0..1, char 0..1 (burnt), face (side the face looks toward), shake
const BLOB_N = 30;
const _pts = []; for (let i = 0; i < BLOB_N; i++) _pts.push([0, 0]);

function blobShape(o) {
  const r = o.r, sq = o.sq || 0;
  const sy = 1 - sq, sx = 1 + sq * 0.75;
  const ca = Math.cos(o.axis || 0), sa = Math.sin(o.axis || 0);
  const wob = o.wob || 0, t = o.t || 0;
  const flat = o.flat || 0, sl = o.slope || 0;
  const lineY = r * sy - r * (0.05 + 0.1 * flat);
  const tsl = Math.tan(sl);
  for (let i = 0; i < BLOB_N; i++) {
    const a = i / BLOB_N * TAU;
    const rr2 = r * (1 + wob * (0.07 * Math.sin(3 * a + t * 17) + 0.05 * Math.sin(2 * a - t * 23)));
    let px = Math.cos(a) * rr2, py = Math.sin(a) * rr2;
    // squash along the axis
    const u = px * ca + py * sa, v = -px * sa + py * ca;
    const u2 = u * sx, v2 = v * sy;
    px = u2 * ca - v2 * sa; py = u2 * sa + v2 * ca;
    // flatten the contact patch onto the plank
    if (flat > 0) { const ly = lineY + tsl * px; if (py > ly) py = lerp(py, ly, Math.min(1, flat * 1.4)); }
    _pts[i][0] = px; _pts[i][1] = py;
  }
  return { sx, sy };
}

function drawBlob(ctx, o) {
  const r = o.r, skin = o.skin || SKINS[0];
  const ch = o.char || 0;
  ctx.save();
  ctx.translate(o.x + (o.shake ? (Math.random() - 0.5) * o.shake : 0), o.y);
  const { sx, sy } = blobShape(o);
  // body
  ctx.save();
  ctx.rotate(o.rot || 0);
  if (skin.ghost && !ch) {
    // a ghost has a wispy tail and glows a little
    const t = o.t || 0, sw = Math.sin(t * 5) * r * 0.12;
    ctx.save(); ctx.globalAlpha = 0.75;
    ctx.fillStyle = skin.light; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, r * 0.1);
    ctx.beginPath(); ctx.moveTo(-r * 0.55, r * 0.35);
    ctx.quadraticCurveTo(-r * 1.15 + sw, r * 0.55, -r * 1.35 - sw, r * 0.05);
    ctx.quadraticCurveTo(-r * 1.05, r * 0.85, -r * 0.2, r * 0.75); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 0.9;
  }
  smoothPath(ctx, _pts);
  const body = ch > 0 ? mixHex(skin.body, '#2b2230', ch) : skin.body;
  const dark = ch > 0 ? mixHex(skin.dark, '#16101c', ch) : skin.dark;
  const light = ch > 0 ? mixHex(skin.light, '#4a3d50', ch) : skin.light;
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.1, -r * 0.1, -r * 0.05, r * 1.35);
  g.addColorStop(0, light); g.addColorStop(0.45, body); g.addColorStop(1, dark);
  ctx.fillStyle = g; ctx.fill();
  ctx.save();
  ctx.clip();
  // underside shade
  ctx.fillStyle = hexA('#2a1238', 0.18);
  ctx.beginPath(); ctx.ellipse(r * 0.15, r * 0.95 * sy, r * 1.25, r * 0.55, 0, 0, TAU); ctx.fill();
  if (skin.acc === 'pumpkin') {
    // pumpkin ribs
    ctx.strokeStyle = ch > 0 ? 'rgba(20,10,20,.35)' : 'rgba(170,60,0,.45)'; ctx.lineWidth = r * 0.07;
    for (const k of [-0.62, -0.25, 0.25, 0.62]) { ctx.beginPath(); ctx.ellipse(0, 0, Math.abs(k) * r * sx, r * 1.05 * sy, 0, k < 0 ? Math.PI * 0.5 : -Math.PI * 0.5, k < 0 ? Math.PI * 1.5 : Math.PI * 0.5); ctx.stroke(); }
  }
  // mawashi (sumo belt) wrapping the lower body
  if (!o.noBelt) {
    ctx.strokeStyle = ch > 0 ? '#1a1320' : skin.belt;
    ctx.lineWidth = r * 0.26 * sy;
    ctx.beginPath(); ctx.ellipse(0, r * 0.1 * sy, r * 1.08 * sx, r * 0.47 * sy, 0, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.fillStyle = ch > 0 ? '#1a1320' : skin.belt;
    const fx = (o.look ? o.look[0] : 0) * r * 0.12;
    ctx.beginPath();
    ctx.moveTo(fx - r * 0.16, r * 0.5 * sy); ctx.lineTo(fx + r * 0.16, r * 0.5 * sy);
    ctx.lineTo(fx + r * 0.12, r * 0.95 * sy); ctx.lineTo(fx - r * 0.12, r * 0.95 * sy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = r * 0.05;
    ctx.beginPath(); ctx.ellipse(0, r * 0.03 * sy, r * 1.08 * sx, r * 0.47 * sy, 0, 0.18 * Math.PI, 0.82 * Math.PI); ctx.stroke();
  }
  // gloss
  ctx.fillStyle = 'rgba(255,255,255,' + (0.42 * (1 - ch)) + ')';
  ctx.beginPath(); ctx.ellipse(-r * 0.4 * sx, -r * 0.52 * sy, r * 0.3, r * 0.16, -0.65, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-r * 0.12 * sx, -r * 0.74 * sy, r * 0.06, 0, TAU); ctx.fill();
  ctx.restore();
  smoothPath(ctx, _pts);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2.2, r * 0.12); ctx.stroke();
  ctx.globalAlpha = 1;
  // accessory (behind the face, on top of the head)
  drawAcc(ctx, o, sx, sy, ch);
  drawFace(ctx, o, sx, sy);
  if (skin.acc === 'shades' && o.mood !== 'ko' && o.mood !== 'win') drawShades(ctx, o, sx, sy);
  ctx.restore();
  ctx.restore();
}

function drawFace(ctx, o, sx, sy) {
  const r = o.r, mood = o.mood || 'idle';
  const lk = o.look || [0, 0];
  const fx = lk[0] * r * 0.16, fy = -r * 0.12 * sy + lk[1] * r * 0.05;
  const ex = r * 0.3 * sx, ey = fy - r * 0.08 * sy;
  const er = r * 0.2, ery = r * 0.23 * sy;
  ctx.save();
  ctx.translate(fx, 0);
  const lw = Math.max(1.8, r * 0.09);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // cheeks
  if (mood !== 'ko') {
    ctx.fillStyle = 'rgba(255,90,120,.35)';
    ctx.beginPath(); ctx.ellipse(-r * 0.5 * sx, fy + r * 0.2 * sy, r * 0.13, r * 0.08, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.5 * sx, fy + r * 0.2 * sy, r * 0.13, r * 0.08, 0, 0, TAU); ctx.fill();
  }
  const blink = o.blink || 0;
  const eye = (side) => {
    const x = side * ex;
    if (mood === 'win') {
      ctx.strokeStyle = INK; ctx.lineWidth = lw * 1.1;
      ctx.beginPath(); ctx.arc(x, ey + er * 0.4, er * 0.75, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      return;
    }
    if (mood === 'ko') {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = lw;
      const s = er * 0.6;
      ctx.beginPath(); ctx.moveTo(x - s, ey - s); ctx.lineTo(x + s, ey + s); ctx.moveTo(x + s, ey - s); ctx.lineTo(x - s, ey + s); ctx.stroke();
      return;
    }
    let h = ery, w = er;
    if (mood === 'charge' || mood === 'pound') h *= 0.62;
    if (mood === 'fly' || mood === 'teeter') { h *= 1.25; w *= 1.18; }
    h *= (1 - blink * 0.9);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.75;
    ctx.beginPath(); ctx.ellipse(x, ey, w, Math.max(0.6, h), 0, 0, TAU); ctx.fill(); ctx.stroke();
    if (blink > 0.7) return;
    let pr = er * (mood === 'fly' ? 0.34 : 0.52);
    const px = x + lk[0] * w * 0.42, py = ey + lk[1] * h * 0.42 + (mood === 'pound' || mood === 'teeter' ? h * 0.3 : 0);
    ctx.save(); ctx.beginPath(); ctx.ellipse(x, ey, w, Math.max(0.6, h), 0, 0, TAU); ctx.clip();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px - pr * 0.35, py - pr * 0.4, pr * 0.32, 0, TAU); ctx.fill();
    ctx.restore();
  };
  eye(-1); eye(1);
  // brows
  ctx.strokeStyle = INK; ctx.lineWidth = lw * 1.15;
  const by = ey - ery - r * 0.06;
  const brow = (side, inner, outer) => {
    ctx.beginPath(); ctx.moveTo(side * (ex - er * 0.9), by + outer); ctx.lineTo(side * (ex + er * 0.2) * 0.35, by + inner); ctx.stroke();
  };
  if (mood === 'charge' || mood === 'pound' || mood === 'slam') { brow(-1, r * 0.1, -r * 0.06); brow(1, r * 0.1, -r * 0.06); }
  else if (mood === 'teeter' || mood === 'sad') { brow(-1, -r * 0.1, r * 0.03); brow(1, -r * 0.1, r * 0.03); }
  else if (mood === 'fly') { brow(-1, -r * 0.14, -r * 0.1); brow(1, -r * 0.14, -r * 0.1); }
  else if (mood === 'smug') { brow(-1, r * 0.02, -r * 0.08); brow(1, -r * 0.06, -r * 0.02); }
  // mouth
  const my = fy + r * 0.3 * sy;
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = lw;
  switch (mood) {
    case 'charge': {
      const w = r * 0.34, h = r * 0.15;
      ctx.fillStyle = '#fff'; rrect(ctx, -w / 2, my - h / 2, w, h, h * 0.3); ctx.fill(); ctx.stroke();
      ctx.lineWidth = lw * 0.5; ctx.beginPath();
      for (let k = 1; k < 4; k++) { ctx.moveTo(-w / 2 + w * k / 4, my - h / 2); ctx.lineTo(-w / 2 + w * k / 4, my + h / 2); }
      ctx.moveTo(-w / 2, my); ctx.lineTo(w / 2, my); ctx.stroke();
      break;
    }
    case 'slam': {
      // the big toothy "gotcha" grin
      const w2 = r * 0.66, d2 = r * 0.46, y0 = my - r * 0.1;
      const grin = () => { ctx.beginPath(); ctx.moveTo(-w2 / 2, y0); ctx.quadraticCurveTo(0, y0 - r * 0.05, w2 / 2, y0); ctx.quadraticCurveTo(w2 * 0.35, y0 + d2, 0, y0 + d2 * 0.82); ctx.quadraticCurveTo(-w2 * 0.35, y0 + d2, -w2 / 2, y0); ctx.closePath(); };
      grin(); ctx.fillStyle = INK; ctx.fill();
      ctx.save(); grin(); ctx.clip();
      ctx.fillStyle = '#fff'; ctx.fillRect(-w2 / 2, y0 - r * 0.06, w2, r * 0.15);
      ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.45;
      for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * w2 / 6, y0 - r * 0.06); ctx.lineTo(k * w2 / 6, y0 + r * 0.09); ctx.stroke(); }
      ctx.fillStyle = '#ff6b81'; ctx.beginPath(); ctx.ellipse(0, y0 + d2 * 0.72, r * 0.16, r * 0.09, 0, 0, TAU); ctx.fill();
      ctx.restore();
      grin(); ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
      break;
    }
    case 'pound': {
      ctx.beginPath(); ctx.moveTo(-r * 0.18, my + r * 0.04); ctx.quadraticCurveTo(0, my - r * 0.08, r * 0.18, my + r * 0.04); ctx.stroke();
      break;
    }
    case 'air': case 'win': {
      ctx.beginPath(); ctx.moveTo(-r * 0.22, my - r * 0.04); ctx.quadraticCurveTo(0, my + r * 0.3, r * 0.22, my - r * 0.04); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff6b81'; ctx.beginPath(); ctx.ellipse(0, my + r * 0.1, r * 0.09, r * 0.05, 0, 0, TAU); ctx.fill();
      break;
    }
    case 'fly': {
      ctx.beginPath(); ctx.ellipse(0, my + r * 0.04, r * 0.15, r * 0.2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff6b81'; ctx.beginPath(); ctx.ellipse(0, my + r * 0.15, r * 0.09, r * 0.06, 0, 0, TAU); ctx.fill();
      break;
    }
    case 'teeter': case 'sad': {
      ctx.beginPath();
      if (mood === 'teeter') { ctx.moveTo(-r * 0.2, my); for (let k = 1; k <= 4; k++) ctx.lineTo(-r * 0.2 + k * r * 0.1, my + (k % 2 ? -1 : 1) * r * 0.05); }
      else { ctx.moveTo(-r * 0.17, my + r * 0.06); ctx.quadraticCurveTo(0, my - r * 0.08, r * 0.17, my + r * 0.06); }
      ctx.stroke();
      break;
    }
    case 'ko': {
      ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-r * 0.14, my); ctx.quadraticCurveTo(0, my - r * 0.07, r * 0.14, my); ctx.stroke();
      break;
    }
    case 'smug': {
      ctx.beginPath(); ctx.moveTo(-r * 0.18, my); ctx.quadraticCurveTo(r * 0.02, my + r * 0.14, r * 0.22, my - r * 0.06); ctx.stroke();
      break;
    }
    default: {
      ctx.beginPath(); ctx.moveTo(-r * 0.16, my); ctx.quadraticCurveTo(0, my + r * 0.12, r * 0.16, my); ctx.stroke();
    }
  }
  // sweat drop when in trouble
  if (mood === 'teeter' || (mood === 'fly' && o.sweat)) {
    ctx.fillStyle = '#9fe6ff'; ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.6;
    const sx2 = (o.look && o.look[0] < 0 ? 1 : -1) * r * 0.62, sy2 = ey - r * 0.25;
    ctx.beginPath(); ctx.moveTo(sx2, sy2 - r * 0.2); ctx.quadraticCurveTo(sx2 + r * 0.13, sy2, sx2, sy2 + r * 0.07); ctx.quadraticCurveTo(sx2 - r * 0.13, sy2, sx2, sy2 - r * 0.2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawAcc(ctx, o, sx, sy, ch) {
  const r = o.r, skin = o.skin, acc = skin.acc;
  const topY = -r * sy;
  const lw = Math.max(2, r * 0.1);
  const t = o.t || 0;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = lw;
  const dim = c => ch > 0 ? mixHex(c, '#1a1320', ch * 0.8) : c;
  const sway = (o.sway || 0);
  switch (acc) {
    case 'topknot': {
      // oicho-mage: the sumo ginkgo-leaf topknot
      ctx.save(); ctx.translate(0, topY + r * 0.1); ctx.rotate(sway * 0.5);
      ctx.fillStyle = dim('#2a1238'); ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.6;
      ctx.beginPath(); ctx.ellipse(0, -r * 0.06, r * 0.24, r * 0.13, 0, 0, TAU); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-r * 0.07, -r * 0.12);
      ctx.quadraticCurveTo(-r * 0.36, -r * 0.2, -r * 0.4, -r * 0.42);
      ctx.quadraticCurveTo(-r * 0.2, -r * 0.5, 0, -r * 0.44);
      ctx.quadraticCurveTo(r * 0.2, -r * 0.5, r * 0.4, -r * 0.42);
      ctx.quadraticCurveTo(r * 0.36, -r * 0.2, r * 0.07, -r * 0.12);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = r * 0.035;
      ctx.beginPath(); ctx.moveTo(-r * 0.04, -r * 0.16); ctx.quadraticCurveTo(-r * 0.2, -r * 0.28, -r * 0.26, -r * 0.4); ctx.stroke();
      ctx.fillStyle = dim('#fff6e8'); rrect(ctx, -r * 0.08, -r * 0.18, r * 0.16, r * 0.07, r * 0.03); ctx.fill();
      ctx.restore();
      break;
    }
    case 'cat': {
      ctx.fillStyle = dim(skin.body);
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * r * 0.62, topY + r * 0.45); ctx.lineTo(s * r * 0.52, topY - r * 0.28 + sway * s * r * 0.2); ctx.lineTo(s * r * 0.12, topY + r * 0.12); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = dim('#ffc2dd'); ctx.beginPath(); ctx.moveTo(s * r * 0.52, topY + r * 0.3); ctx.lineTo(s * r * 0.48, topY - r * 0.08); ctx.lineTo(s * r * 0.26, topY + r * 0.16); ctx.closePath(); ctx.fill();
        ctx.fillStyle = dim(skin.body);
      }
      break;
    }
    case 'frog': {
      for (const s of [-1, 1]) {
        ctx.fillStyle = dim(skin.body);
        ctx.beginPath(); ctx.arc(s * r * 0.42, topY + r * 0.12, r * 0.25, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * r * 0.42, topY + r * 0.1, r * 0.14, 0, TAU); ctx.fill();
        ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(s * r * 0.42 + (o.look ? o.look[0] : 0) * r * 0.05, topY + r * 0.1, r * 0.07, 0, TAU); ctx.fill();
      }
      break;
    }
    case 'ninja': {
      ctx.fillStyle = dim('#2a1238');
      ctx.save(); ctx.beginPath(); ctx.rect(-r * 1.2, topY + r * 0.22, r * 2.4, r * 0.24); ctx.clip();
      smoothPath(ctx, _pts); ctx.fill(); ctx.restore();
      ctx.fillStyle = dim('#c0c6d8'); rrect(ctx, -r * 0.13, topY + r * 0.24, r * 0.26, r * 0.19, r * 0.04); ctx.fill();
      ctx.strokeStyle = dim('#2a1238'); ctx.lineWidth = r * 0.1;
      const bx = -(o.look && o.look[0] < 0 ? -1 : 1) * r * 0.86;
      ctx.beginPath(); ctx.moveTo(bx * 0.95, topY + r * 0.34); ctx.quadraticCurveTo(bx * 1.3, topY + r * 0.2 + Math.sin(t * 9) * r * 0.1, bx * 1.55, topY + r * 0.4 + Math.sin(t * 9 + 1) * r * 0.14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx * 0.95, topY + r * 0.38); ctx.quadraticCurveTo(bx * 1.25, topY + r * 0.55 + Math.sin(t * 8 + 2) * r * 0.1, bx * 1.45, topY + r * 0.62 + Math.sin(t * 8 + 3) * r * 0.12); ctx.stroke();
      break;
    }
    case 'viking': {
      ctx.fillStyle = dim('#f3ecd9');
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * r * 0.5, topY + r * 0.3); ctx.quadraticCurveTo(s * r * 1.05, topY + r * 0.1, s * r * 0.98, topY - r * 0.45); ctx.quadraticCurveTo(s * r * 0.82, topY - r * 0.02, s * r * 0.4, topY + r * 0.08); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = dim('#a7b0c4');
      ctx.beginPath(); ctx.ellipse(0, topY + r * 0.36, r * 0.66, r * 0.48, 0, Math.PI, TAU); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = dim('#ffd23f'); rrect(ctx, -r * 0.7, topY + r * 0.26, r * 1.4, r * 0.16, r * 0.06); ctx.fill(); ctx.stroke();
      break;
    }
    case 'chef': {
      ctx.fillStyle = dim('#ffffff');
      rrect(ctx, -r * 0.42, topY - r * 0.12, r * 0.84, r * 0.34, r * 0.06); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.arc(-r * 0.3, topY - r * 0.28, r * 0.24, 0, TAU); ctx.arc(r * 0.3, topY - r * 0.28, r * 0.24, 0, TAU); ctx.arc(0, topY - r * 0.46, r * 0.3, 0, TAU);
      ctx.fill();
      ctx.beginPath(); ctx.arc(-r * 0.3, topY - r * 0.28, r * 0.24, Math.PI * 0.55, Math.PI * 1.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 0.3, topY - r * 0.28, r * 0.24, Math.PI * 1.4, Math.PI * 0.45); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, topY - r * 0.46, r * 0.3, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      break;
    }
    case 'shades': break; // drawn over the eyes in drawFaceExtras
    case 'alien': {
      for (const s of [-1, 1]) {
        const tx = s * r * 0.55 + Math.sin(t * 6 + s) * r * 0.06, ty = topY - r * 0.48;
        ctx.beginPath(); ctx.moveTo(s * r * 0.25, topY + r * 0.1); ctx.quadraticCurveTo(s * r * 0.3, topY - r * 0.3, tx, ty); ctx.stroke();
        ctx.fillStyle = dim('#ff4bd8'); ctx.beginPath(); ctx.arc(tx, ty, r * 0.13, 0, TAU); ctx.fill(); ctx.stroke();
      }
      break;
    }
    case 'party': {
      ctx.save(); ctx.translate(r * 0.08, topY + r * 0.1); ctx.rotate(0.18 + sway * 0.5);
      ctx.fillStyle = dim('#3d8bff');
      ctx.beginPath(); ctx.moveTo(-r * 0.34, 0); ctx.lineTo(0, -r * 0.82); ctx.lineTo(r * 0.34, 0); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.clip(); ctx.fillStyle = dim('#ff4b5c');
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-r, -r * 0.18 * k * 1.25); ctx.lineTo(r, -r * 0.18 * k * 1.25 - r * 0.3); ctx.lineTo(r, -r * 0.18 * k * 1.25 - r * 0.2); ctx.lineTo(-r, -r * 0.18 * k * 1.25 + r * 0.1); ctx.fill(); }
      ctx.restore();
      ctx.beginPath(); ctx.moveTo(-r * 0.34, 0); ctx.lineTo(0, -r * 0.82); ctx.lineTo(r * 0.34, 0); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = dim('#ffd23f'); ctx.beginPath(); ctx.arc(0, -r * 0.86, r * 0.12, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'bunny': {
      for (const s of [-1, 1]) {
        ctx.save(); ctx.translate(s * r * 0.3, topY + r * 0.15); ctx.rotate(s * (0.2 + sway * 0.6) + Math.sin(t * 4 + s) * 0.05);
        ctx.fillStyle = dim(skin.body); ctx.beginPath(); ctx.ellipse(0, -r * 0.45, r * 0.17, r * 0.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = dim('#ffc2dd'); ctx.beginPath(); ctx.ellipse(0, -r * 0.45, r * 0.08, r * 0.36, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      break;
    }
    case 'pumpkin': {
      // curly stem and a leaf
      ctx.save(); ctx.translate(0, topY + r * 0.08); ctx.rotate(sway * 0.5);
      ctx.fillStyle = dim('#5d8a2a'); ctx.lineWidth = lw * 0.8;
      ctx.beginPath(); ctx.moveTo(-r * 0.1, r * 0.05); ctx.quadraticCurveTo(-r * 0.12, -r * 0.3, r * 0.05, -r * 0.42); ctx.lineTo(r * 0.16, -r * 0.33); ctx.quadraticCurveTo(r * 0.04, -r * 0.2, r * 0.1, r * 0.05); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = dim('#7cc443');
      ctx.beginPath(); ctx.moveTo(r * 0.08, -r * 0.12); ctx.quadraticCurveTo(r * 0.45, -r * 0.42, r * 0.62, -r * 0.12); ctx.quadraticCurveTo(r * 0.35, r * 0.02, r * 0.08, -r * 0.12); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = dim('#5d8a2a'); ctx.lineWidth = lw * 0.7;
      ctx.beginPath(); ctx.moveTo(-r * 0.12, -r * 0.1); ctx.bezierCurveTo(-r * 0.5, -r * 0.2, -r * 0.45, -r * 0.5, -r * 0.28, -r * 0.42); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'witch': {
      // big floppy witch hat with an orange band and a buckle
      ctx.save(); ctx.translate(r * 0.04, topY + r * 0.22); ctx.rotate(-0.08 + sway * 0.4);
      ctx.fillStyle = dim('#2a1238'); ctx.lineWidth = lw * 0.9;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.95, r * 0.2, 0, 0, TAU); ctx.fill(); ctx.stroke();
      const tip = Math.sin(t * 3) * r * 0.06;
      ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.04); ctx.quadraticCurveTo(-r * 0.3, -r * 0.7, r * 0.05, -r * 1.05);
      ctx.quadraticCurveTo(r * 0.45 + tip, -r * 1.25, r * 0.62 + tip, -r * 0.9); ctx.quadraticCurveTo(r * 0.3, -r * 0.85, r * 0.5, -r * 0.04); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = dim('#ff8a1f'); ctx.beginPath(); ctx.moveTo(-r * 0.47, -r * 0.1); ctx.quadraticCurveTo(0, -r * 0.2, r * 0.48, -r * 0.1); ctx.lineTo(r * 0.44, -r * 0.3); ctx.quadraticCurveTo(0, -r * 0.4, -r * 0.42, -r * 0.3); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = dim('#ffd23f'); ctx.lineWidth = r * 0.05; rrect(ctx, -r * 0.1, -r * 0.31, r * 0.2, r * 0.18, r * 0.03); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'ghost': {
      // a tiny ghost topknot and a floating glow ring
      ctx.save(); ctx.translate(0, topY + r * 0.05);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = lw * 0.7;
      ctx.beginPath(); ctx.moveTo(-r * 0.14, r * 0.06); ctx.quadraticCurveTo(-r * 0.2, -r * 0.26, 0, -r * 0.3); ctx.quadraticCurveTo(r * 0.24, -r * 0.34, r * 0.16, -r * 0.46 + Math.sin(t * 6) * r * 0.04); ctx.quadraticCurveTo(r * 0.34, -r * 0.2, r * 0.14, r * 0.06); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'crown': {
      ctx.save(); ctx.translate(0, topY + r * 0.16); ctx.rotate(sway * 0.4);
      ctx.fillStyle = dim('#ffd23f');
      ctx.beginPath(); ctx.moveTo(-r * 0.5, 0); ctx.lineTo(-r * 0.55, -r * 0.5); ctx.lineTo(-r * 0.26, -r * 0.26); ctx.lineTo(0, -r * 0.62); ctx.lineTo(r * 0.26, -r * 0.26); ctx.lineTo(r * 0.55, -r * 0.5); ctx.lineTo(r * 0.5, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = dim('#ff4b5c'); ctx.beginPath(); ctx.arc(0, -r * 0.16, r * 0.09, 0, TAU); ctx.fill();
      ctx.fillStyle = dim('#3d8bff'); ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.12, r * 0.06, 0, TAU); ctx.arc(r * 0.3, -r * 0.12, r * 0.06, 0, TAU); ctx.fill();
      ctx.restore();
      break;
    }
  }
  ctx.restore();
}

// sunglasses sit over the eyes, so they draw after the face
function drawShades(ctx, o, sx, sy) {
  const r = o.r, lk = o.look || [0, 0];
  const fx = lk[0] * r * 0.16, ey = -r * 0.12 * sy + lk[1] * r * 0.05 - r * 0.08 * sy;
  ctx.save(); ctx.translate(fx, 0);
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, r * 0.08);
  for (const s of [-1, 1]) { rrect(ctx, s * r * 0.3 - r * 0.25, ey - r * 0.15, r * 0.5, r * 0.3, r * 0.1); ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(-r * 0.06, ey - r * 0.05); ctx.lineTo(r * 0.06, ey - r * 0.05); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * r * 0.3 - r * 0.15, ey - r * 0.1); ctx.lineTo(s * r * 0.3 - r * 0.05, ey - r * 0.1); ctx.lineTo(s * r * 0.3 - r * 0.17, ey + r * 0.08); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}


// a quick standalone portrait (HUD, skins grid, results)
function paintPortrait(cv, skin, mood, look, opts) {
  const ctx = cv.getContext('2d');
