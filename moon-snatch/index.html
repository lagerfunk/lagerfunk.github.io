// ---------------------------------------------------------------- main loop
let lastFrame = 0, acc = 0, fpsWin = [], qualT = 0, hudT = 0;
function stepGame(dt) {
  // hit-stop freezes the simulation for a few frames (render continues)
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  if (G.slowT > 0) { G.slowT -= dt; dt *= 0.3; }
  update(dt);
}
function frameLogic(realDt) {
  if (!G.paused && !G.ad && G.state !== 'boot') {
    acc += Math.min(realDt, 0.1);
    let n = 0;
    while (acc >= STEP && n < 4) { stepGame(STEP); acc -= STEP; n++; }
    if (n === 4) acc = 0;
  }
  const dt = Math.min(realDt, 0.05);
  // camera
  const follow = (G.state === 'dead' && G.killer && G.killer.alive) ? G.killer : player;
  const tz = targetZoom() * (G.state === 'end' ? 1.12 : 1);
  cam.z += (tz - cam.z) * Math.min(1, dt * 3);
  const tx = follow.x + follow.vx * 0.12, ty = follow.y + follow.vy * 0.12;
  cam.x += (tx - cam.x) * Math.min(1, dt * 9); cam.y += (ty - cam.y) * Math.min(1, dt * 9);
  G.trauma = Math.max(0, G.trauma - dt * 1.6);
  const sh = G.trauma * G.trauma * 16;
  cam.sx = sh ? (Math.sin(G.t * 71) + Math.sin(G.t * 37) * 0.5) * sh : 0;
  cam.sy = sh ? (Math.cos(G.t * 63) + Math.sin(G.t * 29) * 0.5) * sh : 0;
  updateReticle();
  tutorialTick(dt);
  // state timers
  const uiDt = Math.min(realDt, 0.25);   // overlays follow real time, even on a slow device
  if (G.state === 'dead' && !G.paused && !G.ad) { G.koT += uiDt; if (G.koT > 1.0 && !G.koShown) showKO(); }
  if (G.state === 'end' && !G.paused) { G.endT += uiDt; if (G.endT > 1.8) showResults(); }
  // HUD
  hudT -= dt;
  if (hudT <= 0 && G.state !== 'boot') {
    hudT = 0.5;
    const tt = fmtTime(W.left);
    if (tt !== G.timerText) { G.timerText = tt; $('timer').textContent = tt; }
    updateBoard();
  }
  setScore(player.alive ? player.moons.length : 0);
  if (player.alive) { trackPeak(); }
}
function trackPeak() { const d = Profile.dailyDef(); if (d.stat === 'peak' && !Profile.d.daily.done && player.moons.length > Profile.d.daily.prog) trackDaily('peak', player.moons.length); }

// Adaptive render scale: checked once per second of play. Steps down quickly when frames run long,
// steps quality back up when there is sustained headroom. Render scale never drops below 1.
// 1.1: a level is over budget when the mean fps sags below 55, OR more than 1 frame in 10 misses a vsync,
// OR the game's own frame work averages over 10 ms. The old rule (mean fps under 52) let a 4x slower phone
// sit at the top level at 55 fps with every third frame late.
let goodT = 0, winT = 0;
function adaptQuality(realDt) {
  if (G.state !== 'play' && G.state !== 'dead') { fpsWin.length = 0; winT = 0; return; }
  fpsWin.push(realDt); winT += realDt;
  if (winT < 1 || fpsWin.length < 10) return;
  let late = 0; for (const d of fpsWin) if (d > 0.0205) late++;
  const fps = fpsWin.length / winT, lateShare = late / fpsWin.length; fpsWin.length = 0; winT = 0;   // missed frames count
  G.lateShare = lateShare;
  if (fps < 55 || lateShare > 0.1 || G.cpu > 10) {
    goodT = 0;
    if (++qualT >= 2) {
      qualT = 0;
      if (dpr > 1.25) { dprCap = Math.max(1.25, dpr - 0.25); resize(); }
      else if (G.quality > 1) G.quality--;
      else if (dpr > 1) { dprCap = 1; resize(); }
      else if (G.quality > 0) G.quality--;
    }
  } else {
    qualT = 0;
    if (fps > 58.5 && lateShare < 0.03 && G.cpu < 6 && G.quality < 2 && ++goodT >= 10) { goodT = 0; G.quality++; }
  }
}

function frame(now) {
  if (!CAPTURE) requestAnimationFrame(frame);
  const realDt = lastFrame ? (now - lastFrame) / 1000 : STEP;
  lastFrame = now;
  if (realDt > 0) G.fps += (1 / Math.max(realDt, 0.001) - G.fps) * 0.05;
  const t0 = performance.now();
  frameLogic(realDt);
  render();
  if (window.__flushProbe) { ctx.getImageData(0, 0, 1, 1); (window.__work || (window.__work = [])).push(performance.now() - t0); }
  G.cpu += (performance.now() - t0 - G.cpu) * 0.05;
  if (!CAPTURE && !PIN && !G.paused && !document.hidden) adaptQuality(realDt);
}

// ---------------------------------------------------------------- test and capture hooks
window.__ms = {
  stats() {
    return {
      state: G.state, paused: G.paused, ad: G.ad, time: +W.time.toFixed(2), left: +W.left.toFixed(2), fps: Math.round(G.fps), cpuMs: +G.cpu.toFixed(2), dpr, quality: G.quality,
      planets: W.planets.filter(p => p.alive).length, loose: W.loose.length, projs: W.projs.length, parts: W.parts.length, totalMoons: totalMoons(),
      moons: player ? player.moons.length : 0, alive: player ? player.alive : false, rank: player ? player.rank : 0, kos: player ? player.kos : 0,
      hits: player ? player.hits : 0, snatched: player ? player.snatched : 0, golden: player ? player.golden : 0, peak: player ? player.peak : 0, deaths: player ? player.deaths : 0,
      top: G.ranked.slice(0, 5).map(p => [p.name, p.alive ? p.moons.length : 0]), coins: Profile.d.coins, rounds: Profile.d.rounds,
      overlay: ['koOv', 'resOv', 'shop', 'pause'].filter(id => !$(id).classList.contains('hidden')), sdk: Ads.kind, adLog: Ads.log.slice(), game: Object.assign({}, G.stats),
      nFlings: W.nFlings, nHits: W.nHits, sizes: W.planets.map(p => p.alive ? p.moons.length : 0).sort((a, b) => b - a).join(','),
      botKOs: W.planets.reduce((s, p) => s + (p.bot ? p.kos : 0), 0), maxBot: Math.max(...W.planets.filter(p => p.bot).map(p => p.moons.length)),
      event: EVENT.id, pumpkinsLoose: W.loose.filter(L => L.c === PK).length, pumpkinsHeld: W.planets.reduce((s, p) => s + (p.alive ? p.pkN || 0 : 0), 0), playerPk: player ? player.pkN || 0 : 0,
      bombs: W.nBombs || 0, pBombs: W.pBombs || 0, ev: Object.assign({}, Profile.d.ev), skins: Profile.d.skins.slice(), trails: Profile.d.trails.slice(),
      shopSkins: A.SKINS.filter(s => !s.event || s.event === EVENT.id || Profile.d.skins.includes(s.id)).map(s => s.id),
      shopTrails: A.TRAILS.filter(s => !s.event || s.event === EVENT.id || Profile.d.trails.includes(s.id)).map(s => s.id)
    };
  },
  view() {
    if (!player) return null;
    const ps = toScreen(player.x, player.y);
    let nm = null, nd = 1e9;
    for (const L of W.loose) { if (L.lock > 0) continue; const d = Math.hypot(L.x - player.x, L.y - player.y) / (1 + 0.3 * grid[gcell(L.x, L.y)]); if (d < nd) { nd = d; nm = L; } }
    const rt = G.reticle;
    let threat = null;
    for (const p of W.planets) if (p !== player && p.alive && p.moons.length > player.moons.length + 6 && Math.hypot(p.x - player.x, p.y - player.y) < 300) threat = p;
    const sc = o => o ? Object.assign(toScreen(o.x, o.y), { moons: o.moons ? o.moons.length : 0, r: o.r ? o.r * cam.z : 0 }) : null;
    const big = W.planets.filter(p => p !== player && p.alive && p.moons.length > player.moons.length + 8).sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y))[0];
    return { player: sc(player), moon: sc(nm), target: sc(rt), threat: sc(threat), big: big && Math.hypot(big.x - player.x, big.y - player.y) < 600 ? sc(big) : null,
      golden: W.golden ? toScreen(W.golden.x, W.golden.y) : null, vw, vh, state: G.state, moons: player.moons.length, alive: player.alive };
  },
  toScreen, forceEnd() { if (G.state === 'play' || G.state === 'dead') { W.time = ROUND_TIME; } },
  forceKO() { if (player && player.alive) { const att = W.planets.find(p => p.bot && p.alive && p !== player); player.moons.length = 0; layout(player); ko(player, att, 1, 0); } },
  autopilot(on, greed) { G.autopilot = !!on; if (on && !player.bot) { player.bot = makeBrain(0.95, 'hunter'); if (greed) player.bot.greed = greed; } if (!on) player.bot = null; },
  frames(n, dtMs) { const d = dtMs || 1000 / 60; for (let i = 0; i < n; i++) { frame((lastFrame || 0) + d); if (CAPTURE) capAdvance(d); } },
  sim(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n && G.state !== 'results'; i++) { stepGame(STEP); buildGrid(); if (G.state === 'end') { G.endT += STEP; if (G.endT > 1.8) { rankPlanets(); break; } } if (i % 15 === 0) rankPlanets(); } return this.stats(); },
  resetProfile() { Store.set('profile', null); Profile.load(); },
  setCoins(n) { Profile.d.coins = n; Profile.save(); },
  quality(q) { G.quality = q; },
  // capture and tests: hand the player a pumpkin (Halloween only), so the next fling is a bomb
  givePumpkin() { if (EVENT.on && player && player.alive) { G.pkTold = true; addMoon(player, PK, player.x, player.y - 40); } return player ? player.pkN : 0; },
  start() { if (G.state === 'ready') { startPlay(); G.tutStage = 1; hideHint(); } }
};

// ---------------------------------------------------------------- boot
function boot() {
  if (CLEAN) for (const id of ['hud', 'banner', 'hint', 'toast']) $(id).style.display = 'none';
  const st = Ads.storage(); if (st) Store.use(st);
  Profile.load();
  G.tutStage = Profile.d.tut >= 2 ? 3 : 0;
  if (PIN) G.quality = PIN[1];
  setMuted(!!Profile.d.muted);
  buildSprites();
  resize();
  newRound();
  G.state = 'ready';
  showHint('drag');
  if (CAPTURE) { lastFrame = 1; frame(1 + 1000 / 60); }
  else requestAnimationFrame(t => { lastFrame = t; frame(t); });
  Ads.loadingFinished();
}
const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.all([document.fonts.load('700 30px Fredoka'), document.fonts.load('30px "Lilita One"')]).catch(() => {}) : Promise.resolve();
Promise.all([Ads.init(), Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))])]).then(boot, boot);
})();
</script>
