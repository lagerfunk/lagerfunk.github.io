:root{--ink:#2a1458;--violet:#5b3ae6;--yellow:#ffd23f;--pink:#ff5fa8;--cyan:#4ee6ff;--lime:#8dff6a;--paper:#fff;--hud:1;--ui:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--violet);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Fredoka',system-ui,sans-serif;font-weight:500;color:#fff}
canvas#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
/* background layers move on the compositor (GPU on phones), not on the game thread */
#bgFar,#bgGrid{position:fixed;left:0;top:0;pointer-events:none;will-change:transform;transform-origin:0 0}
#bgFar{background-color:#5b3ae6;background-repeat:repeat}
#bgGrid{background-repeat:repeat}
/* Halloween: a harvest moon and a warm glow, static layers under the canvas (composited once) */
#bgMoon{position:fixed;right:-5vmin;top:9vh;width:40vmin;height:40vmin;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 30% 34%,rgba(214,170,110,.32) 0 9%,transparent 10%),radial-gradient(circle at 64% 62%,rgba(214,170,110,.3) 0 7%,transparent 8%),
  radial-gradient(circle at 55% 26%,rgba(214,170,110,.28) 0 5%,transparent 6%),radial-gradient(circle at 38% 70%,rgba(214,170,110,.25) 0 6%,transparent 7%),#fff3cf;
  box-shadow:0 0 60px 18px rgba(255,214,140,.55),0 0 160px 60px rgba(255,140,60,.28);opacity:.92}
#bgGlow{position:fixed;left:0;right:0;bottom:0;height:45vh;pointer-events:none;background:linear-gradient(rgba(255,120,40,0),rgba(255,120,40,.28))}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
button:focus{outline:none}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.disp{font-family:'Lilita One','Fredoka',system-ui,sans-serif;font-weight:400;letter-spacing:.5px}
.hidden{display:none!important}

/* HUD */
#hud{position:fixed;left:0;top:0;right:0;pointer-events:none;padding:calc(8px + env(safe-area-inset-top)) 10px 0 10px;
  transform-origin:0 0;}
#hudL{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;transform:scale(var(--hud));transform-origin:0 0}
.ib{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:2.5px solid var(--ink);background:rgba(255,255,255,.92);
  box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:22px;height:22px}
#hudC{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%) scale(var(--hud));transform-origin:50% 0;
  display:flex;flex-direction:column;align-items:center;gap:4px}
#timer{font-size:17px;padding:2px 12px;border-radius:12px;background:rgba(42,20,88,.55);line-height:22px;min-width:64px;text-align:center}
#timer.hot{background:#ff3d7f;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#score{display:flex;align-items:center;gap:6px;font-size:34px;line-height:36px;text-shadow:0 3px 0 var(--ink),0 0 2px var(--ink);
  -webkit-text-stroke:1.5px var(--ink)}
#score i{display:inline-block;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);
  background:radial-gradient(circle at 64% 58%,#d9c24a 0 17%,transparent 18%),radial-gradient(circle at 34% 72%,#d9c24a 0 10%,transparent 11%),radial-gradient(circle at 30% 30%,#fff 0 12%,transparent 13%),#ffe45c;
  box-shadow:inset -5px -4px 0 rgba(42,20,88,.22)}
#score.bump{animation:bump .25s}
#score,#timer,#banner{will-change:transform}   /* pops and pulses run on the compositor, no HUD repaint */
@keyframes bump{40%{transform:scale(1.25)}}
#daily{font-size:13px;padding:3px 10px;border-radius:10px;background:rgba(255,210,63,.95);color:var(--ink);font-weight:700;
  opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s;white-space:nowrap}
#daily.on{opacity:1;transform:none}

#board{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));width:168px;transform:scale(var(--hud));transform-origin:100% 0;
  background:rgba(42,20,88,.55);border-radius:14px;padding:6px 8px;font-size:13px;line-height:19px}
#board .r{display:flex;gap:6px;align-items:center;white-space:nowrap}
#board .r b{width:18px;text-align:right;color:#d8ccff;font-weight:700}
#board .r span{flex:1;overflow:hidden;text-overflow:ellipsis}
#board .r em{font-style:normal;font-weight:700}
#board .r.me{color:var(--yellow)}
#board .r.me b{color:var(--yellow)}
#board .sep{height:1px;background:rgba(255,255,255,.2);margin:2px 0}
@media (max-width:520px){#board{width:128px;font-size:12px;line-height:17px;padding:5px 7px}}
#board .cr{display:inline-block;font-style:normal}
#board .crown{display:inline-block;width:12px;height:10px;margin-right:2px;vertical-align:-1px}
#board,#feed,#hudC,#hudL{contain:layout paint;will-change:transform}

#feed{position:absolute;left:10px;top:calc(62px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:4px;
  transform:scale(var(--hud));transform-origin:0 0;max-width:48vw}
#feed div{font-size:13px;padding:2px 9px;border-radius:9px;background:rgba(42,20,88,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  animation:feedIn .25s;transition:opacity .5s}
#feed div.me{background:rgba(255,95,168,.9)}
#feed div.gold{background:rgba(224,154,16,.92)}
#feed div b{font-weight:700}
@keyframes feedIn{from{transform:translateX(-20px);opacity:0}}

#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;font-size:52px;line-height:1;
  -webkit-text-stroke:2.5px var(--ink);text-shadow:0 5px 0 var(--ink);opacity:0}
#banner small{display:block;font-size:22px;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink);margin-top:6px}
#banner.show{animation:bannerA 1.6s ease-out forwards}
@keyframes bannerA{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.12)}20%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

#hint{position:fixed;left:50%;top:62%;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:opacity .3s}
#hint .lbl{font-size:24px;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink);white-space:nowrap}
#hint svg{width:64px;height:64px;filter:drop-shadow(0 3px 0 var(--ink))}
#hint.drag svg{animation:hdrag 1.6s ease-in-out infinite}
#hint.tap svg{animation:htap .8s ease-in-out infinite}
@keyframes hdrag{0%,100%{transform:translate(-34px,0) rotate(-8deg)}50%{transform:translate(34px,-10px) rotate(8deg)}}
@keyframes htap{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(8px) scale(.9)}}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);pointer-events:none;
  background:var(--yellow);color:var(--ink);font-weight:700;padding:8px 16px;border-radius:14px;border:2.5px solid var(--ink);
  box-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;font-size:15px}
#toast.on{opacity:1;transform:translateX(-50%)}

/* Overlays */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(42,20,88,.45);z-index:10}
.ov.clear{background:rgba(42,20,88,.18)}
.wrap{transform:scale(var(--ui));transform-origin:50% 50%;width:360px;display:flex;flex-direction:column;align-items:center;gap:12px}
.card{width:360px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
  padding:18px 18px 16px;position:relative;text-align:center}
.card h2{margin:0;font-size:30px;line-height:1.05}
.card .sub{font-size:15px;color:#6a4fa8;margin-top:2px}
.ribbon{position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:var(--pink);color:#fff;border:3px solid var(--ink);
  border-radius:12px;padding:3px 16px;font-size:18px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:3.5px solid var(--ink);border-radius:20px;background:var(--yellow);
  color:var(--ink);font-family:'Lilita One','Fredoka',sans-serif;font-size:26px;padding:10px 18px;box-shadow:0 6px 0 var(--ink);width:100%;
  transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.sec{background:#fff;font-size:20px;padding:8px 12px;box-shadow:0 5px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.lime{background:var(--lime)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn svg{width:26px;height:26px;flex:none}
.btn small{font-family:'Fredoka',sans-serif;font-weight:700;font-size:13px;display:block;line-height:1}
.row{display:flex;gap:10px;width:100%}
.btn.go{animation:goPulse 1.2s ease-in-out infinite}
@keyframes goPulse{50%{transform:scale(1.04)}}

/* results */
#rPlace{font-size:78px;line-height:.95;color:var(--ink);margin-top:6px}
#rPlace span{font-size:22px;color:#6a4fa8}
#rPlanet{width:120px;height:120px;display:block;margin:-6px auto -4px}
.stats{display:flex;gap:6px;margin:6px 0 8px}
.stats div{flex:1;background:#f1ebff;border-radius:14px;padding:5px 2px}
.stats b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:26px;line-height:1.05}
.stats small{font-size:11px;color:#6a4fa8;font-weight:700;letter-spacing:.5px}
#rCoins{display:flex;align-items:center;justify-content:center;gap:8px;font-size:30px}
.coin{display:inline-block;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c2 0 18%,#ffd23a 19% 62%,#e09a10 63%);border:2.5px solid var(--ink);vertical-align:-4px}
#rBreak{font-size:12px;color:#6a4fa8;margin-top:-2px}
.bar{height:16px;border-radius:9px;background:#e9e1ff;border:2.5px solid var(--ink);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),#3fd66a);width:0;transition:width .8s}
.lineitem{text-align:left;font-size:13px;font-weight:700;margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.lineitem em{font-style:normal;color:#6a4fa8;white-space:nowrap}
#rTop{display:flex;gap:6px;justify-content:center;margin-top:8px;font-size:12px;color:#6a4fa8}
#rTop span{background:#f1ebff;border-radius:8px;padding:2px 7px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}

/* KO */
#koCv{width:140px;height:140px;display:block;margin:0 auto}
#koBy{font-size:16px;color:#6a4fa8;margin:-4px 0 12px}

/* shop */
#shop .card{padding:14px 12px 12px}
.tabs{display:flex;gap:6px;margin:8px 0 10px}
.tabs button{flex:1;border:3px solid var(--ink);border-radius:14px;background:#f1ebff;color:var(--ink);font-family:'Lilita One',sans-serif;font-size:18px;padding:5px}
.tabs button.on{background:var(--cyan)}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:380px;overflow-y:auto;padding:2px;touch-action:pan-y}
.it{border:3px solid var(--ink);border-radius:16px;background:#f7f3ff;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.it canvas{width:78px;height:78px}
.it .nm{font-weight:700;font-size:13px}
.it .pr{font-family:'Lilita One',sans-serif;font-size:15px;display:flex;align-items:center;gap:4px;border-radius:10px;padding:1px 8px;background:var(--yellow);border:2px solid var(--ink)}
.it .pr .coin{width:15px;height:15px;border-width:2px;vertical-align:0}
.it.eq{background:#dffbff;border-color:#0aa5c8}
.it.eq .pr{background:var(--cyan)}
.it.own .pr{background:#fff}
.it.poor .pr{background:#e5ddf5;opacity:.75}
#shopCoins{position:absolute;right:14px;top:12px;font-family:'Lilita One',sans-serif;font-size:20px;display:flex;align-items:center;gap:5px}

#pause .card{padding-top:24px}
/* Halloween */
.bar.ev i{background:linear-gradient(90deg,#ffb24a,#ff8a1f)}
.it{position:relative}
.it.ev{background:#fff1e0}
.it .evt{position:absolute;top:3px;left:0;right:0;font-family:'Lilita One',sans-serif;font-size:10px;letter-spacing:.5px;color:#ff8a1f;text-shadow:0 1px 0 #fff}
</style>
</head>

<script>/* Moon Snatch.io. Fonts: Lilita One and Fredoka (SIL Open Font License 1.1). All art and sound are generated in code. */
/* Moon Snatch.io: procedural art (planets, moons, faces, background).
   Shared by the game and by tools/cover.html. Everything is drawn in code: no image files. */
window.MSArt = (function () {
'use strict';
const TAU = Math.PI * 2;
const INK = '#2a1458';

function mulberry(a) {
  a = a >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h || w)); return c; }
function hsl(h, s, l, a) { return a === undefined ? 'hsl(' + h + ',' + s + '%,' + l + '%)' : 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')'; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  const r = Math.round(A[0] + (B[0] - A[0]) * t), g = Math.round(A[1] + (B[1] - A[1]) * t), bl = Math.round(A[2] + (B[2] - A[2]) * t);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function hslHex(h, s, l) {
  s /= 100; l /= 100; h = ((h % 360) + 360) % 360;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = x => Math.round(x * 255).toString(16).padStart(2, '0');
  return '#' + to(f(0)) + to(f(8)) + to(f(4));
}

// ------------------------------------------------------------ palettes
const MOON_COLORS = ['#ffe45c', '#ff9ad5', '#7df3ff', '#b2ff6e', '#ffb24d', '#d3b6ff', '#ffffff', '#ff7a7a'];

const SKINS = [
  { id: 'terra', name: 'Terra', price: 0, kind: 'continents', c1: '#38a6ff', c2: '#5fe46b', c3: '#b9ff8a', trail: '#7fd6ff' },
  { id: 'lava', name: 'Lava', price: 250, kind: 'cracks', c1: '#6b1f3f', c2: '#ff7b1c', c3: '#ffe14a', trail: '#ff8a3c' },
  { id: 'ice', name: 'Frosty', price: 250, kind: 'ice', c1: '#9eeaff', c2: '#ffffff', c3: '#5bb8f0', trail: '#c9f6ff' },
  { id: 'candy', name: 'Candy', price: 400, kind: 'swirl', c1: '#ff7fc8', c2: '#fff1fb', c3: '#ff4fa8', trail: '#ff9ad5' },
  { id: 'cheese', name: 'Cheese', price: 400, kind: 'holes', c1: '#ffd84a', c2: '#f0a92a', c3: '#fff2a8', trail: '#ffe27a' },
  { id: 'melon', name: 'Melon', price: 600, kind: 'melon', c1: '#8ef26a', c2: '#2c9a3c', c3: '#d8ffb0', trail: '#a6ff7a' },
  { id: 'gas', name: 'Ringo', price: 600, kind: 'bands', c1: '#ffb25b', c2: '#ffe2a8', c3: '#e8743a', ring: '#fff0c9', trail: '#ffc77a' },
  { id: 'disco', name: 'Disco', price: 900, kind: 'tiles', c1: '#b9a8ff', c2: '#ffffff', c3: '#7a5cff', trail: '#e0d6ff' },
  { id: 'galaxy', name: 'Galaxy', price: 1200, kind: 'galaxy', c1: '#3b1d8f', c2: '#ff7ad9', c3: '#7df3ff', trail: '#c08bff' },
  { id: 'gold', name: 'Gold', price: 2000, kind: 'metal', c1: '#ffd23a', c2: '#c98a0c', c3: '#fff6c2', trail: '#ffe36b' },
  // Halloween 2026 (Haunted Orbit): earned during the event, kept forever. Never sold for coins.
  { id: 'pumpkin', name: 'Pumpkin', price: 0, event: 'halloween', quest: 'bombs', need: 8, kind: 'pumpkin', c1: '#ff8a1f', c2: '#d95b00', c3: '#ffc47a', trail: '#ffb24a' },
  { id: 'ghost', name: 'Ghost', price: 0, event: 'halloween', quest: 'rounds', need: 6, kind: 'ghost', c1: '#efeaff', c2: '#ffffff', c3: '#b9a8ff', trail: '#e8e2ff' }
];

const TRAILS = [
  { id: 'comet', name: 'Comet', price: 0 },
  { id: 'sparkle', name: 'Sparkle', price: 150 },
  { id: 'bubbles', name: 'Bubbles', price: 300 },
  { id: 'hearts', name: 'Hearts', price: 450 },
  { id: 'fire', name: 'Fire', price: 600 },
  { id: 'rainbow', name: 'Rainbow', price: 1000 },
  { id: 'candycorn', name: 'Candy Corn', price: 500, event: 'halloween' }   // on sale only during Halloween
];
const PUMPKIN_COL = '#ff8a1f';

const BOT_KINDS = ['bands', 'spots', 'craters', 'stripes', 'swirl', 'continents', 'bands', 'spots'];
function botSpec(rnd) {
  const kind = BOT_KINDS[Math.floor(rnd() * BOT_KINDS.length)];
  const h = Math.floor(rnd() * 360);
  const h2 = h + (rnd() < 0.5 ? 25 : -35) + rnd() * 20;
  const spec = { kind, c1: hslHex(h, 78, 62), c2: hslHex(h2, 85, 74), c3: hslHex(h + 180 * (rnd() < 0.3 ? 1 : 0.15), 70, 50), seed: Math.floor(rnd() * 1e9) };
  if (kind === 'continents') { spec.c1 = hslHex(h, 80, 60); spec.c2 = hslHex(h + 110, 75, 62); spec.c3 = hslHex(h + 110, 80, 78); }
  if (kind === 'bands' && rnd() < 0.35) spec.ring = hslHex(h2 + 40, 90, 85);
  spec.trail = hslHex(h, 90, 75);
  return spec;
}

// ------------------------------------------------------------ surface painters (centered at 0,0, radius R, already clipped)
function blob(c, x, y, r, rnd, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, d = rnd() * r * 0.7;
    c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * (0.35 + rnd() * 0.5), 0, TAU); c.fill();
  }
}
const PAINT = {
  continents(c, R, s, rnd) {
    c.fillStyle = s.c1; c.fillRect(-R, -R, 2 * R, 2 * R);
    c.fillStyle = mix(s.c1, '#ffffff', 0.18);
    for (let i = 0; i < 5; i++) { c.beginPath(); c.arc((rnd() - 0.5) * 1.6 * R, (rnd() - 0.5) * 1.6 * R, R * (0.15 + rnd() * 0.2), 0, TAU); c.fill(); }
    for (let i = 0; i < 6; i++) {
      const x = (rnd() - 0.5) * 1.8 * R, y = (rnd() - 0.5) * 1.5 * R, r = R * (0.2 + rnd() * 0.22);
      c.fillStyle = s.c2; blob(c, x, y, r, rnd, 9);
      c.fillStyle = s.c3; blob(c, x - r * 0.15, y - r * 0.15, r * 0.4, rnd, 4);
    }
    c.fillStyle = '#ffffff';
    c.beginPath(); c.ellipse(0, -R * 1.02, R * 0.7, R * 0.24, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(0, R * 1.04, R * 0.6, R * 0.2, 0, 0, TAU); c.fill();
  },
  bands(c, R, s, rnd) {
    c.fillStyle = s.c1; c.fillRect(-R, -R, 2 * R, 2 * R);
    let y = -R; let i = 0;
    while (y < R) {
      const h = R * (0.12 + rnd() * 0.16);
      const col = [s.c2, s.c1, s.c3, s.c1][i % 4];
      const amp = R * 0.035, ph = rnd() * TAU;
      c.fillStyle = col; c.beginPath(); c.moveTo(-R, y);
      for (let x = -R; x <= R; x += R / 12) c.lineTo(x, y + Math.sin(x / R * 5 + ph) * amp);
      for (let x = R; x >= -R; x -= R / 12) c.lineTo(x, y + h + Math.sin(x / R * 5 + ph + 1) * amp);
      c.closePath(); c.fill();
      y += h; i++;
    }
    c.fillStyle = s.c3; c.beginPath(); c.ellipse(R * 0.25, R * 0.3, R * 0.26, R * 0.15, 0, 0, TAU); c.fill();
    c.fillStyle = mix(s.c3, '#ffffff', 0.4); c.beginPath(); c.ellipse(R * 0.22, R * 0.28, R * 0.14, R * 0.07, 0, 0, TAU); c.fill();
  },
  spots(c, R, s, rnd) {
    c.fillStyle = s.c1; c.fillRect(-R, -R, 2 * R, 2 * R);
    for (let i = 0; i < 16; i++) {
      c.fillStyle = i % 3 === 0 ? s.c3 : s.c2;
      c.beginPath(); c.arc((rnd() - 0.5) * 2 * R, (rnd() - 0.5) * 2 * R, R * (0.06 + rnd() * 0.18), 0, TAU); c.fill();
    }
  },
  craters(c, R, s, rnd) {
    c.fillStyle = s.c1; c.fillRect(-R, -R, 2 * R, 2 * R);
    const dark = mix(s.c1, INK, 0.28), lite = mix(s.c1, '#ffffff', 0.35);
    for (let i = 0; i < 11; i++) {
      const x = (rnd() - 0.5) * 1.9 * R, y = (rnd() - 0.5) * 1.9 * R, r = R * (0.07 + rnd() * 0.17);
      c.fillStyle = lite; c.beginPath(); c.arc(x + r * 0.12, y + r * 0.12, r, 0, TAU); c.fill();
      c.fillStyle = dark; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    }
    c.fillStyle = s.c2;
    for (let i = 0; i < 6; i++) { c.beginPath(); c.arc((rnd() - 0.5) * 1.8 * R, (rnd() - 0.5) * 1.8 * R, R * 0.05, 0, TAU); c.fill(); }
  },
  stripes(c, R, s, rnd) {
    c.fillStyle = s.c1; c.fillRect(-R, -R, 2 * R, 2 * R);
    c.fillStyle = s.c2;
    const n = 3 + Math.floor(rnd() * 2);
    for (let i = 0; i < n; i++) {
      const w = R * (0.2 + i * (0.8 / n));
      c.beginPath(); c.ellipse(0, 0, w + R * 0.09, R * 1.1, 0, 0, TAU); c.ellipse(0, 0, w, R * 1.1, 0, 0, TAU, true); c.fill();
    }
    c.fillStyle = s.c3; c.fillRect(-R * 0.06, -R, R * 0.12, 2 * R);
  },
  swirl(c, R, s, rnd) {
    c.fillStyle = s.c1; c.fillRect(-R, -R, 2 * R, 2 * R);
    c.lineCap = 'round';
    for (let arm = 0; arm < 3; arm++) {
      c.strokeStyle = arm === 1 && s.c3 ? s.c3 : s.c2; c.lineWidth = R * 0.17;
      c.beginPath();
      for (let t = 0; t < 1.001; t += 0.02) {
        const a = arm * TAU / 3 + t * 5.2, d = t * R * 1.15;
        const x = Math.cos(a) * d, y = Math.sin(a) * d;
        if (t === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.stroke();
    }
  },
  cracks(c, R, s, rnd) {
    c.fillStyle = s.c1; c.fillRect(-R, -R, 2 * R, 2 * R);
    c.fillStyle = mix(s.c1, INK, 0.3);

// ------------------------------------------------------------ faces (drawn live so they can look around and react)
// f: { lx, ly: look -1..1, blink: 0..1, mood: idle|happy|angry|shock|ko|cry|smug, shades: bool, t: time }
function drawFace(c, x, y, r, f) {
  const mood = f.mood || 'idle';
  const lw = Math.max(1, r * 0.075);
  const ex = r * 0.34, ey = -r * 0.1, erx = r * 0.21, ery = r * 0.25;
  const lx = (f.lx || 0) * r * 0.07, ly = (f.ly || 0) * r * 0.06;
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = INK; c.lineWidth = lw;
  // blush
  if (mood === 'idle' || mood === 'happy' || mood === 'smug' || mood === 'cry') {
    c.fillStyle = 'rgba(255,90,150,0.38)';
    c.beginPath(); c.ellipse(x - r * 0.56, y + r * 0.16, r * 0.13, r * 0.08, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(x + r * 0.56, y + r * 0.16, r * 0.13, r * 0.08, 0, 0, TAU); c.fill();
  }
  const shades = f.shades && mood !== 'ko' && mood !== 'shock' && mood !== 'cry';
  if (shades) {
    // sunglasses: two rounded lenses and a bridge
    c.fillStyle = INK;
    for (const s of [-1, 1]) {
      c.beginPath();
      c.moveTo(x + s * (ex - erx * 1.25) + lx * 0.3, y + ey - ery * 0.6 + ly * 0.3);
      c.lineTo(x + s * (ex + erx * 1.25) + lx * 0.3, y + ey - ery * 0.6 + ly * 0.3);
      c.quadraticCurveTo(x + s * (ex + erx * 1.2) + lx * 0.3, y + ey + ery * 0.95, x + s * ex + lx * 0.3, y + ey + ery * 0.85 + ly * 0.3);
      c.quadraticCurveTo(x + s * (ex - erx * 1.2) + lx * 0.3, y + ey + ery * 0.85, x + s * (ex - erx * 1.25) + lx * 0.3, y + ey - ery * 0.6 + ly * 0.3);
      c.fill();
    }
    c.lineWidth = lw * 1.3; c.beginPath(); c.moveTo(x - ex + erx + lx * 0.3, y + ey - ery * 0.45 + ly * 0.3); c.lineTo(x + ex - erx + lx * 0.3, y + ey - ery * 0.45 + ly * 0.3); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = lw * 0.9;
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x + s * ex - erx * 0.7 + lx * 0.3, y + ey - ery * 0.25); c.lineTo(x + s * ex - erx * 0.25 + lx * 0.3, y + ey - ery * 0.45); c.stroke(); }
    c.strokeStyle = INK; c.lineWidth = lw;
  } else if (mood === 'ko') {
    c.lineWidth = lw * 1.2;
    for (const s of [-1, 1]) {
      const cx = x + s * ex, cy = y + ey, d = erx * 0.75;
      c.beginPath(); c.moveTo(cx - d, cy - d); c.lineTo(cx + d, cy + d); c.moveTo(cx + d, cy - d); c.lineTo(cx - d, cy + d); c.stroke();
    }

    c.lineWidth = lw * 1.25;
    for (const s of [-1, 1]) { c.beginPath(); c.arc(x + s * ex, y + ey + ery * 0.35, erx * 0.8, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
  } else {
    const big = mood === 'shock' ? 1.18 : 1;
    const bl = mood === 'shock' ? 0 : (f.blink || 0);
    for (const s of [-1, 1]) {
      const cx = x + s * ex, cy = y + ey;
      const ry = ery * big * Math.max(0.08, 1 - bl);
      c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(cx, cy, erx * big, ry, 0, 0, TAU); c.fill(); c.stroke();
      if (bl < 0.7) {

const DAILY = [
  { text: 'Snatch {n} moons from bigger planets', n: 15, stat: 'snatched' },

function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

const Profile = (function () {
  const def = () => ({ coins: 0, skins: ['terra'], trails: ['comet'], skin: 'terra', trail: 'comet', rounds: 0, bestPlace: 0, bestMoons: 0,
    kos: 0, tut: 0, muted: false, daily: { date: '', idx: 0, prog: 0, done: false, streak: 0, lastDone: '' }, ev: { bombs: 0, rounds: 0 } });
  let p = def();
  function load() {
    const s = Store.get('profile', null);
    p = def();
    if (s && typeof s === 'object') {
      for (const k in p) if (s[k] !== undefined && typeof s[k] === typeof p[k]) p[k] = s[k];
      if (!Array.isArray(p.skins)) p.skins = ['terra'];
      if (!Array.isArray(p.trails)) p.trails = ['comet'];
      if (!A.SKINS.some(x => x.id === p.skin)) p.skin = 'terra';
      if (!A.TRAILS.some(x => x.id === p.trail)) p.trail = 'comet';
      if (!p.ev || typeof p.ev.bombs !== 'number' || typeof p.ev.rounds !== 'number') p.ev = { bombs: 0, rounds: 0 };
    }
    ensureDaily();
  }
  function save() { Store.set('profile', p); }
  function ensureDaily() {
    const k = dayKey();
    if (!p.daily || p.daily.date !== k) {
      const prev = p.daily || {};
      p.daily = { date: k, idx: dayIdx(k), prog: 0, done: false, streak: prev.streak || 0, lastDone: prev.lastDone || '' };
      save();
    }
  }
  return {
    get d() { return p; }, load, save, ensureDaily,
    dailyDef() { return DAILY[p.daily.idx]; },
    dailyText() { const d = DAILY[p.daily.idx]; return d.text.replace('{n}', d.n); },
    // returns reward coins when the challenge completes now, otherwise 0
    track(stat, value) {
      ensureDaily();
      const d = DAILY[p.daily.idx];
      if (p.daily.done || d.stat !== stat) return 0;
      if (d.max) p.daily.prog = Math.max(p.daily.prog, value); else p.daily.prog += value;
      if (p.daily.prog >= d.n) {
        p.daily.prog = d.n; p.daily.done = true;
        const y = new Date(); y.setDate(y.getDate() - 1);
        p.daily.streak = p.daily.lastDone === dayKey(y) ? (p.daily.streak || 0) + 1 : 1;
        p.daily.lastDone = p.daily.date;
        const reward = 200 + Math.min(150, (p.daily.streak - 1) * 25);
        p.coins += reward; save();
        return reward;
      }
      return 0;
    }
  };
})();

const GRID_CELL = 160, GRID_N = Math.ceil(ARENA_R * 2 / GRID_CELL) + 2;
const grid = new Uint16Array(GRID_N * GRID_N);
function gcell(x, y) { return clamp(Math.floor((x + ARENA_R) / GRID_CELL), 0, GRID_N - 1) + clamp(Math.floor((y + ARENA_R) / GRID_CELL), 0, GRID_N - 1) * GRID_N; }
// cell list: loose moons sorted by cell, so planets and bots only look at moons near them
const cellStart = new Int32Array(GRID_N * GRID_N + 1);
let cellItems = [];
function buildGrid() {
  grid.fill(0);
  const L = W.loose, n = L.length;
  const cid = buildGrid.cid && buildGrid.cid.length >= n ? buildGrid.cid : (buildGrid.cid = new Int32Array(Math.max(1024, n * 2)));
  for (let i = 0; i < n; i++) { const c = gcell(L[i].x, L[i].y); cid[i] = c; grid[c]++; }
  let acc = 0;
  for (let c = 0; c < grid.length; c++) { cellStart[c] = acc; acc += grid[c]; }
  cellStart[grid.length] = acc;
  if (cellItems.length < n) cellItems = new Array(n * 2);
  const fill = buildGrid.fill && buildGrid.fill.length >= grid.length ? buildGrid.fill : (buildGrid.fill = new Int32Array(grid.length));
  fill.set(cellStart.subarray(0, grid.length));
  for (let i = 0; i < n; i++) cellItems[fill[cid[i]]++] = L[i];
}
function forNear(x, y, rad, fn) {
  const cx0 = clamp(Math.floor((x - rad + ARENA_R) / GRID_CELL), 0, GRID_N - 1), cx1 = clamp(Math.floor((x + rad + ARENA_R) / GRID_CELL), 0, GRID_N - 1);
  const cy0 = clamp(Math.floor((y - rad + ARENA_R) / GRID_CELL), 0, GRID_N - 1), cy1 = clamp(Math.floor((y + rad + ARENA_R) / GRID_CELL), 0, GRID_N - 1);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    const c = cx + cy * GRID_N;
    for (let k = cellStart[c], e = cellStart[c + 1]; k < e; k++) if (fn(cellItems[k]) === false) return;
  }
}

function botThink(p, b) {
  b.think = Math.max(0.12, 0.62 - 0.45 * b.skill) * (0.8 + rand() * 0.4);
  const n = p.moons.length;
  if (b.afk > 0) return;
  if (b.skill < 0.5 && rand() < (1 - b.skill) * 0.015) { b.afk = rr(0.5, 1.4); return; }

  // see incoming shots (better bots notice more often)
  if (b.dodge <= 0) for (const j of W.projs) {
    if (j.owner === p.id) continue;
    const rx = p.x - j.x, ry = p.y - j.y, vv = j.vx * j.vx + j.vy * j.vy;
    const t = (rx * j.vx + ry * j.vy) / vv;
    if (t < 0 || t > 0.45) continue;
    const cx = j.x + j.vx * t - p.x, cy = j.y + j.vy * t - p.y;
    if (cx * cx + cy * cy < (p.r + 26) * (p.r + 26) && rand() < b.skill * 0.85) {
      const l = Math.hypot(cx, cy);
      if (l > 1) { b.dx = -cx / l; b.dy = -cy / l; } else { const s = Math.sqrt(vv); b.dx = -j.vy / s * b.strafe; b.dy = j.vx / s * b.strafe; }
      b.dodge = 0.3; break;
    }
  }

  let bestG = 'wander', bestU = 0.06, bT = null, bM = null;
  const cur = b.goal;
  const consider = (g, u, t, m) => { if (g === cur && (t === b.tgt || g === 'collect' || g === 'golden')) u *= 1.25; if (u > bestU) { bestU = u; bestG = g; bT = t; bM = m; } };

  if (W.golden) {
    const d = Math.hypot(W.golden.x - p.x, W.golden.y - p.y);
    if (d < 1800) consider('golden', 3.2 * (1 - d / 2300) * (0.6 + b.greed * 0.4), null, null);
  }
  // collect: nearest moons weighted by local density
  let cm = null, cu = 0;
  forNear(p.x, p.y, 700, L => {
    if (L.dead || L.lock > 0.15 || (L.owner === p.id && L.ownLock > 0.2)) return;
    const dx = L.x - p.x, dy = L.y - p.y;
    const u = (1 + 0.35 * grid[gcell(L.x, L.y)] + (L.c === PK ? 6 : 0)) / (Math.sqrt(dx * dx + dy * dy) + 90) * (1 + (rand() - 0.5) * (1 - b.skill) * 1.6);
    if (u > cu) { cu = u; cm = L; }
  });
  if (cm) consider('collect', b.greed * cu * 160 * (n >= MAX_MOONS ? 0 : 1) * (p.isPlayer ? 1 : G.botGreed), null, cm);

  let threat = null, threatD = 1e9;
  for (const q of W.planets) {
    if (q === p || !q.alive) continue;
    const dx = q.x - p.x, dy = q.y - p.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d > 820) continue;
    const qn = q.moons.length;
    // hunt
    const kl = koLimit(p);
    if ((n > b.keep + 2 || (qn <= kl && n >= 2)) && q.shield <= 0) {
      let u = d > 700 ? 0 : (qn * 0.6 + 5) / (d + 220) * b.aggro * 30;
      if (q.crown) u *= 1.5;
      if (q.isPlayer) u *= G.playerBias;
      if (q === b.grudge) u *= 2.2;
      if (qn <= kl) u *= 3.0; else if (qn <= kl * 2) u *= 1.5;
      if (n < 10) u *= 0.6;
      consider('hunt', u, q, null);
    }
    // snatch from bigger planets
    if (b.st.snatch > 0 && qn >= n + 8 && q.shield <= 0) consider('snatch', qn / (d + 250) * b.st.snatch * 60 * (q.isPlayer ? G.playerBias : 1), q, null);
    // threats
    const hunting = q.bot ? (q.bot.goal === 'hunt' && q.bot.tgt === p) : (q.isPlayer && d < 380);
    if (qn > n + 6 && d < 420 && (hunting || n <= koLimit(q)) && d < threatD) { threat = q; threatD = d; }
  }
  if (threat && (n <= b.keep + 3 || n <= koLimit(threat))) consider('flee', 3.5 * (1 - threatD / 420) * (1.25 - b.aggro * 0.5) * (0.4 + b.skill), threat, null);
  if (bestG === 'wander' && (cur !== 'wander' || Math.hypot(b.gx - p.x, b.gy - p.y) < 120)) { const [x, y] = randomPoint(ARENA_R * 0.7); b.gx = x; b.gy = y; }
  if (bestG !== b.goal) { b.strafe = rand() < 0.5 ? 1 : -1; b.passT = 0; }
  b.goal = bestG; b.tgt = bT; b.tm = bM;
}

function leadDir(sx, sy, q, err) {
  let tx = q.x, ty = q.y;
  for (let i = 0; i < 2; i++) { const t = Math.hypot(tx - sx, ty - sy) / PROJ_SPEED; tx = q.x + q.vx * t; ty = q.y + q.vy * t; }
  const a = Math.atan2(ty - sy, tx - sx) + (err || 0);
  return [Math.cos(a), Math.sin(a)];
}

function botSteer(p, b, dt) {
  b.think -= dt; b.fT -= dt; b.grudgeT -= dt; b.strafeT -= dt;
  if (b.grudgeT <= 0) b.grudge = null;
  if (b.think <= 0) botThink(p, b);
  let dx = 0, dy = 0, mag = 1;
  const n = p.moons.length;
  if (b.afk > 0) { b.afk -= dt; p.mag = 0.15; return; }
  if (b.dodge > 0) { b.dodge -= dt; dx = b.dx; dy = b.dy; }
  else {
    switch (b.goal) {
      case 'golden': if (!W.golden) { b.think = 0; break; } dx = W.golden.x - p.x; dy = W.golden.y - p.y; break;
      case 'collect': {
        const L = b.tm;
        if (!L || L.dead) { b.think = Math.min(b.think, 0.05); if (L) { dx = L.x - p.x; dy = L.y - p.y; } break; }
        dx = L.x - p.x; dy = L.y - p.y; break;
      }
      case 'hunt': {
        const q = b.tgt;
        if (!q || !q.alive || n <= b.keep) { b.think = 0; break; }
        const px = q.x + q.vx * 0.3, py = q.y + q.vy * 0.3;
        let tx = px - p.x, ty = py - p.y; const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;
        const band = b.st.range;
        if (b.strafeT <= 0) { b.strafeT = rr(0.8, 2.2); if (rand() < 0.5) b.strafe = -b.strafe; }
        if (d > band * 1.25) { dx = tx; dy = ty; }
        else if (d < band * 0.6) { dx = -tx * 0.8 - ty * b.strafe * 0.6; dy = -ty * 0.8 + tx * b.strafe * 0.6; mag = 0.85; }
        else { dx = -ty * b.strafe + tx * 0.25; dy = tx * b.strafe + ty * 0.25; mag = 0.7; }
        if (b.fT <= 0 && d < 540 && p.flingCD <= 0 && (G.state === 'play' || G.state === 'dead')) {
          const errMul = (q.isPlayer && Profile.d.rounds < 3) ? 1.35 : 1;
          const err = (rand() + rand() - 1) * ((1 - b.skill) * 0.45 + 0.09) * errMul;
          fling(p, 0, 0, b.skill > 0.35 ? q : null, err, q);
          b.fT = (1.8 + (1.3 - b.aggro) * 1.6) * rr(0.7, 1.5) * (q.moons.length <= koLimit(p) ? 0.5 : 1);
        }
        break;
      }
      case 'snatch': {
        const q = b.tgt;
        if (!q || !q.alive || q.moons.length <= n) { b.think = 0; break; }
        const ux = q.x - p.x, uy = q.y - p.y, d = Math.hypot(ux, uy) || 1;
        if (d < q.r + p.r + 30) b.passT = 0.5;
        if (b.passT > 0) { b.passT -= dt; dx = p.vx; dy = p.vy; if (b.passT <= 0) b.think = 0; break; }
        // aim beside the core so the path cuts through the rings
        const off = q.r + p.r + 8;
        dx = q.x + (-uy / d) * off * b.strafe + q.vx * 0.25 - p.x;
        dy = q.y + (ux / d) * off * b.strafe + q.vy * 0.25 - p.y;
        break;
      }
      case 'flee': {
        const q = b.tgt;
        if (!q || !q.alive) { b.think = 0; break; }
        dx = p.x - q.x; dy = p.y - q.y;
        const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
        const e = Math.hypot(p.x, p.y) / ARENA_R;
        if (e > 0.75) { dx -= p.x / ARENA_R * 1.4; dy -= p.y / ARENA_R * 1.4; }
        break;
      }
      default: dx = b.gx - p.x; dy = b.gy - p.y; mag = 0.85;
    }
  }
  const l = Math.hypot(dx, dy);
  if (l > 0.001) {
    dx /= l; dy /= l;
    const wa = Math.sin(G.t * (1.3 + b.skill) + b.wob) * (0.32 * (1 - b.skill) + 0.05);
    const cs = Math.cos(wa), sn = Math.sin(wa);
    const ndx = dx * cs - dy * sn, ndy = dx * sn + dy * cs;
    const turn = Math.min(1, (5 + 9 * b.skill) * dt);
    let hx = p.hx + (ndx - p.hx) * turn, hy = p.hy + (ndy - p.hy) * turn;
    const hl = Math.hypot(hx, hy) || 1; p.hx = hx / hl; p.hy = hy / hl;
  }
  p.mag = mag;
}

// ---------------------------------------------------------------- combat
function fling(p, ax, ay, q, err, lookAt) {
  if (p.flingCD > 0 || !p.alive) return false;
  if (!p.moons.length) return false;
  // a held pumpkin always flies first: the next fling is a bomb
  let m = null;
  if (p.pkN > 0) for (let k = p.moons.length - 1; k >= 0; k--) if (p.moons[k].c === PK) { m = p.moons.splice(k, 1)[0]; p.pkN--; break; }
  if (!m) m = p.moons.pop();
  layout(p);
  const sx = p.x + m.ox, sy = p.y + m.oy;
  let dx = ax, dy = ay;
  if (q) { [dx, dy] = leadDir(sx, sy, q, err); }
  else if (lookAt) { const a = Math.atan2(lookAt.y - sy, lookAt.x - sx) + (err || 0); dx = Math.cos(a); dy = Math.sin(a); }
  const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  W.projs.push({ x: sx, y: sy, px: sx, py: sy, vx: dx * PROJ_SPEED, vy: dy * PROJ_SPEED, c: m.c, owner: p.id, life: PROJ_LIFE, bomb: m.c === PK });
  W.nFlings++;
  p.flingCD = FLING_CD; p.vx -= dx * 70; p.vy -= dy * 70;
  p.mood = 'angry'; p.moodT = 0.35; squash(p, dx, dy, 0.08);
  for (let i = 0; i < 4; i++) part('dot', sx, sy, dx * 120 + rr(-60, 60), dy * 120 + rr(-60, 60), 0.25, 4, mcol(m.c));
  if (p.isPlayer) { Sfx.fling(); addTrauma(0.07); G.stats.flings++; }
  return true;
}

function byId(id) { for (const p of W.planets) if (p.id === id) return p; return null; }

function burst(p, k, dx, dy) {
  k = Math.min(k, p.moons.length);
  if (k <= 0) return;
  const out = p.moons.splice(p.moons.length - k, k);
  for (const m of out) {
    const wx = p.x + m.ox, wy = p.y + m.oy;
    let ux = m.ox, uy = m.oy; const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
    const s = rr(280, 540);
    spawnLoose(wx, wy, m.c, ux * s + dx * 170 + p.vx * 0.4, uy * s + dy * 170 + p.vy * 0.4, 0.22, p.id, 1.1, false);
  }
  layout(p);
}

function hitPlanet(p, j) {
  const att = byId(j.owner);
  const sp = Math.hypot(j.vx, j.vy) || 1, dx = j.vx / sp, dy = j.vy / sp;
  const near = isNearPlayer(p.x, p.y);
  if (p.inv > 0 || p.shield > 0) {
    spawnLoose(j.x, j.y, j.c, -dx * 260 + rr(-80, 80), -dy * 260 + rr(-80, 80), 0.25, j.owner, 0.5, false);
    part('ring', p.x, p.y, 0, 0, 0.3, p.r + 12, '#7df3ff');
    if (near) Sfx.shield();
    return;
  }
  spawnLoose(j.x - dx * p.r * 0.6, j.y - dy * p.r * 0.6, j.c, -dx * 200 + rr(-120, 120), -dy * 200 + rr(-120, 120), 0.25, j.owner, 0.4, false);
  const n = p.moons.length;
  p.lastHitBy = att;
  if (p.bot && att) { p.bot.grudge = att; p.bot.grudgeT = 6; if (att.isPlayer && rand() < 0.18) say(p, pick(CHAT.hit)); }
  if (att) { att.hits++; att.mood = 'happy'; att.moodT = 0.6; if (att.isPlayer) trackDaily('hits', 1); }
  if (n <= koLimit(att)) { ko(p, att, dx, dy); return; }
  const lose = Math.min(n, Math.max(4, Math.ceil(n * 0.35)));
  burst(p, lose, dx, dy);
  W.nHits++;
  p.inv = 1.0; p.stun = 0.2; p.vx += dx * 520; p.vy += dy * 520;
  p.mood = 'shock'; p.moodT = 0.7; p.flash = 1; squash(p, dx, dy, 0.25);
  fxHit(j.x, j.y, mcol(j.c), lose);
  if (p.isPlayer) {
    Sfx.hurt(); addTrauma(0.55); G.hitstop = 0.07;
    popup(p.x, p.y - p.r - 20, '-' + lose, '#ff6f8f', 30);
  } else if (att && att.isPlayer) {
    Sfx.hit(); Sfx.burstPops(lose); addTrauma(0.28); G.hitstop = 0.05;
    popup(p.x, p.y - p.r - 20, 'HIT! -' + lose, '#ffd23f', 30);
    if (G.tutStage < 3) tutorialHit();
  } else if (near) Sfx.farHit();
}

function ko(p, att, dx, dy) {
  burst(p, p.moons.length, dx, dy);
  for (let i = 0; i < 2; i++) { const a = rand() * TAU, s = rr(200, 380); spawnLoose(p.x, p.y, undefined, Math.cos(a) * s, Math.sin(a) * s, 0.25, p.id, 3, false); }
  p.alive = false; p.deadT = 0; p.deaths++; p.mood = 'ko'; p.trailN = 0;
  fxKO(p);
  if (att) {
    att.kos++; att.mood = 'happy'; att.moodT = 1.2;
    if (att.bot && rand() < 0.25) say(att, pick(CHAT.ko));
    if (att.isPlayer) trackDaily('kos', 1);
  }
  if (p.bot && rand() < 0.22) say(p, pick(CHAT.died), true);
  const me = p.isPlayer || (att && att.isPlayer);
  feed((att ? '<b>' + esc(att.isPlayer ? 'You' : att.name) + '</b> KO\'d ' : '') + '<b>' + esc(p.isPlayer ? 'you' : p.name) + '</b>' + (att ? '' : ' crashed'), me ? 'me' : '');
  if (att && att.isPlayer) {
    Sfx.ko(); addTrauma(0.5); G.hitstop = 0.09;
    if (EVENT.on) Sfx.boo();
    popup(p.x, p.y - 30, 'KO!', '#ff5fa8', 46);
    if (att.kos === 3 || att.kos === 5 || att.kos === 10) banner(att.kos + ' KOs!', att.kos >= 10 ? 'UNSTOPPABLE' : att.kos >= 5 ? 'RAMPAGE' : 'ON FIRE');
  } else if (isNearPlayer(p.x, p.y)) Sfx.farHit();
  if (p.isPlayer) playerKO(att);
}

// Halloween: a flung pumpkin bursts every planet near it (not the thrower). Small ones in range are KO'd outright.
function explode(x, y, att, direct) {
  const near = isNearPlayer(x, y);
  W.nBombs = (W.nBombs || 0) + 1;
  let n = 0;
  for (const p of W.planets) {
    if (!p.alive || p === att || p.shield > 0) continue;
    const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy);
    if (d > BOMB_R + p.r && p !== direct) continue;
    const ux = d > 1 ? dx / d : 1, uy = d > 1 ? dy / d : 0;
    n++;
    if (att) att.hits++;
    if (p.bot && att) { p.bot.grudge = att; p.bot.grudgeT = 6; }
    p.lastHitBy = att;
    const cnt = p.moons.length;
    if (cnt <= koLimit(att)) { ko(p, att, ux, uy); continue; }
    const lose = Math.min(cnt, Math.max(4, Math.ceil(cnt * 0.35)));
    burst(p, lose, ux, uy);
    p.inv = 1.0; p.stun = 0.25; p.vx += ux * 620; p.vy += uy * 620;
    p.mood = 'shock'; p.moodT = 0.8; p.flash = 1; squash(p, ux, uy, 0.3);
    if (p.isPlayer) { Sfx.hurt(); addTrauma(0.6); popup(p.x, p.y - p.r - 20, '-' + lose, '#ff6f8f', 30); }
    else if (near) popup(p.x, p.y - p.r - 20, '-' + lose, '#ffb24a', 24);
  }
  // loose moons are blown outward too
  forNear(x, y, BOMB_R, L => { const dx = L.x - x, dy = L.y - y, d = Math.hypot(dx, dy) || 1; if (d < BOMB_R) { const k = (1 - d / BOMB_R) * 520; L.vx += dx / d * k; L.vy += dy / d * k; L.lock = Math.max(L.lock, 0.15); } });
  part('ring', x, y, 0, 0, 0.5, BOMB_R, '#ffb24a');
  part('ring', x, y, 0, 0, 0.35, BOMB_R * 0.6, '#ffffff');
  for (let i = 0; i < 18; i++) { const a = rand() * TAU, s = rr(250, 700); part('shard', x, y, Math.cos(a) * s, Math.sin(a) * s, rr(0.4, 0.7), rr(7, 12), i % 3 ? '#ff8a1f' : '#ffd23f', 3); }
  for (let i = 0; i < 10; i++) { const a = rand() * TAU, s = rr(100, 300); part('puff', x, y, Math.cos(a) * s, Math.sin(a) * s, rr(0.5, 0.8), 26, '', 3); }
  Sfx.bomb(near);
  if (near) addTrauma(att && att.isPlayer ? 0.45 : 0.3);
  if (att && att.isPlayer) {
    W.pBombs = (W.pBombs || 0) + 1;
    G.hitstop = 0.08;
    popup(x, y - 40, n ? 'PUMPKIN BOMB! x' + n : 'MISSED', n ? '#ffb24a' : '#ffffff', n ? 34 : 22);
    if (n) { trackDaily('hits', n); questAdd('bombs', n); }
  }
}

function snatchMoon(to, from, k) {
  const m = from.moons.splice(k, 1)[0];
  layout(from);
  const wx = from.x + m.ox, wy = from.y + m.oy;
  addMoon(to, m.c, wx, wy);
  to.snatchCD = 0.15; to.snatched++;
  from.mood = 'shock'; from.moodT = 0.3;
  if (from.bot) { from.bot.grudge = to; from.bot.grudgeT = 5; }
  part('star', wx, wy, rr(-40, 40), rr(-40, 40), 0.35, 7, '#ffffff');
  if (to.isPlayer) { Sfx.snatch(); popup(wx, wy - 10, '+1 SNATCH', '#ffd23f', 18); trackDaily('snatched', 1); }
  else if (from.isPlayer) { Sfx.snatched(); popup(wx, wy - 10, '-1', '#ff6f8f', 18); }
}

function collect(p, L) {
  if (!addMoon(p, L.c, L.x, L.y)) return false;
  L.dead = true;
  p.collected++;
  if (p.isPlayer) {
    G.combo = G.comboT > 0 ? G.combo + 1 : 0; G.comboT = 0.6;
    Sfx.collect(G.combo);
    part('dot', L.x, L.y, rr(-50, 50), rr(-50, 50), 0.25, 3.5, mcol(L.c));
    trackDaily('collected', 1);
  }
  return true;
}

function grabGolden(p) {
  const g = W.golden; W.golden = null;
  for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; addMoon(p, 0, g.x + Math.cos(a) * 30, g.y + Math.sin(a) * 30); }
  p.golden++;
  fxGold(g.x, g.y);
  feed('<b>' + esc(p.isPlayer ? 'You' : p.name) + '</b> grabbed the Golden Moon', 'gold');
  if (p.isPlayer) { Sfx.goldGrab(); banner('+10 MOONS', 'GOLDEN MOON'); addTrauma(0.3); trackDaily('golden', 1); }
  else if (p.bot && rand() < 0.4) say(p, pick(['mine!!', 'GOLD', 'ez gold', 'yesss']));
}

function say(p, text, force) { if (!force && p.chatT > 0) return; p.chat = text; p.chatT = 2.4; }

// ---------------------------------------------------------------- particles and popups
const MAXP = [180, 340, 560];
function part(kind, x, y, vx, vy, life, size, color, extra) {

}
function popup(x, y, text, color, size) { W.pops.push({ x, y, text, color, size: size || 22, t: 0, life: 0.9 }); if (W.pops.length > 14) W.pops.shift(); }
function fxHit(x, y, col, n) {

  for (let i = 0; i < 4; i++) { const a = rand() * TAU, s = rr(80, 200); part('star', x, y, Math.cos(a) * s, Math.sin(a) * s, 0.5, rr(7, 11), col, 3); }

}

}
function addTrauma(v) { G.trauma = Math.min(1, G.trauma + v); }
function squash(p, nx, ny, amt) { p.sqa = Math.atan2(ny, nx); p.sqv -= amt * 14; }
function isNearPlayer(x, y) { return Math.abs(x - cam.x) < vw / cam.z * 0.6 && Math.abs(y - cam.y) < vh / cam.z * 0.6; }

// ---------------------------------------------------------------- input
const In = { type: ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0) ? 'touch' : 'mouse', mx: -1, my: -1, mouseIn: false,
  joy: null, keys: {}, hasMouse: false, lastKey: 0 };

// ---------------------------------------------------------------- canvas, camera
const canvas = $('game');
const ctx = canvas.getContext('2d');
const bgFar = $('bgFar'), bgGrid = $('bgGrid');
const BG_TILE = 768, GRID_TILE = 256;   // CSS px; the grid tile holds 4x4 dots at 64 world units
let vw = 0, vh = 0, dpr = 1, dprCap = PIN ? PIN[0] : In.type === 'touch' ? 1.5 : 2;

function targetZoom() {

// ---------------------------------------------------------------- round setup
function newRound() {
  W.planets.length = 0; W.loose.length = 0; W.projs.length = 0; W.parts.length = 0; W.pops.length = 0;
  W.golden = null; W.time = 0; W.nFlings = 0; W.nHits = 0; W.noobDone = false; W.pkT = 1.5; W.left = ROUND_TIME; W.goldDone = false; W.finalDone = false; W.rainLeft = 0; W.lastTick = 99;
  G.combo = 0; G.comboT = 0; G.killer = null; G.koShown = false; G.trauma = 0; G.timeScale = 1; G.slowT = 0; G.hitstop = 0;
  G.lastScore = -1; G.roundCoins = 0; G.roundDaily = 0;
  Profile.ensureDaily();
  const rounds = Profile.d.rounds;
  G.playerBias = rounds === 0 ? 0.55 : Math.min(1.3, 0.85 + rounds * 0.07);
  // rookie handicap for the first rounds: bots a touch slower and less greedy, so a new player can reach the top half
  G.botPace = rounds < 3 ? 0.9 + rounds * 0.03 : 1;
  G.botGreed = rounds < 3 ? 0.78 + rounds * 0.07 : 1;
  const skillMean = Math.min(0.72, 0.3 + rounds * 0.06);

  // player
  const skin = skinById(Profile.d.skin);
  player = newPlanet('You', Object.assign({ seed: 777 }, skin), true);
  W.planets.push(player);
  const [px, py] = randomPoint(ARENA_R * 0.35);
  placePlanet(player, px, py, 5, 1.5);
  player.hx = 0; player.hy = -1;

  // a welcome field right in front of the player so the first second does something
  spawnField(px + rr(-40, 40), py - 230, 10, 70);
  spawnField(px + 230, py + 120, 7, 60);

  // bots
  const names = NAMES.slice();
  for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; }
  for (let i = 0; i < BOT_COUNT; i++) {
    let spec;
    if (rand() < 0.22) { const pool = A.SKINS.filter((s, k) => k > 0 && (!s.event || s.event === EVENT.id)); const s = pool[Math.floor(rand() * pool.length)]; spec = Object.assign({ seed: Math.floor(rand() * 1e9) }, s); }
    else spec = A.botSpec(rand);
    const b = newPlanet(names[i], spec, false);
    const noob = i === 0 && rounds < 2;
    const skill = noob ? 0.05 : clamp(skillMean + (rand() - 0.5) * 0.6, 0.08, 0.95);
    b.bot = makeBrain(skill, noob ? 'hoarder' : pick(STYLE_KEYS));
    W.planets.push(b);
    if (noob) {
      b.name = 'sleepy_kev'; b.nameCv = nameSprite(b.name, false);
      placePlanet(b, px + 330, py - 260, 1, 0);
      b.bot.keep = 99; b.bot.aggro = 0.05;
    } else {
      const s = clearSpot(500, 18);
      placePlanet(b, s[0], s[1], 4 + Math.floor(rand() * 5), 0);
    }
    if (rand() < 0.12) say(b, pick(CHAT.hi));
  }
  // loose moons: clusters plus scatter
  while (W.loose.length < LOOSE_TARGET * 0.62) { const [x, y] = randomPoint(ARENA_R * 0.92); spawnField(x, y, 6 + Math.floor(rand() * 7), rr(50, 90)); }
  while (W.loose.length < LOOSE_TARGET) { const [x, y] = randomPoint(ARENA_R * 0.97); spawnLoose(x, y, undefined, 0, 0, 0, 0, 0, true); }
  // Halloween: pumpkins in play from the start, the first one within reach of the player
  if (EVENT.on) {
    spawnLoose(px - 200, py - 60, PK, 0, 0, 0, 0, 0, true);
    for (let i = 0; i < 3; i++) { const s = clearSpot(300, 10); spawnLoose(s[0], s[1], PK, 0, 0, 0, 0, 0, true); }
  }
  for (const L of W.loose) L.age = 1;

  cam.x = player.x; cam.y = player.y; cam.z = targetZoom();
  updateBoard();

  $('timer').textContent = fmtTime(W.left); $('timer').classList.remove('hot');
  $('feed').innerHTML = '';
  Sfx.intense(false);
}

function startPlay() {
  G.state = 'play';
  G.firstInput = true;
  Ads.gameplayStart();
  Sfx.go();
  Sfx.musicOn();
  showDailyPill();
  if (EVENT.on) banner('HAUNTED ORBIT', 'grab a pumpkin: your next fling is a bomb');
}

// ---------------------------------------------------------------- simulation
function update(dt) {
  G.t += dt;
  const live = G.state === 'play' || G.state === 'dead';
  if (live) {
    W.time += dt; W.left = Math.max(0, ROUND_TIME - W.time);
    roundEvents(dt);
  }
  if (G.comboT > 0) G.comboT -= dt;

  if (G.state === 'ready') player.shield = Math.max(player.shield, 1.5);
  // player input
  if (player.alive) {
    if (G.autopilot && player.bot) botSteer(player, player.bot, dt);
    else steerPlayer(dt);
  }
  // bots
  for (const p of W.planets) {
    if (p.bot && p !== player) {
      if (p.alive) botSteer(p, p.bot, dt);
      else { p.deadT += dt; if (p.deadT > 2.8 && G.state !== 'end') { const s = clearSpot(450, 16); placePlanet(p, s[0], s[1], 4, 2.2); p.bot.goal = 'wander'; p.bot.think = 0; } }
    }
  }
  for (const p of W.planets) if (p.alive) movePlanet(p, dt);
  if (live || G.state === 'ready') interact(dt);
  for (const p of W.planets) if (p.alive) { updateOrbit(p, dt); updateFace(p, dt); }

  // loose moons
  const drag = Math.exp(-3.2 * dt);
  for (const L of W.loose) {
    L.x += L.vx * dt; L.y += L.vy * dt; L.vx *= drag; L.vy *= drag;
    L.lock -= dt; L.ownLock -= dt; L.age += dt;
    const d2 = L.x * L.x + L.y * L.y;
    if (d2 > (ARENA_R - 10) * (ARENA_R - 10)) { const d = Math.sqrt(d2), nx = L.x / d, ny = L.y / d; L.x = nx * (ARENA_R - 10); L.y = ny * (ARENA_R - 10); const vn = L.vx * nx + L.vy * ny; if (vn > 0) { L.vx -= 1.8 * vn * nx; L.vy -= 1.8 * vn * ny; } }
  }
  // projectiles
  for (let i = W.projs.length - 1; i >= 0; i--) {
    const j = W.projs[i];
    j.px = j.x; j.py = j.y;
    j.x += j.vx * dt; j.y += j.vy * dt; j.life -= dt;
    let hit = null;
    for (const p of W.planets) {
      if (!p.alive || p.id === j.owner) continue;
      if (Math.abs(p.x - j.x) > p.r + 40 || Math.abs(p.y - j.y) > p.r + 40) continue;
      if (segCircle(j.px, j.py, j.x, j.y, p.x, p.y, p.r + MOON_R)) { hit = p; break; }
    }
    const out = j.x * j.x + j.y * j.y > ARENA_R * ARENA_R;
    if (hit) { W.projs.splice(i, 1); if (j.bomb) explode(j.x, j.y, byId(j.owner), hit); else hitPlanet(hit, j); }
    else if (j.life <= 0 || out) {
      W.projs.splice(i, 1);
      if (j.bomb) explode(j.x, j.y, byId(j.owner), null);
      else spawnLoose(j.x, j.y, j.c, j.vx * 0.3, j.vy * 0.3, 0.1, j.owner, 0.5, false);
    }
  }
  // remove collected loose moons
  let w = 0;
  for (let i = 0; i < W.loose.length; i++) { const L = W.loose[i]; if (!L.dead) W.loose[w++] = L; }
  W.loose.length = w;
  // top up the field
  if (live || G.state === 'ready') {
    const tot = totalMoons();
    if (W.loose.length < LOOSE_TARGET * 0.92 && tot < MAX_TOTAL && rand() < dt * 3) {
      const s = clearSpot(260, 8); spawnField(s[0], s[1], 5 + Math.floor(rand() * 5), rr(40, 80));
    }
    if (EVENT.on && (W.pkT -= dt) <= 0) {
      W.pkT = PK_EVERY;
      let have = 0; for (const L of W.loose) if (L.c === PK) have++;
      for (const p of W.planets) if (p.alive) have += p.pkN || 0;
      if (have < PK_MAX) { const s = clearSpot(200, 8); spawnLoose(s[0], s[1], PK, 0, 0, 0, 0, 0, true); part('ring', s[0], s[1], 0, 0, 0.6, 60, '#ffb24a'); }
    }
    if (W.rainLeft > 0 && tot < MAX_TOTAL + 200) { W.rainLeft -= dt; if (rand() < dt * 9) { const [x, y] = randomPoint(ARENA_R * 0.9); spawnLoose(x, y, undefined, 0, 0, 0, 0, 0, true); part('star', x, y, 0, -30, 0.5, 8, '#ffffff'); } }
  }
  // particles and popups
  for (let i = W.parts.length - 1; i >= 0; i--) {
    const q = W.parts[i]; q.t += dt;
    if (q.t >= q.life) { W.parts[i] = W.parts[W.parts.length - 1]; W.parts.pop(); continue; }
    const k = Math.exp(-q.drag * dt); q.vx *= k; q.vy *= k; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
  }
  for (let i = W.pops.length - 1; i >= 0; i--) { const q = W.pops[i]; q.t += dt; if (q.t >= q.life) W.pops.splice(i, 1); }
  if (W.golden) W.golden.t += dt;
}

function steerPlayer(dt) {
  const p = player;
  let dx = 0, dy = 0, mag = -1;
  const k = In.keys;
  const kx = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
  const ky = (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0);
  if (kx || ky) { dx = kx; dy = ky; mag = 1; }
  else if (In.joy && In.joy.moved) {
    dx = In.joy.x - In.joy.ox; dy = In.joy.y - In.joy.oy;
    const l = Math.hypot(dx, dy);
    if (l > 5) mag = clamp(l / 42, 0.25, 1); else { dx = p.hx; dy = p.hy; mag = p.mag; }
  } else if (In.type === 'mouse' && In.mouseIn && In.mx >= 0) {
    const s = toScreen(p.x, p.y);
    dx = In.mx - s.x; dy = In.my - s.y;
    const l = Math.hypot(dx, dy), rs = p.r * cam.z;
    mag = clamp((l - rs * 0.6) / 90, 0, 1);
  } else if (In.type === 'touch' && G.state === 'play') { dx = p.hx; dy = p.hy; mag = p.mag > 0 ? Math.max(p.mag, 0.9) : 0; }
  if (mag < 0) { mag = In.type === 'mouse' ? p.mag : 0; dx = p.hx; dy = p.hy; }
  const l = Math.hypot(dx, dy);
  if (l > 0.0001) { p.hx = dx / l; p.hy = dy / l; }
  p.mag = G.state === 'ready' ? 0 : mag;
}

function movePlanet(p, dt) {
  const n = p.moons.length;
  const spd = BASE_SPEED / (1 + n / 120) * (p.isPlayer ? 1.04 : (0.86 + 0.14 * (p.bot ? p.bot.skill : 1)) * G.botPace);
  const k = Math.min(1, (p.stun > 0 ? 3 : ACCEL) * dt);
  const ovx = p.vx, ovy = p.vy;
  p.vx += (p.hx * p.mag * spd - p.vx) * k;
  p.vy += (p.hy * p.mag * spd - p.vy) * k;
  p.ax = clamp((p.vx - ovx) / dt, -6000, 6000); p.ay = clamp((p.vy - ovy) / dt, -6000, 6000);
  p.x += p.vx * dt; p.y += p.vy * dt;
  const d = Math.hypot(p.x, p.y), lim = ARENA_R - p.r;
  if (d > lim) {
    const nx = p.x / d, ny = p.y / d; p.x = nx * lim; p.y = ny * lim;
    const vn = p.vx * nx + p.vy * ny;
    if (vn > 0) { p.vx -= 1.6 * vn * nx; p.vy -= 1.6 * vn * ny; squash(p, nx, ny, 0.1); p.stun = 0.12; if (p.isPlayer) Sfx.bump(); }
  }
  const sp = Math.hypot(p.vx, p.vy);
  p.rot += p.rotV * dt * (0.4 + sp / spd);
  p.inv -= dt; p.shield -= dt; p.stun -= dt; p.flingCD -= dt; p.snatchCD -= dt; p.flash = Math.max(0, p.flash - dt * 5);
  if (p.chatT > 0) p.chatT -= dt;
  // squash spring
  p.sqv += (-p.sq * 260 - p.sqv * 16) * dt; p.sq += p.sqv * dt;
  // trail
  p.trailT -= dt;
  if (p.trailT <= 0) {
    p.trailT = 0.035;
    p.trail[p.trailHead * 2] = p.x; p.trail[p.trailHead * 2 + 1] = p.y;
    p.trailHead = (p.trailHead + 1) % 20; p.trailN = Math.min(14, p.trailN + 1);
  }
}

function updateOrbit(p, dt) {
  for (let i = 0; i < p.ringN.length; i++) p.phase[i] += (i % 2 ? -1 : 1) * (1.9 - i * 0.2) * dt;
  const K = 380, D = 39;
  for (const m of p.moons) {
    const a = p.phase[m.ring] + m.slot * TAU / p.ringN[m.ring], R = p.ringR[m.ring];
    const tx = Math.cos(a) * R, ty = Math.sin(a) * R;
    m.vx += ((tx - m.ox) * K - m.vx * D - p.ax * 0.9) * dt;
    m.vy += ((ty - m.oy) * K - m.vy * D - p.ay * 0.9) * dt;
    m.ox += m.vx * dt; m.oy += m.vy * dt;
  }
}

function updateFace(p, dt) {
  p.blinkT -= dt;
  if (p.blinkT <= 0) { p.blink = 1; p.blinkT = rr(2, 4.5); }
  p.blink = Math.max(0, p.blink - dt * 7);
  if (p.moodT > 0) { p.moodT -= dt; if (p.moodT <= 0) p.mood = 'idle'; }
  // look where you are going, or at your target
  let lx = p.vx, ly = p.vy;
  if (p.bot && p.bot.tgt && p.bot.tgt.alive) { lx = p.bot.tgt.x - p.x; ly = p.bot.tgt.y - p.y; }
  else if (p.isPlayer && G.reticle) { lx = G.reticle.x - p.x; ly = G.reticle.y - p.y; }
  const l = Math.hypot(lx, ly);
  const tx = l > 1 ? lx / l : 0, ty = l > 1 ? ly / l : 0;
  p.lx += (tx - p.lx) * Math.min(1, dt * 10); p.ly += (ty - p.ly) * Math.min(1, dt * 10);
}

function interact(dt) {
  const P = W.planets;
  buildGrid();
  // collect loose moons (only the cells around each planet are checked)
  for (const p of P) {
    if (!p.alive) continue;
    const reach = p.r + 30, r2 = reach * reach;
    forNear(p.x, p.y, reach + 12, L => {
      if (L.dead || L.lock > 0 || (L.owner === p.id && L.ownLock > 0)) return;
      const dx = L.x - p.x, dy = L.y - p.y;
      if (dx * dx + dy * dy < r2 && !collect(p, L)) return false;   // full planet: stop checking
    });
  }
  // golden
  if (W.golden) for (const p of P) {
    if (!p.alive) continue;
    const reach = p.r + 34;
    if (Math.abs(W.golden.x - p.x) < reach && Math.abs(W.golden.y - p.y) < reach && Math.hypot(W.golden.x - p.x, W.golden.y - p.y) < reach) { grabGolden(p); break; }
  }
  // pairs: body bumps and snatching
  for (let i = 0; i < P.length; i++) {
    const a = P[i]; if (!a.alive) continue;
    for (let j = i + 1; j < P.length; j++) {
      const b = P[j]; if (!b.alive) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const reach = a.outerR + b.outerR + 10;
      if (dx > reach || dx < -reach || dy > reach || dy < -reach) continue;
      const d2 = dx * dx + dy * dy;
      const rs = a.r + b.r;
      if (d2 < rs * rs) {
        const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d, ov = rs - d;
        const ma = a.r * a.r, mb = b.r * b.r, tot = ma + mb;
        a.x -= nx * ov * mb / tot; a.y -= ny * ov * mb / tot; b.x += nx * ov * ma / tot; b.y += ny * ov * ma / tot;
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) {
          const jm = -1.8 * rv / (1 / ma + 1 / mb);
          a.vx -= jm / ma * nx; a.vy -= jm / ma * ny; b.vx += jm / mb * nx; b.vy += jm / mb * ny;
          a.stun = b.stun = 0.12;
          const amt = Math.min(0.2, -rv / 1500);
          squash(a, nx, ny, amt); squash(b, nx, ny, amt);
          if ((a.isPlayer || b.isPlayer) && -rv > 80) { Sfx.bump(); addTrauma(0.08); }
        }
      }
      // snatching: only the smaller planet can steal from the bigger one
      const na = a.moons.length, nb = b.moons.length;
      if (na === nb) continue;
      const small = na < nb ? a : b, big = na < nb ? b : a;
      if (big.shield > 0 || small.snatchCD > 0 || small.shield > 0.6) continue;
      if (d2 > (small.r + big.outerR + 4) * (small.r + big.outerR + 4)) continue;
      const rr2 = (small.r + MOON_R + 1) * (small.r + MOON_R + 1);
      const ox = big.x - small.x, oy = big.y - small.y;
      for (let k = big.moons.length - 1; k >= 0; k--) {
        const m = big.moons[k];
        const mx = ox + m.ox, my = oy + m.oy;
        if (mx * mx + my * my < rr2) { snatchMoon(small, big, k); break; }
      }
    }
  }
}

      c.drawImage(mset[L.c], L.x * K + OX - w / 2, (L.y + bob) * K + OY - w / 2, w, w);
    } else c.drawImage(mset[L.c], Math.round(L.x * K + OX - mh), Math.round((L.y + bob) * K + OY - mh));
  }
  if (pkLoose) {
    // loose pumpkins: bigger, with a warm pulse so they read as a prize
    const ps = mset[PK], ph = ps.width / 2;
    for (const L of pkLoose) {
      const x = L.x * K + OX, y = L.y * K + OY, pulse = 1 + Math.sin(t * 5 + L.spin) * 0.08;
      c.globalAlpha = 0.35; c.fillStyle = '#ffb24a'; c.beginPath(); c.arc(x, y, ph * 1.25 * pulse, 0, TAU); c.fill(); c.globalAlpha = 1;
      c.drawImage(ps, x - ph * pulse, y - ph * pulse, ph * 2 * pulse, ph * 2 * pulse);
    }
  }
  c.setTransform(K, 0, 0, K, OX, OY);
  // golden moon
  if (W.golden && inView(W.golden.x, W.golden.y, 60)) {
    const g = W.golden, s = 34 + Math.sin(t * 5) * 3;
    c.save(); c.translate(g.x, g.y); c.rotate(Math.sin(t * 2) * 0.2);
    c.drawImage(SPR.gold, -s, -s, s * 2, s * 2); c.restore();
    if (G.quality > 0 && rand() < 0.3) part('star', g.x + rr(-24, 24), g.y + rr(-24, 24), 0, -20, 0.6, rr(4, 7), '#fff6b8');
  }

  // planets, biggest first so small snatchers draw on top
  const order = W.planets.filter(p => p.alive && inView(p.x, p.y, p.outerR + 10)).sort((a, b) => b.moons.length - a.moons.length);
  for (const p of order) drawPlanet(c, p, t, z, mset, mh, K, OX, OY);

  // projectiles
  c.lineCap = 'round';
  for (const j of W.projs) {
    if (!inView(j.x, j.y, 60)) continue;
    c.strokeStyle = mcol(j.c); c.globalAlpha = 0.55; c.lineWidth = MOON_R * (j.bomb ? 2.6 : 1.5);
    c.beginPath(); c.moveTo(j.x - j.vx * 0.045, j.y - j.vy * 0.045); c.lineTo(j.x, j.y); c.stroke();
    c.globalAlpha = 1;

    if (j.bomb) { c.save(); c.translate(j.x, j.y); c.rotate(t * 9); c.drawImage(SPR.moons[j.c], -s / 2, -s / 2, s, s); c.restore(); }

  }
  // particles
  drawParts(c, inView);

  // screen space overlays
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (CLEAN) { if (EVENT.on) drawBats(c, t); return; }
  drawNames(c, order, t, z);
  drawReticle(c, t, z);
  drawPops(c);
  drawJoystick(c);
  drawGoldArrow(c, t);
  drawMinimap(c, t);

}

// Halloween: a few bats cross the screen now and then (screen space, cheap)
const bats = [];
function drawBats(c, t) {
  if (bats.length < 4 && Math.random() < 0.006) {
    const dir = Math.random() < 0.5 ? 1 : -1, y = vh * (0.18 + Math.random() * 0.55), n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) bats.push({ x: dir > 0 ? -40 - i * 36 : vw + 40 + i * 36, y: y + (Math.random() - 0.5) * 50, vx: dir * (120 + Math.random() * 70), s: 9 + Math.random() * 6, ph: Math.random() * 6, t0: t });
  }
  for (let i = bats.length - 1; i >= 0; i--) {
    const b = bats[i], dt = t - b.t0;
    const x = b.x + b.vx * dt, y = b.y + Math.sin(dt * 3 + b.ph) * 14;
    if (x < -120 || x > vw + 120) { bats.splice(i, 1); continue; }
    A.bat(c, x, y, b.s, dt * 18 + b.ph, 'rgba(42,20,88,0.85)');
  }
}

function drawTrail(c, p, t) {
  const kind = p.isPlayer ? Profile.d.trail : 'comet';
  const N = p.trailN, H = p.trailHead;
  const r = p.r;
  if (kind === 'rainbow') {
    c.lineCap = 'round';
    for (let i = 1; i < N; i++) {
      const a = ((H - i) % 20 + 20) % 20, b = ((H - i - 1) % 20 + 20) % 20, f = 1 - i / N;
      c.strokeStyle = 'hsl(' + ((t * 160 + i * 22) % 360) + ',95%,65%)'; c.lineWidth = r * 1.3 * f; c.globalAlpha = 0.75 * f;
      c.beginPath(); c.moveTo(p.trail[a * 2], p.trail[a * 2 + 1]); c.lineTo(p.trail[b * 2], p.trail[b * 2 + 1]); c.stroke();
    }

  }

  const col = kind === 'fire' ? '#ff9a3c' : p.color;
  c.fillStyle = col;
  const step = G.quality > 1 && p.isPlayer ? 1 : 2;
  const cc = kind === 'candycorn' ? ['#ffd23f', '#ff8a1f', '#ffffff'] : null;
  for (let i = 1; i < N; i += step) {
    const a = ((H - i) % 20 + 20) % 20, f = 1 - i / N;
    c.globalAlpha = cc ? 0.7 * f : 0.26 * f;
    if (cc) c.fillStyle = cc[Math.floor(i / 2) % 3];
    c.beginPath(); c.arc(p.trail[a * 2], p.trail[a * 2 + 1], r * (0.15 + 0.6 * f), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
  if (p.isPlayer && kind !== 'comet' && Math.hypot(p.vx, p.vy) > 60) {
    const bx = p.x - p.hx * r * 0.8, by = p.y - p.hy * r * 0.8;
    if (kind === 'sparkle' && rand() < 0.6) part('star', bx + rr(-r, r) * 0.6, by + rr(-r, r) * 0.6, -p.vx * 0.1, -p.vy * 0.1, 0.5, rr(4, 7), pick(['#ffffff', '#ffe45c', '#7df3ff']));
    if (kind === 'bubbles' && rand() < 0.35) part('bubble', bx + rr(-r, r) * 0.6, by + rr(-r, r) * 0.6, -p.vx * 0.15, -p.vy * 0.15, 0.8, rr(4, 8), '#c9f6ff', 1.5);
    if (kind === 'hearts' && rand() < 0.3) part('heart', bx + rr(-r, r) * 0.5, by + rr(-r, r) * 0.5, -p.vx * 0.12, -p.vy * 0.12 - 20, 0.7, rr(6, 9), pick(['#ff5fa8', '#ff9ad5']), 1.5);
    if (kind === 'fire' && rand() < 0.7) part('dot', bx + rr(-r, r) * 0.5, by + rr(-r, r) * 0.5, -p.vx * 0.3 + rr(-30, 30), -p.vy * 0.3 + rr(-30, 30), 0.35, rr(5, 9), pick(['#ffd23f', '#ff7b1c', '#ff4f3a']), 2);
  }
}

function drawPlanet(c, p, t, z, mset, mh, K, OX, OY) {
  // moons in device pixels
  c.setTransform(1, 0, 0, 1, 0, 0);

  if (p.pkN > 0) {
    const ph = mset[PK].width / 2 - mh;
    for (const m of p.moons) {
      if (m.c === PK) c.drawImage(mset[PK], Math.round(bx + m.ox * K - ph), Math.round(by + m.oy * K - ph));

    const surf = mipFor(p.surf, dev);
    c.save(); c.rotate(p.rot); c.drawImage(surf, -r, -r, 2 * r, 2 * r); c.restore();
    c.drawImage(shade, -r - pad, -r - pad, 2 * r + 2 * pad, 2 * r + 2 * pad);

    else faceCached(c, p, r, devR, leader);
  } else if (devR > 6) {
    // small on screen: two eyes, no outlines (a fraction of the draw calls)
    c.fillStyle = '#ffffff'; c.beginPath();
    c.arc(-r * 0.34, -r * 0.1, r * 0.22, 0, TAU); c.arc(r * 0.34, -r * 0.1, r * 0.22, 0, TAU); c.fill();
    c.fillStyle = INK; c.beginPath();
    c.arc(-r * 0.34 + p.lx * r * 0.07, -r * 0.1 + p.ly * r * 0.06, r * 0.12, 0, TAU); c.arc(r * 0.34 + p.lx * r * 0.07, -r * 0.1 + p.ly * r * 0.06, r * 0.12, 0, TAU); c.fill();

}

// Faces are drawn into a per-planet sprite and only redrawn when what they show changes (mood, blink step,
// look direction in quarter steps, on-screen size). A face is about 20 anti-aliased path operations; the sprite is one draw.
function faceCached(c, p, r, devR, leader) {
  const sb = Math.max(8, Math.round(devR / 3) * 3);
  const bl = p.blink < 0.3 ? 0 : p.blink < 0.75 ? 0.5 : 1;
  const qx = Math.round(p.lx * 4) / 4, qy = Math.round(p.ly * 4) / 4;
  const key = sb + '|' + p.mood + '|' + bl + '|' + qx + '|' + qy + '|' + (leader ? 1 : 0);
  let fc = p.faceCv;
  if (p.faceKey !== key) {
    const n = sb * 2 + 8;
    if (!fc || fc.width !== n) fc = p.faceCv = A.mk(n);
    const x = fc.getContext('2d');
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, n, n);
    A.drawFace(x, n / 2, n / 2, sb, { lx: qx, ly: qy, blink: bl, mood: p.mood, shades: leader, t: 0, jack: EVENT.on && !leader });
    p.faceKey = key;
  }
  const h = fc.width / 2 * r / sb;
  c.drawImage(fc, -h, -h, h * 2, h * 2);
}

function drawParts(c, inView) {
  for (const q of W.parts) {
    if (!inView(q.x, q.y, q.size + 200)) continue;
    const f = q.t / q.life, a = 1 - f;
    switch (q.kind) {
      case 'dot': c.globalAlpha = a; c.fillStyle = q.color; c.beginPath(); c.arc(q.x, q.y, q.size * (1 - f * 0.6), 0, TAU); c.fill(); break;
      case 'spark': c.globalAlpha = a; c.strokeStyle = q.color; c.lineWidth = q.size * 0.6; c.lineCap = 'round'; c.beginPath(); c.moveTo(q.x, q.y); c.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03); c.stroke(); break;

        c.fillStyle = q.color; c.strokeStyle = INK; c.lineWidth = 2.5; const s = q.size;

      }

      case 'bubble': c.globalAlpha = a; c.strokeStyle = q.color; c.lineWidth = 1.6; c.beginPath(); c.arc(q.x, q.y, q.size * (0.6 + f * 0.6), 0, TAU); c.stroke(); break;

}

function drawNames(c, order, t, z) {
  for (const p of order) {
    const s = toScreen(p.x, p.y - p.outerR - 6);
    // name tags are pre-sized to device pixels and drawn unscaled at whole-pixel positions (no resampling every frame)
    if (!p.nameD || p.nameD.dpr !== dpr || p.nameD.name !== p.name) p.nameD = { cv: nameSprite(p.name, p.isPlayer, 15 / 46 * dpr), dpr, name: p.name };
    const nc = p.nameD.cv, h = nc.height / dpr, w = nc.width / dpr;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(nc, Math.round((s.x - w / 2 + cam.sx) * dpr), Math.round((s.y - h + cam.sy - (p.crown ? 14 : 0)) * dpr));
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (p.chatT > 0 && p.chat) {
      const a = Math.min(1, p.chatT * 3);
      c.globalAlpha = a;
      c.font = '700 13px Fredoka, system-ui, sans-serif';
      const tw = c.measureText(p.chat).width + 16, bx = s.x - tw / 2 + cam.sx, by = s.y - h - 30 + cam.sy - (p.crown ? 14 : 0);
      c.fillStyle = '#ffffff'; c.strokeStyle = INK; c.lineWidth = 2;
      rrect(c, bx, by, tw, 22, 10); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(s.x - 5 + cam.sx, by + 21); c.lineTo(s.x + cam.sx, by + 28); c.lineTo(s.x + 5 + cam.sx, by + 21); c.fill();
      c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(p.chat, s.x + cam.sx, by + 11.5);

function rrect(c, x, y, w, h, r) {

// Outlined text is rasterised once into a sprite and reused (stroking text every frame was one of the

function textSprite(text, color, size, sw) {

  const cv = A.mk(10, 10); let x = cv.getContext('2d');
  x.font = fs + 'px "Lilita One", Fredoka, sans-serif';
  const w = Math.ceil(x.measureText(text).width) + pad * 2 + 2;
  cv.width = w; cv.height = Math.ceil(fs * 1.25) + pad * 2;
  x = cv.getContext('2d');
  x.font = fs + 'px "Lilita One", Fredoka, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  x.lineWidth = (sw || 5) * k; x.strokeStyle = INK; x.strokeText(text, w / 2, cv.height / 2);

function drawPops(c) {
  for (const q of W.pops) {
    const f = q.t / q.life;
    const s = toScreen(q.x, q.y);
    const sc = (f < 0.15 ? 0.6 + f / 0.15 * 0.6 : f < 0.25 ? 1.2 - (f - 0.15) * 2 : 1) / 1.25;
    c.globalAlpha = f > 0.7 ? (1 - f) / 0.3 : 1;

    const w = sp.w * sc, h = sp.h * sc;
    c.drawImage(sp.cv, s.x - w / 2, s.y - f * 34 - h / 2, w, h);
  }

}
function drawReticle(c, t, z) {
  const q = G.reticle;
  if (!q || !q.alive || G.state !== 'play') return;
  const s = toScreen(q.x, q.y);
  const R = q.r * z + 10 + Math.sin(t * 8) * 2;
  c.save(); c.translate(s.x + cam.sx, s.y + cam.sy); c.rotate(t * 1.2);
  for (let i = 0; i < 4; i++) {
    c.rotate(Math.PI / 2);

    c.lineWidth = 7; c.strokeStyle = INK; c.lineCap = 'round'; c.stroke();
    c.lineWidth = 3.5; c.strokeStyle = q.moons.length <= koLimit(player) ? '#ff5fa8' : '#ffd23f'; c.stroke();
  }
  c.restore();
  const koable = q.moons.length <= koLimit(player);
  if (koable) {
    const sp = textSprite('KO!', '#ff5fa8', 15, 4);
    c.drawImage(sp.cv, s.x + cam.sx - sp.w / 2.5, s.y + cam.sy + R + 14 - sp.h / 2.5, sp.w / 1.25, sp.h / 1.25);
  }
}
function drawJoystick(c) {
  const j = In.joy;
  if (!j || !j.moved) return;
  let dx = j.x - j.ox, dy = j.y - j.oy; const l = Math.hypot(dx, dy), m = 46;
  if (l > m) { dx *= m / l; dy *= m / l; }
  c.globalAlpha = 0.3; c.fillStyle = '#ffffff'; c.beginPath(); c.arc(j.ox, j.oy, m, 0, TAU); c.fill();
  c.globalAlpha = 0.65; c.beginPath(); c.arc(j.ox + dx, j.oy + dy, 20, 0, TAU); c.fill();
  c.globalAlpha = 1;
}
function drawGoldArrow(c, t) {
  const g = W.golden;
  if (!g || !player) return;
  const s = toScreen(g.x, g.y);
  const m = 46;
  if (s.x > m && s.x < vw - m && s.y > m + 60 && s.y < vh - m) return;
  const cx = vw / 2, cy = vh / 2;
  let dx = s.x - cx, dy = s.y - cy;
  const k = Math.min((vw / 2 - m) / Math.abs(dx || 1e-6), (vh / 2 - m - 30) / Math.abs(dy || 1e-6));
  const ex = cx + dx * k, ey = cy + dy * k + 15;
  const a = Math.atan2(dy, dx);

  const pulse = 1 + Math.sin(t * 8) * 0.08;
  c.scale(pulse, pulse);
  c.drawImage(SPR.gold, -22, -22, 44, 44);
  c.rotate(a);
  c.fillStyle = '#ffd23f'; c.strokeStyle = INK; c.lineWidth = 3;
  c.beginPath(); c.moveTo(34, 0); c.lineTo(22, -10); c.lineTo(22, 10); c.closePath(); c.fill(); c.stroke();
  c.restore();
}
const mini = { cv: null, t: 0, R: 0 };
function drawMinimap(c, t) {
  const R = Math.round(Math.min(52, Math.min(vw, vh) * 0.11));

// planet portrait for results, KO card, shop and share card
function drawPlanetCard(cv, spec, mood, shades, trail) {
  const c = cv.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);

  const surf = A.surfaceSprite(spec, 256), sh = SPR.shade;
  if (spec.ring) A.drawRing(c, x, y, r, spec.ring, false);
  c.drawImage(surf, x - r, y - r, 2 * r, 2 * r);
  const pad = sh.pad * r / 128; c.drawImage(sh, x - r - pad, y - r - pad, 2 * r + 2 * pad, 2 * r + 2 * pad);
  if (spec.ring) A.drawRing(c, x, y, r, spec.ring, true);
  A.drawFace(c, x, y, r, { lx: 0.2, ly: 0.1, mood, shades, t: 0 });

    const n = 8, ms = r * 0.32;
    for (let i = 0; i < n; i++) { const a = i / n * TAU + 0.3, R = r * 1.42; c.drawImage(SPR.moons[i % SPR.moons.length], x + Math.cos(a) * R - ms / 2, y + Math.sin(a) * R * 0.95 - ms / 2, ms, ms); }

}
function drawTrailPreview(c, id, x, y, r, spec) {
  const N = 9;
  for (let i = N; i >= 1; i--) {
    const f = 1 - i / (N + 1), tx = x - i * r * 0.32, ty = y + i * r * 0.12;
    if (id === 'rainbow') { c.fillStyle = 'hsl(' + (i * 40) + ',95%,65%)'; c.globalAlpha = 0.85; }
    else if (id === 'candycorn') { c.fillStyle = ['#ffd23f', '#ff8a1f', '#ffffff'][Math.floor(i / 2) % 3]; c.globalAlpha = 0.9; }
    else if (id === 'fire') { c.fillStyle = ['#ffd23f', '#ff7b1c', '#ff4f3a'][i % 3]; c.globalAlpha = 0.5 + f * 0.4; }
    else { c.fillStyle = spec.trail || '#ffffff'; c.globalAlpha = 0.35 * f + 0.1; }
    c.beginPath(); c.arc(tx, ty, r * (0.3 + 0.6 * f), 0, TAU); c.fill();
    c.globalAlpha = 1;
    if (id === 'sparkle' && i % 2) A.star(c, tx, ty - r * 0.5, r * 0.22, i % 4 === 1 ? '#ffe45c' : '#ffffff');
    if (id === 'bubbles' && i % 2) { c.strokeStyle = '#7df3ff'; c.lineWidth = 2; c.beginPath(); c.arc(tx, ty - r * 0.6, r * 0.14, 0, TAU); c.stroke(); }

}
